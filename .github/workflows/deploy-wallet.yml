name: Deploy Web Wallet and Architecture Site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'wasm-wallet/**'
      - 'src/core/**'
      - 'src/wallet/**'
      - '.github/workflows/deploy-wallet.yml'
      - '.github/scripts/check-site.js'
  # Lets a failed or skipped deploy be re-run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- RUST & WASM BUILD ---
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build Wasm Wallet
        run: |
          cd wasm-wallet
          wasm-pack build --target web --release

      # --- NODE & JS BUNDLE BUILD ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # wrangler 4 (used by the Cloudflare step below) needs Node >= 22.
          node-version: '22'

      - name: Build WebRTC Light Client
        run: |
          cd wasm-wallet
          npm install
          npx rollup -c rollup.config.mjs

      # --- STAGING & DEPLOYMENT ---
      - name: Prepare Staging Directory
        run: |
          # 1. Create a clean staging area with a subfolder for the wallet app
          mkdir -p staging/wallet
          
          # 2. Copy the Architecture Site to the ROOT of staging
          cp -r wasm-wallet/website/* staging/
          
          # 3. Copy the Wasm Wallet files to the '/wallet' subdirectory
          cp wasm-wallet/index.html staging/wallet/
          cp wasm-wallet/manifest.json staging/wallet/
          cp wasm-wallet/sw.js staging/wallet/
          cp wasm-wallet/worker.js staging/wallet/
          cp wasm-wallet/miner.js staging/wallet/
          # miner.js imports gpu_miner.js, which loads pow.wgsl: without them
          # every mining thread fails to start. pool_client.bundle.js is the
          # pool's WebRTC transport.
          cp wasm-wallet/gpu_miner.js staging/wallet/
          cp wasm-wallet/pow.wgsl staging/wallet/
          cp wasm-wallet/light_client.bundle.js staging/wallet/
          cp wasm-wallet/pool_client.bundle.js staging/wallet/
          cp -r wasm-wallet/pkg staging/wallet/

          # 3b. Give every deploy its own service-worker cache. sw.js serves
          #     worker.js and the WASM cache-first, so returning users only pick
          #     up a new build when CACHE_NAME changes (see the note in sw.js).
          STAMP="midstate-wallet-${GITHUB_SHA:0:12}"
          sed -i "s/const CACHE_NAME = 'midstate-wallet-[^']*';/const CACHE_NAME = '${STAMP}';/" staging/wallet/sw.js
          grep -q "const CACHE_NAME = '${STAMP}';" staging/wallet/sw.js \
            || { echo "::error::could not stamp CACHE_NAME in sw.js"; exit 1; }

          # 4. Verification for logs
          echo "Final Deployment Structure:"
          ls -R staging

      # A file the pages load but the list above leaves out is a 404 in
      # production; this stops the deploy instead.
      - name: Check the site has every file it loads
        run: node .github/scripts/check-site.js staging

      # Deploy the raw, unzipped files to Cloudflare first.
      #
      # cloudflare/pages-action was deprecated in 2024 and removed from GitHub
      # in September 2026 (unpatched CVE-2026-11325). A job that names a
      # missing action fails at "Set up job", before any step runs, so every
      # deploy since then failed in ~5s and neither Cloudflare nor GitHub
      # Pages got a new build. wrangler-action is Cloudflare's replacement.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./staging --project-name=midstate

      # NOW zip it up for GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './staging'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
