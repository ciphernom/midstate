name: Build Release Binaries

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.pkg_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (x86_64) — node + desktop GUI
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg_name: midstate-linux-amd64
            desktop: true

          # Raspberry Pi 3 & Zero 2 W (Cortex-A53) — node only
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pkg_name: midstate-rpi3-arm64
            rustflags: "-C target-cpu=cortex-a53 -C link-arg=-lgcc"

          # Raspberry Pi 4 (Cortex-A72) — node only
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pkg_name: midstate-rpi4-arm64
            rustflags: "-C target-cpu=cortex-a72 -C link-arg=-lgcc"

          # Raspberry Pi 5 (Cortex-A76) — node only
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pkg_name: midstate-rpi5-arm64
            rustflags: "-C target-cpu=cortex-a76 -C link-arg=-lgcc"

          # Windows (x86_64) — node + desktop GUI
          #
          # crt-static links the MSVC runtime into the binary instead of
          # importing VCRUNTIME140.dll from the Visual C++ Redistributable.
          # We ship a bare .exe with no installer, so there is nothing to
          # carry that redist along; a user without it gets a loader error
          # before main() ever runs. Costs a few hundred KB.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg_name: midstate-windows-amd64
            desktop: true
            rustflags: "-C target-feature=+crt-static"

          # macOS (Intel) — node + desktop GUI shipped as a .app bundle
          - os: macos-latest
            target: x86_64-apple-darwin
            pkg_name: midstate-macos-amd64
            desktop: true
            bundle_name: Midstate-Desktop-macos-amd64.app.zip

          # macOS (Apple Silicon / M1 / M2)
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg_name: midstate-macos-arm64
            desktop: true
            bundle_name: Midstate-Desktop-macos-arm64.app.zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config
        # Install aarch64 cross-compiler if the target requires it
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          sudo apt-get install -y gcc-aarch64-linux-gnu
        fi

    - name: Install Desktop GUI Dependencies (Linux)
      # eframe/winit links against X11, Wayland, xkbcommon and GL at build
      # time. Only the native x86_64 desktop build needs these.
      if: matrix.os == 'ubuntu-latest' && matrix.desktop
      run: |
        sudo apt-get install -y \
          libgl1-mesa-dev libegl1-mesa-dev \
          libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev \
          libxkbcommon-dev libxkbcommon-x11-dev \
          libwayland-dev \
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        # Cache keyed by package name to prevent the Pi builds from thrashing
        # each other (they share a target triple, differing only in RUSTFLAGS).
        key: ${{ matrix.target }}-${{ matrix.pkg_name }}

    - name: Build Release (node)
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        RUSTFLAGS: ${{ matrix.rustflags || '' }}
      # -p is explicit: the repo root is both a package and a workspace root,
      # so a bare `cargo build` leaves it ambiguous which members are built.
      run: cargo build --release --target ${{ matrix.target }} -p midstate

    - name: Build Release (desktop GUI)
      if: matrix.desktop
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        RUSTFLAGS: ${{ matrix.rustflags || '' }}
      run: cargo build --release --target ${{ matrix.target }} -p midstate-desktop

    # ── Smoke test ────────────────────────────────────────────────────────
    # The desktop build is `windows_subsystem = "windows"` in release, so it
    # has no console and any startup failure is invisible: no window, no
    # message, exit code only. This launches it, waits, and fails the step if
    # the process is already gone — which is the exact symptom users report as
    # "I double-clicked it and nothing happened".
    #
    # Output is captured via redirection: a GUI-subsystem process inherits
    # redirected standard handles from its parent even though Windows gives it
    # no console of its own.
    #
    # NOTE: these runners have no GPU and no vendor OpenGL ICD, so the only
    # OpenGL available is Windows' GDI Generic 1.1 implementation. eframe is
    # built with the `glow` backend and needs a real 3.3 context, so this step
    # may legitimately fail here while working fine on a machine with drivers.
    # That is informative, not a bug in the workflow — see the notes at the
    # bottom. `continue-on-error` keeps it from blocking releases until you
    # have decided what the failure means.
    - name: Smoke test (desktop GUI)
      if: matrix.os == 'windows-latest' && matrix.desktop
      shell: pwsh
      run: |
        $exe = "target\${{ matrix.target }}\release\midstate-desktop.exe"
        $out = "$env:RUNNER_TEMP\smoke-out.txt"
        $err = "$env:RUNNER_TEMP\smoke-err.txt"

        $env:MIDSTATE_DATA_DIR = "$env:RUNNER_TEMP\midstate-smoke"
        $env:MIDSTATE_RPC_PORT = "none"
        # Without this the error dialog blocks forever and the process looks
        # alive, so a failed start reads as a pass.
        $env:MIDSTATE_NO_DIALOG = "1"
        $env:RUST_LOG = "debug"
        $env:RUST_BACKTRACE = "1"

        $p = Start-Process -FilePath $exe -PassThru `
               -RedirectStandardOutput $out -RedirectStandardError $err
        Start-Sleep -Seconds 30

        $died = $p.HasExited
        $code = if ($died) { $p.ExitCode } else { "still running" }
        if (-not $died) { Stop-Process -Id $p.Id -Force }

        $log = ((Get-Content $out -Raw -ErrorAction SilentlyContinue) + "`n" +
                (Get-Content $err -Raw -ErrorAction SilentlyContinue))
        Write-Host "--- exit: $code"
        Write-Host $log

        # Most specific first: the one failure this environment cannot avoid,
        # then "never started at all", then any other early exit.
        if ($log -match 'egui_glow requires opengl') {
          Write-Host "::warning::runner has no OpenGL (GDI Generic) - expected, not a regression"
          exit 0
        }
        if ($log -notmatch 'starting on windows') {
          Write-Host "::error::no startup banner - died before logging began"
          exit 1
        }
        if ($died) {
          Write-Host "::error::midstate-desktop.exe exited within 30s (code $code)"
          exit 1
        }
        Write-Host "midstate-desktop.exe survived 30s"

    # ── Packaging ─────────────────────────────────────────────────────────
    # Binaries keep their canonical names inside an archive rather than being
    # renamed per platform. MiningSupervisor::find_binary() looks for a file
    # named exactly `midstate` / `midstate.exe` beside the running executable
    # or on PATH, so a release that ships `midstate-windows-amd64.exe` can
    # never start the hasher. Shipping the pair together in one archive fixes
    # mining on every platform.
    - name: Package (Linux / macOS)
      if: matrix.os != 'windows-latest'
      run: |
        set -euo pipefail
        REL="target/${{ matrix.target }}/release"
        STAGE="$RUNNER_TEMP/${{ matrix.pkg_name }}"
        rm -rf "$STAGE"; mkdir -p "$STAGE"
        cp "$REL/midstate" "$STAGE/"
        if [ "${{ matrix.desktop }}" = "true" ]; then
          cp "$REL/midstate-desktop" "$STAGE/"
        fi
        chmod +x "$STAGE"/*
        tar -czf "$RUNNER_TEMP/${{ matrix.pkg_name }}.tar.gz" \
          -C "$RUNNER_TEMP" "${{ matrix.pkg_name }}"

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $rel   = "target\${{ matrix.target }}\release"
        $stage = "$env:RUNNER_TEMP\${{ matrix.pkg_name }}"
        Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $stage | Out-Null
        Copy-Item "$rel\midstate.exe" $stage
        Copy-Item "$rel\midstate-desktop.exe" $stage
        Compress-Archive -Path "$stage\*" `
          -DestinationPath "$env:RUNNER_TEMP\${{ matrix.pkg_name }}.zip" -Force

    - name: Bundle macOS .app
      if: matrix.bundle_name != ''
      run: |
        set -euo pipefail
        REL="target/${{ matrix.target }}/release"
        APP="$REL/Midstate-Desktop.app"
        VERSION="0.0.0"
        if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi

        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
        cp "$REL/midstate-desktop" "$APP/Contents/MacOS/midstate-desktop"
        # The node binary rides along inside the bundle: find_binary() resolves
        # current_exe().parent(), which is Contents/MacOS, so mining only works
        # if `midstate` sits right here next to the GUI.
        cp "$REL/midstate" "$APP/Contents/MacOS/midstate"
        chmod +x "$APP/Contents/MacOS/midstate-desktop" "$APP/Contents/MacOS/midstate"

        # Build the .icns from the checked-in 1024px source. Every size macOS
        # asks for is generated — iconutil rejects an iconset with gaps.
        ICONSET="$RUNNER_TEMP/AppIcon.iconset"
        rm -rf "$ICONSET"; mkdir -p "$ICONSET"
        SRC="apps/desktop/assets/logo-1024.png"
        for s in 16 32 128 256 512; do
          sips -z "$s" "$s" "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
          d=$((s * 2))
          sips -z "$d" "$d" "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
        done
        iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

        cat > "$APP/Contents/Info.plist" <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key>                  <string>Midstate-Desktop</string>
          <key>CFBundleDisplayName</key>           <string>Midstate-Desktop</string>
          <key>CFBundleIdentifier</key>            <string>com.midstate.desktop</string>
          <key>CFBundleExecutable</key>            <string>midstate-desktop</string>
          <key>CFBundleIconFile</key>              <string>AppIcon</string>
          <key>CFBundlePackageType</key>           <string>APPL</string>
          <key>CFBundleInfoDictionaryVersion</key> <string>6.0</string>
          <key>CFBundleShortVersionString</key>    <string>__VERSION__</string>
          <key>CFBundleVersion</key>               <string>__VERSION__</string>
          <key>LSMinimumSystemVersion</key>        <string>11.0</string>
          <key>LSApplicationCategoryType</key>     <string>public.app-category.finance</string>
          <key>NSHighResolutionCapable</key>       <true/>
        </dict>
        </plist>
        PLIST
        # The heredoc is quoted (no shell expansion inside the XML) and indented
        # for readability, so strip the indent and substitute the version after.
        sed -i '' -e 's/^        //' -e "s/__VERSION__/$VERSION/g" "$APP/Contents/Info.plist"
        plutil -lint "$APP/Contents/Info.plist"

        # ditto, not zip: upload-artifact drops the executable bit and flattens
        # symlinks, which yields a bundle macOS refuses to launch.
        ditto -c -k --keepParent "$APP" "$REL/${{ matrix.bundle_name }}"

    - name: Upload Artifact (archive, Linux/macOS)
      if: matrix.os != 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.pkg_name }}
        path: ${{ runner.temp }}/${{ matrix.pkg_name }}.tar.gz
        if-no-files-found: error

    - name: Upload Artifact (archive, Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.pkg_name }}
        path: ${{ runner.temp }}/${{ matrix.pkg_name }}.zip
        if-no-files-found: error

    - name: Upload Artifact (macOS .app bundle)
      if: matrix.bundle_name != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.bundle_name }}
        path: target/${{ matrix.target }}/release/${{ matrix.bundle_name }}
        if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

# ─────────────────────────────────────────────────────────────────────────────
# NOTES
#
# Pi targets build the node only, by design — cross-compiling the GUI to
# arm64 would need arm64 X11/Wayland/GL libraries in the linker sysroot,
# which apt on an amd64 runner does not provide.
#
# WINDOWS SMOKE TEST. Launches the release GUI, waits 30s, then reads the
# captured log rather than trusting the exit code alone. Three outcomes:
#
#   * "egui_glow requires opengl" — expected here, NOT a regression. These
#     runners have no GPU and no vendor ICD, so Windows serves its built-in
#     GDI Generic 1.1 path, and the glow backend (eframe is built with
#     `glow` and no wgpu fallback) refuses it. The step warns and passes.
#   * No startup banner — the process died before tracing initialised. That
#     is a loader or packaging failure, and always a real bug.
#   * Any other early exit — a real regression. Read the dumped log.
#
# Confirmed 2026-08-12: this is the same failure users hit on machines with
# no graphics driver installed, where Windows falls back to "Microsoft Basic
# Display Adapter". main.rs catches the Err from run_native and shows a
# MessageBoxW, so those users now get an explanation instead of silence.
#
# That dialog is why this step sets MIDSTATE_NO_DIALOG=1. A modal box with
# nobody to click it never returns, so without the variable the process stays
# alive and a failed start reads as a pass — which is exactly what happened
# on this step's first run.
#
# SOFTWARE OPENGL. Mesa's llvmpipe opengl32.dll gives such machines a working
# GL 4.5, and egui is light enough to be usable on it. Do NOT ship it beside
# the executable: app-local DLLs win the DLL search order unconditionally, so
# every user with a real GPU would silently drop to software rendering. Put
# it in a software-gl\ subfolder with a README, and let anyone who cannot
# install a driver copy it up one level themselves.
#
# CRT-STATIC. The Windows target links the MSVC runtime statically so the
# shipped .exe needs no Visual C++ Redistributable — there is no installer to
# carry one along. This links cleanly as of 2026-08-12; if it ever stops,
# suspect a C dependency built against the dynamic runtime (mimalloc is the
# likely candidate; cc-rs normally follows the crt-static flag on its own).
# To confirm the dependency is actually gone, check a downloaded artifact's
# import table for VCRUNTIME140.dll:
#     x86_64-w64-mingw32-objdump -p midstate-desktop.exe | grep 'DLL Name'
#
# ASSET NAMES CHANGED. Releases now carry archives (midstate-windows-amd64.zip,
# midstate-linux-amd64.tar.gz, …) rather than bare renamed binaries, so any
# install docs or download links pointing at the old names need updating.
#
# The macOS bundle is UNSIGNED. Gatekeeper will refuse it on first launch
# ("unidentified developer", or "damaged" once the download carries a
# quarantine flag). Users can right-click the app and choose Open, or run:
#     xattr -dr com.apple.quarantine /Applications/Midstate-Desktop.app
# Removing that friction needs an Apple Developer account, then
# `codesign --deep --options runtime` followed by `xcrun notarytool submit`
# on the zip, with the certificate held as a repository secret.
# ─────────────────────────────────────────────────────────────────────────────
