name: Walk reference

# The CUDA benchmark keeps its own copy of the walk. This checks that the copy
# is still midstate's: its known answers are walk.rs's, its CPU self-test
# passes, and its kernels compile without spilling to local memory. It also
# runs the miner's kernels on the CPU, from their source and from the PTX the
# miner embeds. No GPU or CUDA toolkit needed.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/walk-reference/**'
      - 'src/core/walk.rs'
      - 'src/core/cuda/**'
      - '.github/workflows/walk-reference.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/walk-reference/**'
      - 'src/core/walk.rs'
      - 'src/core/cuda/**'
      - '.github/workflows/walk-reference.yml'
  workflow_dispatch:

jobs:
  cuda-bench:
    name: CUDA bench
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/walk-reference/cuda
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Known answers match src/core/walk.rs
        run: python3 ci/check_golden.py ../../../src/core/walk.rs walk_core.h

      - name: CPU self-test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread walk_cpu.cpp -o walk-cpu
          ./walk-cpu --selftest

      - name: Kernels compile and stay in registers
        run: sh ci/kernels.sh

      - name: The miner's PTX is built from these kernels
        working-directory: .
        run: sh src/core/cuda/gen_ptx.sh --check

      - name: The miner's kernels, run on the CPU as the miner launches them, give the known answers
        working-directory: src/core/cuda
        run: |
          g++ -O2 -std=c++17 -Wall -fsanitize=address,undefined -fno-sanitize-recover=undefined host_check.cpp -o "$RUNNER_TEMP/host_check"
          "$RUNNER_TEMP/host_check"

      - name: The miner's PTX itself, run on the CPU as PTX defines it, gives the known answers
        working-directory: src/core/cuda
        run: |
          python3 ptx_to_c.py walk_miner.ptx > "$RUNNER_TEMP/walk_miner_ptx.c"
          gcc -O1 -c "$RUNNER_TEMP/walk_miner_ptx.c" -o "$RUNNER_TEMP/walk_miner_ptx.o"
          g++ -O2 -std=c++17 -Wall ptx_check.cpp "$RUNNER_TEMP/walk_miner_ptx.o" -o "$RUNNER_TEMP/ptx_check"
          "$RUNNER_TEMP/ptx_check"
