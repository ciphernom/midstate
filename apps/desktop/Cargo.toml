[package]
name = "midstate-desktop"
version = "0.2.0"
edition = "2021"
description = "Midstate Desktop — native full-node wallet (egui). No webview, no npm."

[dependencies]
midstate-walletd = { path = "../../crates/walletd" }

# glow (OpenGL) backend on purpose: the midstate crate already ships wgpu 29
# for GPU mining, and letting eframe pin its own wgpu would compile a second
# wgpu major side by side. glow sidesteps that entirely.
eframe = { version = "0.31", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "x11",
    "wayland",
] }

qrcode = { version = "0.14", default-features = false }
tokio = { version = "1.35", features = ["full"] }
rand = "0.8"
hex = "0.4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
# The local UTC offset, for message times (read once, at start).
time = { version = "0.3", features = ["local-offset"] }

# Automatic updates (src/update.rs): ask GitHub for the latest release, check
# its signed manifest, fetch and unpack this computer's archive.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
ed25519-dalek = "2"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }

[dev-dependencies]
tempfile = "3.8"

[build-dependencies]
# The Windows executable's icon (build.rs). Does nothing for other targets.
embed-resource = "3.0"
