[package]
name = "midstate-walletd"
version = "0.1.0"
edition = "2021"
description = "Headless wallet service for the Midstate desktop app: owns the wallet file, embeds the full node, and drives the commit→reveal state machines."

[dependencies]
midstate = { path = "../.." }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
bip32 = "0.5"
bip39 = "2.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
bincode = "1.3"
# Mining keys are Ristretto points: decoding one catches a mistyped key.
curve25519-dalek = "4"
# The MWB leg of MDS <-> MWB swaps: midwimble's consensus core only, no node.
# Its transactions are built and checked by midwimble's own rules.
midwimble = { git = "https://github.com/ciphernom/midwimble", default-features = false }
# The swap link's Fiat-Shamir challenge reads BLAKE3's extendable output.
blake3 = "1.5"
zeroize = "1"
rand = "0.8"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
dirs = "5.0"
libp2p = { version = "0.56", default-features = false }

[dev-dependencies]
tempfile = "3.8"
