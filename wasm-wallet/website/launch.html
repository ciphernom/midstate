(function(){try{var t=localStorage.getItem('midstate-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
function toggleTheme(){
  var d=document.documentElement, n=d.getAttribute('data-theme')==='light'?'dark':'light';
  d.setAttribute('data-theme',n);
  try{localStorage.setItem('midstate-theme',n);}catch(e){}

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root[data-theme="light"] {
  --bg: #ffffff; --bg-alt: #f7f7f7; --border: #e3e3e3; --border-bright: #cfcfcf;
  --text-max: #111111; --text-main: #111111; --text-bright: #383838; --text-muted: #565656; --text-faint: #a2a2a2;
  --highlight: #efefef; --invert-bg: #111111; --invert-fg: #ffffff;
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --bg-alt: #141414; --border: #262626; --border-bright: #363636;
  --text-max: #f5f5f5; --text-main: #f5f5f5; --text-bright: #cfcfcf; --text-muted: #9a9a9a; --text-faint: #5a5a5a;
  --highlight: #1f1f1f; --invert-bg: #f5f5f5; --invert-fg: #0a0a0a;
}
*, *::before, *::after { box-sizing: border-box; border-radius: 0 !important; box-shadow: none !important; transition: none !important; animation: none !important; }
* { margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text-main); }
body { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }
.mono, h1, h2, h3, button, input, select, th { font-family: 'JetBrains Mono', ui-monospace, monospace; }
a { color: var(--text-max); }
button {
  background: transparent; color: var(--text-max); border: 1px solid var(--border-bright);
  padding: 7px 12px; font-size: 12px; cursor: pointer; letter-spacing: .02em;
}
button:hover:not(:disabled) { background: var(--highlight); }
button.primary { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
button.primary:hover:not(:disabled) { opacity: .88; background: var(--invert-bg); }
button:disabled { opacity: .35; cursor: not-allowed; }
input, select {
  background: var(--bg); color: var(--text-max); border: 1px solid var(--border-bright);
  padding: 8px 10px; font-size: 13px; width: 100%; min-width: 0;
}
input:focus, select:focus, button:focus-visible { outline: 1px solid var(--text-max); outline-offset: 0; }
label { display: block; font-size: 11px; color: var(--text-muted); margin: 0 0 4px; text-transform: uppercase; letter-spacing: .06em; font-family: 'JetBrains Mono', monospace; }

header {
  display: flex; align-items: center; gap: 14px; padding: 12px 20px;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5; flex-wrap: wrap;
}

header h1 span { color: var(--text-muted); font-weight: 400; }
header .grow { flex: 1; }
.chip { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); border: 1px solid var(--border); padding: 3px 8px; white-space: nowrap; }

#gate { border-bottom: 1px solid var(--border); padding: 12px 20px; background: var(--bg-alt); font-size: 13px; display: none; }

main { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 54px); }

#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 30; max-width: min(420px, calc(100vw - 32px)); }

.how { padding: 18px 24px 40px; color: var(--text-muted); font-size: 13px; max-width: 900px; }
.how h3 { color: var(--text-max); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; }

@media (max-width: 1100px) {

<script type="module">
// ═══════════════════════════════════════════════════════════════════════════
//  Boot
// ═══════════════════════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
let wasm, compile, LP;
try {
  wasm = await import('./wallet/pkg/wasm_wallet.js');
  await wasm.default();
  ({ compile } = await import('./wallet/sdk/compiler.js'));
  LP = await import('./wallet/sdk/launchpad.js');
} catch (e) {
  console.error(e);
  $('detail').innerHTML = '<div class="empty"><h2>Could not load the Midstate runtime</h2><p>The page needs wallet/pkg/ and wallet/sdk/ beside it. Check the console for 404s.</p></div>';
  throw e;
}

// Developer options: ?rpc=<url> for another node, ?from=<height> for a chain
// whose v6 opcodes activate elsewhere (a fast-mining test chain).
const RPC = (qs.get('rpc') || 'https://rpc.cypherpunk.gold').replace(/\/+$/, '');
const FROM = qs.get('from') ? Number(qs.get('from')) : Number(LP.LAUNCHPAD_HEIGHT);
if (window.Midstate) Midstate.configure({ walletUrl: new URL('wallet/', location.href).href });

// ═══════════════════════════════════════════════════════════════════════════
//  Formatting
// ═══════════════════════════════════════════════════════════════════════════
const UNITS = [['gMDS', 2 ** 30], ['mMDS', 2 ** 20], ['kMDS', 2 ** 10]];
function fmtMds(v) {
  const x = typeof v === 'bigint' ? Number(v) : v;
  if (!Number.isFinite(x)) return '—';
  const a = Math.abs(x);
  for (const [u, s] of UNITS) if (a >= s) return (x / s).toLocaleString(undefined, { maximumFractionDigits: a / s >= 100 ? 1 : 3 }) + ' ' + u;
  return x.toLocaleString(undefined, { maximumFractionDigits: a < 1 ? 4 : 2 }) + ' MDS';
}
const fmtInt = (v) => BigInt(v).toLocaleString();
const short = (h, n = 8) => String(h || '').slice(0, n);
const priceOf = (L, st = L.st) => { const p = LP.spotPrice(L.params, st); return Number(p.num) / Number(p.den); };
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
};
function toast(msg, bad = false) {
  const t = el('div', { class: 'toast' + (bad ? ' bad' : ''), text: msg });
  $('toasts').append(t);
  setTimeout(() => t.remove(), bad ? 12000 : 6000);
  while ($('toasts').children.length > 4) $('toasts').firstChild.remove();
}

// ═══════════════════════════════════════════════════════════════════════════
//  The node: a small request governor (2 in flight, spaced, 429-aware)
// ═══════════════════════════════════════════════════════════════════════════
const gw = { q: [], active: 0, last: 0, cool: 0 };
function pump() {
  if (gw.active >= 2 || !gw.q.length) return;
  const wait = Math.max(gw.cool - Date.now(), gw.last + 160 - Date.now(), 0);
  if (wait > 0) { setTimeout(pump, wait); return; }
  const job = gw.q.shift(); gw.active++; gw.last = Date.now();
  job().finally(() => { gw.active--; pump(); });
  pump();
}
function rpc(path, body) {
  return new Promise((resolve, reject) => {
    gw.q.push(async () => {
      for (let attempt = 0; ; attempt++) {
        let r = null, err = null;
        try {
          r = await fetch(RPC + path, body === undefined ? { cache: 'no-store' }
            : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' });
        } catch (e) { err = e; }
        if (r && r.status !== 429) {
          const j = await r.json().catch(() => null);
          if (!r.ok) { reject(new Error((j && j.error) || `HTTP ${r.status} for ${path}`)); return; }
          resolve(j); return;
        }
        const ms = Math.min(1500 * 2 ** attempt + Math.random() * 400, 30000);
        gw.cool = Date.now() + ms;
        if (attempt >= 4) { reject(err || new Error('The node is rate-limiting this page; it will retry shortly.')); return; }
        await new Promise((res) => setTimeout(res, ms));
      }
    });
    pump();
  });
}

// ═══════════════════════════════════════════════════════════════════════════
//  Following launches on chain
// ═══════════════════════════════════════════════════════════════════════════
//
// Compact filters say which blocks touch the registry (new launches) or the
// current address of a launch (its next trade). Only those blocks are fetched.
// Blocks come with witnesses stripped; the launch's receipts make that enough.

const S = {
  tip: 0, scanned: FROM - 1, hashes: new Map(),
  launches: new Map(),           // tag -> Launch
  selected: qs.get('t') || null, // tag prefix from the URL
  me: null,                      // { address, sitePk, siteSigBytes, siteKeyLeft, sitePks: [{pk,left,sigBytes}] }
  side: 'buy', busy: false, scanning: false, error: null,
};
try { const m = JSON.parse(localStorage.getItem('launchpad-me') || 'null'); if (m && m.sitePk) S.me = m; } catch (_) {}

const matcher = wasm.WebWallet.from_seed_hex(Array.from(crypto.getRandomValues(new Uint8Array(32)), (b) => b.toString(16).padStart(2, '0')).join(''));
const codes = new Map();
const codeFor = (p) => {
  const k = `${p.depth}/${p.threshold}/${p.price}/${p.seed}`;
  if (!codes.has(k)) codes.set(k, LP.compileLaunch(p, compile).code);
  return codes.get(k);
};
const setWatch = () => matcher.set_watchlist(JSON.stringify(LP.watchAddresses([...S.launches.values()].filter((l) => !l.broken))));

function processBlock(block, height) {
  let changed = false;
  for (const raw of block.transactions || []) {
    const tx = LP.normalizeTx(raw);
    if (!tx) continue;
    if (height >= FROM) {
      for (const L of LP.launchesInTx(tx, codeFor, height)) {
        if (!S.launches.has(L.tag)) { S.launches.set(L.tag, L); changed = true; }
      }
    }
    for (const L of S.launches.values()) {
      if (L.broken) continue;
      try { if (L.applyTx(tx, height)) changed = true; }
      catch (e) { L.broken = e.message; changed = true; console.error(L.ticker, e); }
    }
  }
  return changed;
}

async function scan() {
  // A scan asked for while one runs (a trade just went through) runs right after it.
  if (S.scanning) { S.again = true; return; }
  S.scanning = true;
  try {
    const st = await rpc('/state');
    const first = !S.tip;
    S.tip = Number(st.height);
    if (first) render();
    await checkReorg();
    let from = S.scanned + 1;
    setWatch();
    while (from <= S.tip) {
      const fd = await rpc('/filters', { start_height: from, end_height: Math.min(from + 1000, S.tip + 1) });
      const filters = fd.filters || [], counts = fd.element_counts || [], hashes = fd.block_hashes || [];
      const start = fd.start_height ?? from;
      if (!filters.length) break;
      for (let i = 0; i < filters.length; i++) {
        const h = start + i;
        const fetch = !hashes[i] || !filters[i] || !counts[i] || matcher.check_filter(filters[i], hashes[i], counts[i]);
        if (fetch) {
          const block = await rpc(`/block/${h}`);
          if (processBlock(block, h)) { setWatch(); render(); }
        }
        if (hashes[i]) S.hashes.set(h, hashes[i]);
        S.scanned = h;
        if (i % 200 === 0) renderScan();
      }
      from = start + filters.length;
      renderScan();
      await new Promise((r) => setTimeout(r, 400));
    }
    S.error = null;
  } catch (e) {
    S.error = e.message;
  } finally {
    S.scanning = false;
    renderScan(); render();
    if (S.again) { S.again = false; scanSoon(0); }
  }
}

// A changed hash at a height already read means a reorg: read again from the start.
async function checkReorg() {
  if (S.scanned < FROM) return;
  const back = Math.max(FROM, S.scanned - 6);
  const fd = await rpc('/filters', { start_height: back, end_height: S.scanned + 1 });
  const hs = fd.block_hashes || [], start = fd.start_height ?? back;
  for (let i = 0; i < hs.length; i++) {
    const known = S.hashes.get(start + i);
    if (known && hs[i] && known !== hs[i]) {
      toast('The chain reorganised; reading the launches again.');
      S.launches.clear(); S.hashes.clear(); S.scanned = FROM - 1;
      return;
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
//  The wallet
// ═══════════════════════════════════════════════════════════════════════════
const myKeys = () => (S.me ? (S.me.sitePks && S.me.sitePks.length ? S.me.sitePks : [{ pk: S.me.sitePk, left: S.me.siteKeyLeft, sigBytes: S.me.siteSigBytes }]) : []);
const myOwners = () => new Map(myKeys().map((k) => [LP.ownerOf(k.pk), k]));
/** The key that holds my row in this launch, else my current key. */
function keyFor(L) {
  const owners = myOwners();
  for (const h of L.ledger.holders()) if (owners.has(h.owner)) return { ...owners.get(h.owner), slot: h.slot, balance: h.balance };
  return { pk: S.me.sitePk, left: S.me.siteKeyLeft, sigBytes: S.me.siteSigBytes, slot: null, balance: 0n };
}
const live = () => S.tip >= FROM;

$('btnConnect').addEventListener('click', () => {
  if (!window.Midstate) { toast('The wallet connector did not load.', true); return; }
  // connect() opens the popup synchronously: keep it inside the click.
  Midstate.connect({ siteKey: true, onProgress: (m) => toast(m) }).then((r) => {
    S.me = { address: r.address, sitePk: r.sitePk, siteSigBytes: r.siteSigBytes, siteKeyLeft: r.siteKeyLeft, sitePks: r.sitePks || [] };
    try { localStorage.setItem('launchpad-me', JSON.stringify(S.me)); } catch (_) {}
    toast('Wallet connected.');
    render();
    if ((S.me.siteKeyLeft ?? 99) < 32) toast(`Your key for this site has ${S.me.siteKeyLeft} signatures left. When it runs low the wallet makes a new one, and each launch offers to move your position to it.`);
  }).catch((e) => toast(e.message || 'Connection failed.', true));
});

function txError(e) {
  const m = e && e.message || String(e);
  if (/not found or already spent|already spent|Coin .* not found/i.test(m)) {
    return 'Someone traded first, so the price has moved. Check the new quote and try again.';
  }
  return m;
}

// ═══════════════════════════════════════════════════════════════════════════
//  Rendering: the list

function sorted() {
  const q = $('search').value.trim().toLowerCase();
  let ls = [...S.launches.values()].filter((l) => !q || l.ticker.toLowerCase().includes(q) || l.name.toLowerCase().includes(q));
  const by = $('sort').value;
  if (by === 'raised') ls.sort((a, b) => (b.st.x > a.st.x ? 1 : -1));
  else if (by === 'active') ls.sort((a, b) => b.trades.length - a.trades.length);
  else ls.sort((a, b) => (b.created || 0) - (a.created || 0));
  return ls;
}

function renderList() {
  const list = $('list');

  const ls = sorted();
  if (!ls.length) {

  for (const L of ls) {
    const st = L.st, pct = Number(st.supply * 1000n / L.params.threshold) / 10;

      el('div', { class: 'bar' }, el('i', { style: `width:${L.graduated ? 100 : pct}%` })));
    const pick = () => { S.selected = L.tag.slice(0, 16); history.replaceState(null, '', '?' + new URLSearchParams({ ...Object.fromEntries(qs), t: S.selected })); render(); };
    it.addEventListener('click', pick);
    it.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });

}

function renderScan() {
  const parts = [];
  if (S.tip) parts.push(`tip ${S.tip.toLocaleString()}`);
  if (S.tip && S.scanned < S.tip && S.scanned >= FROM) parts.push(`reading ${Math.max(0, S.tip - S.scanned).toLocaleString()} blocks…`);

}

function current() {

function stat(k, v, sub) {

    sub ? el('div', { class: 'sub', text: sub }) : null);
}

function chart(L) {
  // Price after each trade; the dashed line marks graduation.
  const W = 640, Hh = 220, pad = 34;
  const pts = [{ i: 0, p: 0 }];
  let grad = null;
  L.trades.forEach((t, i) => {
    pts.push({ i: i + 1, p: priceOf(L, { supply: t.supply, x: t.x, y: t.y }) });
    if (t.graduated) grad = i + 1;
  });
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', `Price of ${L.ticker} after each trade`);
  const n = Math.max(1, pts.length - 1), maxP = Math.max(...pts.map((p) => p.p), L.params.price * (L.params.threshold - 1n) > 0n ? Number(L.params.price * (L.params.threshold - 1n)) : 1);
  const X = (i) => pad + (W - pad - 8) * (i / n), Y = (p) => Hh - pad + 6 - (Hh - pad - 14) * (p / maxP);
  const add = (tag, a) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); svg.append(e); return e; };
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--text-max').trim() || '#fff';
  const faint = getComputedStyle(document.documentElement).getPropertyValue('--border-bright').trim() || '#444';
  const muted = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#999';
  add('line', { x1: pad, y1: Hh - pad + 6, x2: W - 8, y2: Hh - pad + 6, stroke: faint });
  add('line', { x1: pad, y1: 8, x2: pad, y2: Hh - pad + 6, stroke: faint });
  // The graduation price, the level the curve climbs towards.
  const gp = Number(L.params.price * (L.params.threshold - 1n));
  add('line', { x1: pad, y1: Y(gp), x2: W - 8, y2: Y(gp), stroke: faint, 'stroke-dasharray': '2 4' });
  const lab = add('text', { x: pad + 6, y: Y(gp) - 6, fill: muted, 'font-size': 13, 'text-anchor': 'start', 'font-family': 'JetBrains Mono, monospace' });
  lab.textContent = 'pool opens at ' + fmtMds(gp);
  if (grad) add('line', { x1: X(grad), y1: 8, x2: X(grad), y2: Hh - pad + 6, stroke: muted, 'stroke-dasharray': '4 3' });
  let d = `M${X(0)},${Y(0)}`;
  for (let k = 1; k < pts.length; k++) d += ` H${X(pts[k].i)} V${Y(pts[k].p)}`;
  add('path', { d, fill: 'none', stroke: ink, 'stroke-width': 1.5 });
  const xl = add('text', { x: W - 8, y: Hh - 8, fill: muted, 'font-size': 13, 'text-anchor': 'end', 'font-family': 'JetBrains Mono, monospace' });
  xl.textContent = `${L.trades.length} trade${L.trades.length === 1 ? '' : 's'}`;
  return svg;
}

  const owners = myOwners();

  hT.append(el('tr', {}, el('td', { text: L.graduated ? 'pool' : 'pool (opens at graduation)' }), el('td', { class: 'n', text: fmtInt(st.y) }), el('td', { class: 'n', text: share(st.y) })));

  box.append(howItWorks());
  restore();

function tradePanel(L, mine) {
  const wrap = el('div', { class: 'trade' });
  const buy = el('button', { class: S.side === 'buy' ? 'on' : '', text: 'Buy' });
  const sell = el('button', { class: S.side === 'sell' ? 'on' : '', text: 'Sell' });
  buy.onclick = () => { S.side = 'buy'; renderDetail(); };
  sell.onclick = () => { S.side = 'sell'; renderDetail(); };
  wrap.append(el('div', { class: 'tabs' }, buy, sell));

  const amt = el('input', { id: 'amt', inputmode: 'decimal', placeholder: S.side === 'buy' ? 'MDS to spend' : 'Tokens to sell', autocomplete: 'off', 'aria-label': 'Amount' });
  const unit = el('select', { id: 'unit', 'aria-label': 'Unit' });
  for (const [u, s] of [['MDS', 1], ['kMDS', 1024], ['mMDS', 1048576], ['gMDS', 1073741824]]) unit.append(el('option', { value: String(s), text: u }));
  unit.value = String(1073741824);
  const quote = el('div', { class: 'quote' });
  const go = el('button', { class: 'primary go', text: S.side === 'buy' ? 'Buy $' + L.ticker : 'Sell $' + L.ticker });
  if (S.side === 'buy') wrap.append(el('div', { class: 'row' }, amt, unit));
  else {
    wrap.append(el('div', { class: 'row' }, amt));
    const q = el('div', { class: 'quick' });
    for (const f of [25, 50, 100]) q.append(el('button', { text: f + '%', onclick: () => { amt.value = mine ? String(mine.balance * BigInt(f) / 100n) : ''; update(); } }));
    wrap.append(q);
  }
  wrap.append(quote, go);

  let plan = null;
  function update() {
    plan = null;
    quote.replaceChildren();
    const line = (k, v) => quote.append(el('div', {}, el('span', { text: k }), el('span', { text: v })));
    const st = L.st;
    try {
      const raw = amt.value.replace(/[, _]/g, '');
      if (!raw) { line('Price now', fmtMds(priceOf(L))); line(L.graduated ? 'Pool' : 'Left on the curve', L.graduated ? `${fmtInt(st.y)} tokens` : `${fmtInt(L.params.threshold - st.supply)} tokens`); return; }
      if (!/^\d*\.?\d*$/.test(raw)) throw new Error('Numbers only.');
      let n;
      if (S.side === 'buy') {
        const mds = BigInt(Math.floor(Number(raw) * Number(unit.value)));
        n = LP.tokensFor(L.params, st, mds);
        if (n === 0n) throw new Error(L.graduated || st.supply > 0n ? 'That buys less than one token.' : 'Try a little more: the first tokens are nearly free.');
      } else {
        if (raw.includes('.')) throw new Error('Tokens are whole numbers.');
        n = BigInt(raw);
        if (n <= 0n) throw new Error('Enter how many to sell.');
        if (!mine || n > mine.balance) throw new Error(`You hold ${mine ? fmtInt(mine.balance) : 0}.`);
      }
      const q = LP.quote(L.params, st, S.side, n);
      const avg = Number(q.mds < 0n ? -q.mds : q.mds) / Number(n);
      const after = priceOf(L, q), before = priceOf(L);
      line(S.side === 'buy' ? 'You get' : 'You sell', `${fmtInt(n)} ${L.ticker}`);
      line(S.side === 'buy' ? 'You pay' : 'You get', fmtMds(q.mds < 0n ? -q.mds : q.mds) + (S.side === 'buy' ? ' + fee' : ' − fee'));
      line('Average price', fmtMds(avg));
      line('Price after', fmtMds(after) + (before > 0 ? ` (${after >= before ? '+' : ''}${((after / before - 1) * 100).toFixed(2)}%)` : ''));
      if (!L.graduated && q.supply === L.params.threshold) line('Graduates', 'this trade opens the pool');
      plan = { n, q };
    } catch (e) {
      quote.append(el('span', { class: 'err', text: e.message.replace(/^launchpad: /, '') }));
    }
    go.disabled = !plan || !S.me || !live() || S.busy || !!L.broken;
  }
  amt.addEventListener('input', update);
  unit.addEventListener('change', update);

  go.onclick = () => {
    if (!plan || !S.me) return;
    let t;
    try {
      const k = keyFor(L);
      if (k.left !== undefined && k.left <= 0) throw new Error('Your key for this site has no signatures left. Connect again.');
      t = L.prepareTrade({ side: S.side, n: plan.n, pubkey: k.pk, sigBytes: k.sigBytes });
    } catch (e) { toast(e.message.replace(/^launchpad: /, ''), true); return; }
    const what = `${S.side === 'buy' ? 'Buy' : 'Sell'} ${fmtInt(plan.n)} ${L.ticker} for about ${fmtMds(plan.q.mds < 0n ? -plan.q.mds : plan.q.mds)}`;
    S.busy = true; go.disabled = true;
    // spendContract opens the wallet popup synchronously: keep it in the click.
    Midstate.spendContract({ ...t.spend, summary: what }, { onProgress: (m) => toast(m) })
      .then(() => { usedSignature(t.spend.siteSig.pk); toast('Done: ' + what + '.'); scanSoon(); })
      .catch((e) => toast(txError(e), true))
      .finally(() => { S.busy = false; update(); });
  };

  if (!S.me) wrap.append(el('p', { class: 'note', text: 'Connect your wallet to trade. It makes a signing key for this site the first time.' }));
  else if (!live()) wrap.append(el('p', { class: 'note', text: `Trading opens at block ${FROM.toLocaleString()}.` }));
  else wrap.append(el('p', { class: 'note', text: 'One trade per block can win a given price: if someone trades first, the wallet stops and you try again at the new price.' }));

  if (S.me && mine && mine.balance > 0n) {
    const cur = S.me.sitePk;
    const to = el('input', { placeholder: 'Their site public key, or owner id', autocomplete: 'off', 'aria-label': 'Recipient' });
    const give = el('button', { text: 'Hand over all ' + fmtInt(mine.balance) });
    give.onclick = () => handOver(L, mine, to.value.trim());
    const det = el('details', {}, el('summary', { text: 'Give or move your whole position' }),
      el('p', { class: 'note', style: 'margin:0 0 8px', text: 'Hands your entire row to another owner, with no MDS changing hands. They need its owner id: the first 24 bytes of the hash of their key for this site.' }),
      el('div', { class: 'row' }, to), give);
    if (mine.pk !== cur) {
      det.append(el('p', { class: 'note', text: 'This position is held by an older key of yours.' }),
        el('button', { text: 'Move it to your current key', onclick: () => handOver(L, mine, cur) }));
    }
    wrap.append(det);
  }
  setTimeout(update, 0);
  return wrap;
}

/** The wallet keeps the real count; this keeps the page's copy roughly right until the next connect. */
function usedSignature(pk) {
  for (const k of myKeys()) if (k.pk === pk && typeof k.left === 'number') k.left--;
  if (S.me && S.me.sitePk === pk && typeof S.me.siteKeyLeft === 'number') S.me.siteKeyLeft--;
  try { localStorage.setItem('launchpad-me', JSON.stringify(S.me)); } catch (_) {}
}

function handOver(L, mine, target) {
  let owner = String(target || '').replace(/^0x/, '').toLowerCase();
  if (/^[0-9a-f]{64}$/.test(owner)) owner = LP.ownerOf(owner);
  if (!/^[0-9a-f]{48}$/.test(owner)) { toast('Give a 32-byte public key or a 24-byte owner id, in hex.', true); return; }
  let t;
  try { t = L.prepareTrade({ side: 'buy', n: 0n, pubkey: mine.pk, sigBytes: mine.sigBytes, to: owner, slot: mine.slot }); }
  catch (e) { toast(e.message.replace(/^launchpad: /, ''), true); return; }
  const what = `Hand ${fmtInt(mine.balance)} ${L.ticker} to ${short(owner, 12)}…`;
  Midstate.spendContract({ ...t.spend, summary: what }, { onProgress: (m) => toast(m) })
    .then(() => { usedSignature(mine.pk); toast('Done: ' + what); scanSoon(); })
    .catch((e) => toast(txError(e), true));
}

function howItWorks() {
  return el('div', { class: 'how' },
    el('h3', { text: 'How it works' }),
    el('p', { text: 'A launch is one Midstate script. Its state (tokens sold, MDS held, pool tokens, the holder ledger\'s root) is pushed at the start of the script itself, so every state has its own address. A trade spends every coin at the current address and must send the whole reserve on to the address of the next state, which the script works out for itself. No coin can be left behind to fork from.' }),
    el('p', { text: 'Holders are rows in a Merkle ledger that the script checks with OP_MERKLE_ROOT. Each trade also leaves a small receipt naming the new row, so anyone can rebuild the ledger from the chain, which is what this page does.' }),
    el('p', { text: 'Your positions belong to a signing key your wallet makes for this site from your recovery phrase. Restoring the phrase restores the key.' }));
}

function renderMe() {
  const b = $('btnConnect');
  if (!S.me) { b.textContent = 'Connect wallet'; b.className = 'primary'; b.title = ''; return; }
  b.textContent = short(S.me.address, 6) + '… · ' + (S.me.siteKeyLeft ?? '?') + ' sigs';
  b.className = '';
  b.title = 'Signatures left on your key for this site. Click to connect again.';
}
function render() { renderMe(); renderList(); renderDetail(); renderScan(); }
$('search').addEventListener('input', renderList);
$('sort').addEventListener('change', renderList);

// ═══════════════════════════════════════════════════════════════════════════
//  New launch
// ═══════════════════════════════════════════════════════════════════════════
function draft() {
  const T = BigInt(($('cT').value || '0').replace(/[, _]/g, '') || '0');
  const raise = BigInt(Math.floor(Number(($('cRaise').value || '0').replace(/[, _]/g, '')) * Number($('cRaiseUnit').value)));
  const steps = T * T - T;
  const price = steps > 0n ? ((2n * raise) / steps > 0n ? (2n * raise) / steps : 1n) : 1n;
  const params = { depth: Number($('cDepth').value), threshold: T, price, seed: 1n };
  const v = LP.validateParams(params);
  const ticker = $('cTicker').value.trim().toUpperCase(), name = $('cName').value.trim();
  if (!ticker) throw new Error('Give it a ticker.');
  if (!/^[A-Z0-9]{1,12}$/.test(ticker)) throw new Error('Tickers are letters and digits.');
  const nonce = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, '0')).join('');
  const payload = LP.encodeAnnouncement({ params: v, ticker, name, nonce });
  return { v, ticker, name, payload };
}
function updatePreview() {
  const box = $('cPreview');
  box.replaceChildren();
  const line = (k, val) => box.append(el('div', {}, el('span', { text: k }), el('span', { text: val })));
  try {
    const { v } = draft();
    line('Curve sells', `${fmtInt(v.threshold)} tokens`);
    line('Price step', fmtMds(v.price) + ' per token');
    line('Last curve token', fmtMds(v.price * (v.threshold - 1n)));
    line('Raise at graduation', fmtMds(v.raise));
    line('Pool opens with', `${fmtMds(v.raise)} + ${fmtInt(v.pool)} tokens`);
    line('Total supply', `${fmtInt(v.threshold + v.pool)} tokens`);
    $('btnLaunch').disabled = !live();
  } catch (e) {
    box.append(el('div', {}, el('span', { text: e.message.replace(/^launchpad: /, '') })));
    $('btnLaunch').disabled = true;
  }
}
for (const id of ['cTicker', 'cName', 'cT', 'cRaise', 'cRaiseUnit', 'cDepth']) $(id).addEventListener('input', updatePreview);
const openCreate = () => { $('create').classList.add('open'); updatePreview(); $('cTicker').focus(); };
const closeCreate = () => $('create').classList.remove('open');
$('btnNew').addEventListener('click', openCreate);
$('btnCloseCreate').addEventListener('click', closeCreate);
$('btnCancelCreate').addEventListener('click', closeCreate);
$('create').addEventListener('click', (e) => { if (e.target === $('create')) closeCreate(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCreate(); });

$('btnLaunch').addEventListener('click', () => {
  if (!live()) return;
  let d, L, out;
  try {
    d = draft();
    const a = LP.decodeAnnouncement(d.payload);
    L = new LP.Launch(a, codeFor(a.params));
    out = L.launchOutputs();
  } catch (e) { toast(e.message.replace(/^launchpad: /, ''), true); return; }
  // fundContract opens the wallet popup synchronously: keep it in the click.
  Midstate.fundContract({ fundings: out.fundings, burns: out.burns, summary: `Launch $${d.ticker}` }, { onProgress: (m) => toast(m) })
    .then(() => {
      toast(`$${d.ticker} is launched. It appears here once its block is read.`);
      closeCreate();
      S.selected = L.tag.slice(0, 16);
      scanSoon();
    })
    .catch((e) => toast(e.message || 'Launch failed.', true));
});

// ═══════════════════════════════════════════════════════════════════════════
//  Run
// ═══════════════════════════════════════════════════════════════════════════
// A scan every 20 s, and one soon after anything this page sends. A request
// made while a scan runs must survive it, so the loop only reschedules itself
// when nothing else has.
let timer = null;
function scanSoon(ms = 1500) { clearTimeout(timer); timer = setTimeout(loop, ms); }
async function loop() {
  clearTimeout(timer); timer = null;
  await scan();
  if (timer === null) timer = setTimeout(loop, 20000);
}
render();
loop();
</script>
</body>
</html>
