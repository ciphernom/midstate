<!DOCTYPE html>
<!-- The Midstate web wallet. Self-contained: no fonts, scripts or images from
     anywhere else. Keys stay in this browser (worker.js, in WebAssembly); it
     reaches nodes over WebRTC or HTTPS (net.js). app.js draws every screen
     into #app. The page from before is classic.html: it still runs trades,
     Q-Bolt channels and mining bonds made with it. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="The Midstate wallet: keys in your browser, payments to names and addresses, mining with spare power.">
<title>Midstate wallet</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Midstate">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="wallet.css">
<script src="theme.js"></script>
</head>
<body>
<div class="app" id="app"></div>
<noscript><p class="noscript">The wallet needs JavaScript and WebAssembly.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
