/** An address: its picture, and a link to it. */
function who(addr, n = 6, label) {
    if (!addr) return '<span class="faint">—</span>';
    const full = checksummed(addr);
    return `<span class="who">${identicon(addr, 16)}<a class="hash" href="${href.q(full)}" title="${full}">${label ? escHtml(label) : short(full, n)}</a></span>`;
}
function txLink(t, n = 6) {
    if (t.kind === 'coinbase') return `<a href="${href.tx(t.height, 'cb')}">Reward <span class="dim">#${fmtInt(t.height)}</span></a>`;
    return `<a class="hash" href="${href.tx(t.height, t.index)}" title="${t.commitment}">${short(t.commitment, n)}</a>`;
}
function loading(text) { return `<div class="loading"><span class="spin"></span>${text || 'Loading…'}</div>`; }
function powBar() { return `<div class="pow" title="A small proof of work keeps this node from being flooded with searches"><i id="pow-fill"></i></div>`; }
function message(title, sub) {
    view().innerHTML = `<div class="page-h"><h1>${escHtml(title)}</h1></div>
        <section class="card"><div class="card-b pad">${sub || ''}<p><a href="?">Back to the latest blocks</a></p></div></section>`;
}
function stale(seq) { return seq !== routeSeq; }

/** What a transaction moved, the way an account chain would say it: who
 *  paid, who was paid (change back to a sender is not a payment), how much. */
function summary(t) {
    const coinsOut = t.outs.filter(o => o.kind === 'coin');
    if (t.kind === 'coinbase') {
        return { type: 'Reward', from: [], to: [...new Set(coinsOut.map(o => o.addr))], value: t.totalOut };
    }
    const senders = [...new Set(t.ins.filter(i => i.addr).map(i => i.addr))];
    const pays = coinsOut.filter(o => !senders.includes(o.addr));
    const to = [...new Set((pays.length ? pays : coinsOut).map(o => o.addr))];
    const type = t.mix ? 'Mix' : t.kind === 'consolidate' ? 'Consolidate' : !pays.length ? (t.outs.some(o => o.kind === 'burn') ? 'Data' : 'Self') : 'Transfer';
    return { type, from: senders, to, value: pays.length ? sum(pays.map(o => o.value)) : sum(coinsOut.map(o => o.value)) };
}
function many(list, n) {
    if (!list.length) return '<span class="faint">—</span>';
    return who(list[0], n) + (list.length > 1 ? ` <span class="dim">+${list.length - 1}</span>` : '');
}
/** Transactions as two-line rows: what a phone shows instead of a table. */
function txList(txs, opts) {
    opts = opts || {};
    if (!txs.length) return `<div class="empty">${opts.empty || 'No transactions.'}</div>`;
    return txs.map(t => {
        const s = summary(t);
        const when = t.ts ? ` · ${ago(t.ts)}` : '';
        const where = opts.block ? `<a class="mono" href="${href.block(t.height)}">#${fmtInt(t.height)}</a>${when} · ` : (t.ts ? `${ago(t.ts)} · ` : '');
        return `<div class="li"><span class="ico">${ic(s.type === 'Reward' ? 'pick' : 'transfer')}</span>
            <div><div class="t1">${txLink(t)} ${s.type !== 'Transfer' ? typeBadge(s.type) : ''}</div>
            <div class="t2">${where}<span class="nw">${many(s.from, 4)}</span> <span class="nw"><span class="arrow">→</span>${many(s.to, 4)}</span></div></div>
            <div class="end">${fmtAmt(s.value)}${t.fee != null && t.kind !== 'coinbase' ? `<div class="t2">fee ${fmtAmtText(t.fee)}</div>` : ''}</div></div>`;
    }).join('');
}
/** A table where there is room, two-line rows where there is not. */
function dual(tableHtml, listHtml) {
    return `<div class="only-wide">${tableHtml}</div><div class="only-narrow">${listHtml}</div>`;
}

/** Coins grouped by owner: one row per address with its total, opening to
 *  the coins themselves. Power-of-two coins make a single payment many
 *  coins; the reader wants to know who got how much. */
function coinGroups(items, side, senders) {
    if (!items.length) return '<div class="empty">None</div>';
    const rows = [];
    const groups = new Map();
    for (const c of items) {
        if (c.kind === 'coin' && c.addr) {
            if (!groups.has(c.addr)) { groups.set(c.addr, []); rows.push({ addr: c.addr }); }
            groups.get(c.addr).push(c);
        } else rows.push({ one: c });
    }
    return rows.map(r => {
        if (r.one) return coinRows([r.one], side);
        const cs = groups.get(r.addr);
        const total = sum(cs.map(c => c.value));
        const change = side === 'out' && senders && senders.includes(r.addr);
        const tag = change ? badge('', 'Change') : '';
        const coins = cs.map(c => `<div class="coin"${c.coinId ? ` data-coin="${c.coinId}"` : ''}><a class="hash" href="${href.q(c.coinId || '')}" title="${c.coinId || ''}">${short(c.coinId || '', 6)}</a><span class="st">${side === 'out' ? coinBadge(c.coinId) : ''}</span><span>${fmtAmt(c.value)}</span></div>`).join('');
        if (cs.length === 1) {
            return `<div class="grp"><div class="grp-row"${cs[0].coinId ? ` data-coin="${cs[0].coinId}"` : ''}>${who(r.addr, 6)}${tag}<span class="st">${side === 'out' ? coinBadge(cs[0].coinId) : ''}</span><span class="amt">${fmtAmt(total)}</span><a class="copy" href="${href.q(cs[0].coinId || '')}" title="The coin">${ic('coins')}</a></div></div>`;
        }
        return `<details class="grp"><summary>${who(r.addr, 6)}${tag}<span class="n">${cs.length} coins</span><span class="amt">${fmtAmt(total)}</span><span class="chev">${ic('right')}</span></summary><div class="coins">${coins}</div></details>`;
    }).join('');
}
function coinBadge(id) {
    const st = id && coinStatus.get(id);
    return st === 'alive' ? badge('ok', 'Unspent') : st === 'spent' ? badge('', 'Spent') : '';
}

function typeBadge(type) {
    const cls = { Reward: 'rew', Transfer: '', Mix: 'seal', Consolidate: '', Self: '', Data: '' }[type] || '';
    return badge(cls, type);
}
function confirmations(h) {
    const st = lastState;
    if (!st) return '';
    const conf = Math.max(0, st.height - h);
    const need = st.safe_depth;
    const fin = need < Number.MAX_SAFE_INTEGER && conf >= need;
    return `${fin ? badge('ok', 'Final', 'check') : badge('', `${fmtInt(conf)} of ${fmtInt(need)}`)} <span class="dim">${fmtInt(conf)} confirmation${conf === 1 ? '' : 's'}</span>`;
}

// ── Routing ─────────────────────────────────────────────────────────────
// Links are real URLs (?q=…, ?tx=height.index), so they open in new tabs
// and old links from wallets keep working; same-tab clicks route in place.

function parseLocation(search) {
    const p = new URLSearchParams(search == null ? window.location.search : search);
    if (p.get('tx')) return { tx: p.get('tx') };
    let q = p.get('q') || p.get('query');
    const s = search == null ? window.location.search : search;
    if (!q && s.length > 1 && !s.includes('=')) q = s.substring(1);
    if (q) return { q: decodeURIComponent(q).replace(/\/$/, ''), before: p.get('before') || null };
    return {};
}
function urlFor(s) {
    if (s.tx) return '?tx=' + encodeURIComponent(s.tx);
    if (s.q) return '?q=' + encodeURIComponent(s.q) + (s.before ? '&before=' + encodeURIComponent(s.before) : '');
    return window.location.pathname;
}
function navigate(s, replace) {
    const url = urlFor(s);
    if (replace) history.replaceState(s, '', url); else history.pushState(s, '', url);
    window.scrollTo(0, 0);
    route(s);
}
function go(q) { q = String(q).trim(); if (/^[0-9][0-9,]*$/.test(q)) q = q.replace(/,/g, ''); navigate({ q }); }
function openTx(h, i) { navigate({ tx: `${h}.${i}` }); }
window.addEventListener('popstate', e => route(e.state || parseLocation()));
document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="?"]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || a.target) return;
    e.preventDefault();
    navigate(parseLocation(a.getAttribute('href')));
});

function submitSearch(e) {
    e.preventDefault();
    const input = $('q');
    const v = input.value.trim();
    if (!v) return false;
    input.value = '';
    input.blur();
    go(v);
    return false;
}

async function route(s) {
    s = s || {};
    const seq = ++routeSeq;
    clearInterval(homeTimer);
    if (s.tx) {
        const [hs, is] = String(s.tx).split('.');
        setNav('txs');
        return showTx(parseInt(String(hs).replace(/,/g, ''), 10), is === 'cb' ? 'cb' : parseInt(is, 10), seq);
    }
    if (s.q) return query(s.q, s.before, seq);
    setNav('home');
    return showHome(seq);
}

async function query(q, before, seq) {
    const lc = q.toLowerCase().replace(/^0x/, '');
    if (lc === 'blocks') { setNav('blocks'); return showBlocks(before ? parseInt(before, 10) : null, seq); }
    if (/^(transactions|txs|txns)$/.test(lc)) { setNav('txs'); return showTxs(seq); }
    if (/^(mempool|pending)$/.test(lc)) { setNav('mempool'); return showMempool(seq); }
    if (/^(supply|rich ?list|holders|richlist)$/.test(lc)) { setNav('supply'); return showSupply(seq); }
    if (/^(learn|help|about)$/.test(lc)) { setNav('learn'); return showLearn(); }
    if (lc === 'api') { setNav(''); return showApi(); }
    setNav('');
    if (/^[0-9][0-9,]*$/.test(q)) return showBlock(parseInt(q.replace(/,/g, ''), 10), seq);
    if (/^[0-9a-f]{72}$/.test(lc)) {
        const c = validateAddressChecksum(lc);
        if (!c.valid) return message('That address has a typo', `<p>${escHtml(c.reason)}. The last eight characters are a checksum of the rest, so a mistyped address never matches.</p>`);
        return showAddress(c.canonical, before, seq);
    }
    if (/^[0-9a-f]{64}$/.test(lc)) return resolveHash(lc, seq);
    if (/^[a-z0-9-]+\.mds$/.test(lc)) return showName(lc, seq);
    if (lc.startsWith('decompile ')) {
        const hex = q.split(/\s+/)[1] || '';
        view().innerHTML = `<div class="page-h"><h1>Script</h1></div>${card('Decompiled', `<div class="card-b pad">${renderScriptDisasm(hex)}</div>`)}`;
        return;
    }
    message('Nothing matched', `<p>Search for a block number, an address (72 characters), a transaction id or coin id (64), or a name such as <span class="mono">nick.mds</span>.</p>`);
}

/** A 64-hex string can be a transaction id, a coin, an address or a block
 *  hash. The transaction index answers the first at once; otherwise one
 *  proof-of-work search says which. */
async function resolveHash(q, seq) {
    view().innerHTML = loading('Looking it up…');
    try {
        const r = await fetch('/tx/' + q);
        if (r.ok) {
            const t = await r.json();
            if (stale(seq)) return;
            if (t.revealed) return showTx(t.revealed.height, t.revealed.tx, seq);
            if (t.sealed) return showTx(t.sealed.height, t.sealed.tx, seq);
        }
    } catch (_) {}
    const mp = findInMempool(q);
    view().innerHTML = loading('Searching recent blocks…') + powBar();
    let results;
    try { results = await cachedSearch(q); }
    catch (e) {
        if (stale(seq)) return;
        if (mp) return showPendingTx(mp);
        return message('Search failed', `<p>${escHtml(e.message)}</p>`);
    }
    if (stale(seq)) return;
    const has = (...types) => results.some(r => types.includes(r.result_type));
    if (has('output_coin_id', 'coinbase_coin_id', 'input_coin_id')) return showCoin(q, results, seq);
    if (has('output_address', 'coinbase_address', 'input_address')) return showAddress(q, null, seq, results);
    const seal = results.find(r => r.result_type === 'commitment');
    if (seal) {
        // A transaction id: the search finds its seal; show the reveal.
        view().innerHTML = loading('Found its seal; finding where it ran…');
        const r = await walkForReveal(q, seal.height, seq);
        if (stale(seq)) return;
        return r ? showTx(r.height, r.tx, seq) : showTx(seal.height, seal.tx_index, seq);
    }
    const first = results[0];
    if (first) {
        if (first.tx_index != null && first.result_type !== 'block_hash') return showTx(first.height, first.tx_index, seq);
        return showBlock(first.height, seq);
    }
    if (mp) return showPendingTx(mp);
    try {
        const r = await fetch('/coin/' + q);
        if (r.ok && (await r.json()).exists) return showCoin(q, [], seq);
    } catch (_) {}
    message('Nothing found', '<p>Nothing in the last 5,000 blocks or in the pending pool matches that.</p>');
}

// ── Home ────────────────────────────────────────────────────────────────

let homeBlocks = [];   // [{h, b, n}] newest first
let homeTxs = [];      // normalised transfers, newest first

async function showHome(seq) {
    view().innerHTML = homeHtml();
    await refreshHome(seq);
    homeTimer = setInterval(() => { if (page === 'home') refreshHome(routeSeq); }, 8000);
}

async function refreshHome(seq) {
    if (!tipHeight) await poll();
    const want = [];
    for (let h = tipHeight; h >= 0 && want.length < 8; h--) want.push(h);
    const got = await Promise.all(want.map(h => getBatch(h).then(b => ({ h, b, n: normBlock(b, h) })).catch(() => null)));
    if (stale(seq)) return;
    homeBlocks = got.filter(Boolean);
    // Latest transfers: walk back until there are eight, at most 60 blocks.
    const txs = [];
    for (const x of homeBlocks) for (const t of x.n.transfers.slice().reverse()) txs.push(Object.assign(t, { ts: x.b.timestamp }));
    for (let h = (homeBlocks.at(-1)?.h ?? tipHeight) - 1; txs.length < 8 && h >= 0 && h > tipHeight - 60; h--) {
        try {
            const b = await getBatch(h), n = normBlock(b, h);
            for (const t of n.transfers.slice().reverse()) txs.push(Object.assign(t, { ts: b.timestamp }));
        } catch (_) { break; }
        if (stale(seq)) return;
    }
    homeTxs = txs.slice(0, 8);
    paintHome();
}

function avgBlockTime() {
    const s = [...recentStats.entries()].sort((a, b) => b[0] - a[0]).slice(0, 60);
    if (s.length < 2) return null;
    return (s[0][1].ts - s[s.length - 1][1].ts) / (s[0][0] - s[s.length - 1][0]);
}

function statsHtml() {
    const st = lastState, sp = lastSupply;
    const bt = avgBlockTime();
    const stat = (k, v, s, link, tip) => `<div class="stat"><div class="k">${k}${tip ? help(tip) : ''}</div>${link ? `<a class="v" href="${link}">${v}</a>` : `<div class="v">${v}</div>`}<div class="s">${s || '&nbsp;'}</div></div>`;
    const circ = sp && sp.circulating_supply != null ? `${fmtG(sp.circulating_supply, 0)} gMDS` : '—';
    return `<div class="stats">
        ${stat('Latest block', st ? fmtInt(tipHeight) : '—', bt ? `about ${Math.round(bt)} s apart` : '', href.block(tipHeight))}
        ${stat('Circulating supply', circ, sp ? `of ${fmtG(sp.max_supply, 0)} gMDS max` : '', '?q=supply')}
        ${stat('Unspent coins', st ? fmtInt(st.num_coins) : '—', 'what Ethereum would call balances', null, 'Midstate keeps coins, not account balances. An address owns the coins sent to it until it spends them.')}
        ${stat('Pending', lastMempoolData ? fmtInt(lastMempoolData.size) : '—', 'waiting for a block', '?q=mempool')}
        ${stat('Block reward', st ? fmtAmtText(st.block_reward) : '—', 'new coins per block')}
        ${stat('Final after', st && st.safe_depth < Number.MAX_SAFE_INTEGER ? `${fmtInt(st.safe_depth)} blocks` : '—', 'the depth this node treats as settled', null, 'Like confirmations on Bitcoin. Midstate has no checkpoint votes; a block is settled once enough work is built on it.')}
        ${stat('Sealed', st ? fmtInt(st.num_commitments) : '—', 'committed, not yet revealed', null, 'Every Midstate transaction is first sealed (a hash that hides it), then revealed. This is what stops front-running.')}
        ${stat('Peers', fmtInt(lastPeers), 'nodes this one talks to')}
    </div>`;
}

function homeHtml() {
    return `<div class="hero"><h1>Midstate blockchain explorer</h1><p>Blocks, transactions, addresses and <span class="mono">.mds</span> names, live from this node.</p></div>
        <div id="home-stats">${statsHtml()}</div>
        <div class="grid2">
            <section class="card"><div class="card-h"><h2>Latest blocks</h2><a class="more" href="?q=blocks">View all</a></div><div class="card-b" id="home-blocks">${loading()}</div></section>
            <section class="card"><div class="card-h"><h2>Latest transactions</h2><a class="more" href="?q=transactions">View all</a></div><div class="card-b" id="home-txs">${loading()}</div></section>
        </div>
        <section class="card" style="margin-top:16px"><div class="card-b pad callout"><span class="mark">${ic('spark')}</span><div>
            <b>Coming from Ethereum, Solana or Base?</b> A few things work differently here: coins instead of balances, two-step

function paintHome() {
    const s = $('home-stats');
    if (!s) return;
    s.innerHTML = statsHtml();

async function showBlock(h, seq) {
    if (!tipHeight) await poll();

    const n = normBlock(b, h);
    const hash = toHex(b.extension.final_hash);
    const payees = [...new Set(n.cb.outs.map(o => o.addr))];
    const nav = `${h > 0 ? `<a class="btn" href="${href.block(h - 1)}" title="Previous block">${ic('left')}</a>` : ''}${h < tipHeight ? `<a class="btn" href="${href.block(h + 1)}" title="Next block">${ic('right')}</a>` : ''}`;
    const overview = kv([
        ['Block height', `<span class="big mono">${fmtInt(h)}</span> ${nav}`],
        ['Status', confirmations(h), 'How deep the block is under newer ones. Past the node\'s settle depth it is final.'],
        ['Timestamp', `${fmtAgo(b.timestamp)} <span class="dim">(${utc(b.timestamp)})</span>`],
        ['Transactions', `<b>${fmtInt(n.transfers.length)}</b> transaction${n.transfers.length === 1 ? '' : 's'} run here${n.commits.length ? `, and <b>${fmtInt(n.commits.length)}</b> sealed for later` : ''}`, 'A Midstate transaction is sealed in one block (only its hash), then revealed and run in a later one.'],
        ['Mined by', payees.length ? payees.map(a => who(a, 10)).join('<br>') : '<span class="faint">—</span>'],
        ['Block reward', `${fmtAmt(n.cb.totalOut)} <span class="dim">= ${fmtAmtText(n.cb.totalOut - n.fees)} new + ${fmtAmtText(n.fees)} fees</span>`],
        n.cb.inscription ? ['Inscription', `<span class="mono">${escHtml(n.cb.inscription)}</span>`] : null,
    ]);
    const more = kv([
        ['Block hash', `<span class="hash">${hash}</span>${copyBtn(hash)}`],
        ['Parent midstate', `<span class="hash">${toHex(b.prev_midstate)}</span>`],
        ['State root', `<span class="hash">${toHex(b.state_root)}</span>${copyBtn(toHex(b.state_root))}`, 'Root of the sparse Merkle tree of every unspent coin after this block.'],
        ['Target', `<span class="hash">${toHex(b.target)}</span>`, 'The sequential proof of work must come in under this.'],
        ['Nonce', `<span class="mono">${escHtml(String(b.extension.nonce))}</span>`],
    ]);
    const txRows = n.transfers.map(t => {
        const s = summary(t);
        return [txLink(t), typeBadge(s.type), many(s.from, 5), many(s.to, 5), fmtAmt(s.value), fmtAmt(t.fee)];
    });
    const seals = n.commits.map(c => {
        const runsHere = n.byCommitment.get(c.commitment);

        ${card('Overview', `<div class="card-b">${overview}<details class="more-d"><summary>More details</summary>${more}</details></div>`)}
        ${card(`Transactions <span class="dim">(${fmtInt(n.transfers.length)})</span>`, `<div class="card-b">${dual(table(
            [{ t: 'Transaction' }, { t: 'Type' }, { t: 'From' }, { t: 'To' }, { t: 'Value', r: 1 }, { t: 'Fee', r: 1 }], txRows, 'No transactions ran in this block.'),

        ${seals.length ? card(`Sealed <span class="dim">(${fmtInt(seals.length)})</span>`, `<div class="card-b">${table([{ t: 'Transaction id' }, { t: 'Reveal' }], seals)}</div>`) : ''}

    }
    const rows = txs.slice(0, 50).map(t => {
        const s = summary(t);

function coinRows(items, side, focus) {
    if (!items.length) return '<div class="empty">None</div>';
    return items.map(c => {
        if (c.kind === 'src') return `<div class="coinrow"><span class="who">${badge('rew', c.src === 'new' ? 'New coins' : 'Fees')}</span><span class="amt">${fmtAmt(c.value)}</span></div>`;
        if (c.kind === 'burn') {
            const text = readableText(bytesOf(c.payload || ''));
            return `<div class="coinrow"><span class="who">${badge('', 'Data')} <span class="dim mono" style="margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${text ? escHtml(text) : `${fmtInt(c.payloadLen || 0)} bytes`}</span></span>${c.value ? `<span class="amt">${fmtAmt(c.value)} burned</span>` : ''}</div>`;
        }
        const st = side === 'out' && c.coinId ? (coinStatus.get(c.coinId) === 'alive' ? badge('ok', 'Unspent') : coinStatus.get(c.coinId) === 'spent' ? badge('', 'Spent') : '') : '';
        const isState = c.kind === 'state';
        return `<div class="coinrow"${c.coinId ? ` data-coin="${c.coinId}"` : ''}>${who(c.addr, 6)}<span class="st">${st}</span>
            <span class="amt">${isState ? badge('seal', 'State') : fmtAmt(c.value)}</span>
            ${c.coinId ? `<a class="copy" href="${href.q(c.coinId)}" title="Coin ${c.coinId}">${ic('coins')}</a>` : ''}</div>`;
    }).join('');
}

async function showTx(h, idx, seq) {
    if (!tipHeight) await poll();
    view().innerHTML = loading('Transaction…');
    let b;
    try { b = await getBatch(h); } catch (e) { return message('No such transaction', `<p>${escHtml(e.message)}</p>`); }
    if (stale(seq)) return;
    const n = normBlock(b, h);
    const t = idx === 'cb' ? n.cb : n.all[idx];
    if (!t) return message('No such transaction', `<p>Block ${fmtInt(h)} has no transaction ${escHtml(String(idx))}.</p>`);
    if (t.kind === 'commit') return showSeal(t, h, b, seq);
    const s = summary(t);
    const id = t.commitment;
    const overview = kv([
        id ? ['Transaction id', `<span class="hash">${id}</span>${copyBtn(id)}`, 'The hash both phases share: the seal commits to it, the reveal proves it. Search for it like a transaction hash.'] : ['Transaction', 'Block reward'],
        ['Status', badge('ok', 'Success', 'check'), 'A reveal only lands if every script it runs passes; there are no failed transactions on chain.'],
        ['Block', `<a class="mono" href="${href.block(h)}">${fmtInt(h)}</a> &nbsp;${confirmations(h)}`],
        ['Timestamp', `${fmtAgo(b.timestamp)} <span class="dim">(${utc(b.timestamp)})</span>`],
        id ? ['Sealed', `<span id="sealed-in"><span class="dim">looking…</span></span>`, 'Phase one: the hash went into an earlier block, hiding the details until the reveal. Nobody could front-run it.'] : null,
        ['Type', typeBadge(s.type)],
        ['From', s.from.length ? s.from.map(a => who(a, 10)).join('<br>') : badge('rew', 'Block reward')],
        ['To', s.to.length ? s.to.map(a => who(a, 10)).join('<br>') : '<span class="faint">—</span>'],
        ['Value', `<span class="big">${fmtAmt(s.value)}</span>`, 'What went to someone other than the sender. Coins coming back to a sender are change.'],
        t.kind !== 'coinbase' ? ['Fee', fmtAmt(t.fee), 'Paid in MDS to the miner. No gas: a fee covers the transaction\'s size.'] : null,
    ]);
    const flow = `<div class="card-b pad"><div class="flow">
        <div class="side"><h3>In · ${t.ins.length} coin${t.ins.length === 1 ? '' : 's'}</h3>${coinGroups(t.ins, 'in')}</div>
        <div class="mid">${ic('right')}</div>
        <div class="side"><h3>Out · ${t.outs.length} coin${t.outs.length === 1 ? '' : 's'}</h3>${coinGroups(t.outs, 'out', s.from)}</div>
    </div></div>`;
    const scripts = t.ins.filter(i => i.bytecode).map((i, k) => `<details class="more-d"><summary>Input ${k + 1} script <span class="dim">· ${i.std ? 'standard key' : 'custom script'}</span></summary>${renderScriptDisasm(i.bytecode)}</details>`).join('');
    view().innerHTML = `<div class="page-h"><h1>Transaction details</h1>${id ? `<span class="sub mono">${short(id, 10)}</span>` : ''}</div>
        ${card('Overview', `<div class="card-b">${overview}</div>`)}
        ${card('Coins', flow, help('Midstate is a coin chain like Bitcoin: a transaction spends whole coins and makes new ones. Every coin is a power of two, like banknotes.'))}
        ${scripts ? card('Scripts', `<div class="card-b">${scripts}</div>`) : ''}`;
    // Which outputs still exist.
    const ids = t.outs.map(o => o.coinId).filter(Boolean);
    checkCoins(ids).then(() => {
        if (stale(seq)) return;
        document.querySelectorAll('[data-coin] .st').forEach(el => {
            const id = el.parentElement.dataset.coin;
            if (!t.outs.some(o => o.coinId === id)) return;
            el.innerHTML = coinBadge(id);
        });
    });
    if (id) findSeal(id, h, n, seq);
}

/** Without the index: a reveal usually follows its seal within a block or
 *  two, so look forward from the seal (at most 60 blocks). */
async function walkForReveal(id, from, seq, limit = 60) {
    for (let hh = from; hh <= Math.min(tipHeight, from + limit); hh++) {
        if (stale(seq)) return null;
        let b;
        try { b = await getBatch(hh); } catch (_) { break; }
        const r = normBlock(b, hh).byCommitment.get(id);
        if (r) return { height: hh, tx: r.index };
    }
    return null;
}
/** …and a seal usually sits a block or two before its reveal. */
async function walkForSeal(id, from, seq, limit = 20) {
    for (let hh = from; hh >= Math.max(0, from - limit); hh--) {
        if (stale(seq)) return null;
        let b;
        try { b = await getBatch(hh); } catch (_) { break; }
        if (normBlock(b, hh).sealedHere.has(id)) return hh;
    }
    return null;
}

/** Where a transaction was sealed: the index knows at once; otherwise the
 *  blocks just before usually hold it, and failing that a search does. */
async function findSeal(id, h, n, seq) {
    const put = html => { const el = $('sealed-in'); if (el && !stale(seq)) el.innerHTML = html; };
    if (n.sealedHere.has(id)) return put(`in this block too, <a class="mono" href="${href.block(h)}">${fmtInt(h)}</a>`);
    try {
        const r = await fetch('/tx/' + id);
        if (r.ok) {
            const x = await r.json();
            if (x.sealed) return put(`in block <a class="mono" href="${href.block(x.sealed.height)}">${fmtInt(x.sealed.height)}</a> <span class="dim">(${fmtInt(h - x.sealed.height)} block${h - x.sealed.height === 1 ? '' : 's'} earlier)</span>`);
        }
    } catch (_) {}
    put('<span class="dim">looking in the blocks before…</span>');
    const at = await walkForSeal(id, h - 1, seq);
    if (stale(seq)) return;
    if (at != null) return put(`in block <a class="mono" href="${href.block(at)}">${fmtInt(at)}</a> <span class="dim">(${fmtInt(h - at)} block${h - at === 1 ? '' : 's'} earlier)</span>`);
    put(`in an earlier block <button class="btn" onclick="searchSeal('${id}', ${h})">Find it</button>`);
}

async function searchSeal(id, h) {
    const seq = routeSeq;
    const el = $('sealed-in');
    if (el) el.innerHTML = `<span class="dim">searching…</span>${powBar()}`;
    try {
        const results = await cachedSearch(id);
        if (stale(seq)) return;
        const c = results.find(r => r.result_type === 'commitment' && r.height <= h) || results.find(r => r.height < h);
        el.innerHTML = c ? `in block <a class="mono" href="${href.block(c.height)}">${fmtInt(c.height)}</a>` : '<span class="dim">not in the last 5,000 blocks</span>';
    } catch (e) { if (el) el.textContent = e.message; }
}

function showSeal(c, h, b, seq) {
    view().innerHTML = `<div class="page-h"><h1>Sealed transaction</h1></div>
        ${card('Overview', `<div class="card-b">${kv([
            ['Transaction id', `<span class="hash">${c.commitment}</span>${copyBtn(c.commitment)}`],
            ['Status', badge('seal', 'Sealed', 'lock'), 'Phase one of two. The block holds only this hash; what it spends and pays stays hidden until the reveal.'],
            ['Block', `<a class="mono" href="${href.block(h)}">${fmtInt(h)}</a> &nbsp;${confirmations(h)}`],
            ['Timestamp', `${fmtAgo(b.timestamp)} <span class="dim">(${utc(b.timestamp)})</span>`],
            ['Revealed', `<span id="revealed-in"><span class="dim">looking…</span></span>`],
        ])}</div>`)}`;
    (async () => {
        const put = html => { const el = $('revealed-in'); if (el && !stale(seq)) el.innerHTML = html; };
        const n = normBlock(b, h);
        const here = n.byCommitment.get(c.commitment);
        if (here) return put(`in this block, <a href="${href.tx(h, here.index)}">see the transaction</a>`);
        try {
            const r = await fetch('/tx/' + c.commitment);
            if (r.ok) {
                const x = await r.json();
                if (x.revealed) return put(`in block <a class="mono" href="${href.block(x.revealed.height)}">${fmtInt(x.revealed.height)}</a>, <a href="${href.tx(x.revealed.height, x.revealed.tx)}">see the transaction</a>`);
                return put('<span class="dim">not yet: a seal stays valid for 1,000 blocks</span>');
            }
        } catch (_) {}
        put('<span class="dim">looking in the blocks after…</span>');
        const r = await walkForReveal(c.commitment, h, seq);
        if (r) return put(`in block <a class="mono" href="${href.block(r.height)}">${fmtInt(r.height)}</a>, <a href="${href.tx(r.height, r.tx)}">see the transaction</a>`);
        const mp = findInMempool(c.commitment);
        put(mp ? 'waiting in the pending pool' : '<span class="dim">not in the 60 blocks after its seal</span>');
    })();
}

// ── Addresses ───────────────────────────────────────────────────────────

async function showAddress(addr, before, seq, prefetched, name) {
    const full = checksummed(addr);
    const head = `<div class="page-h" style="align-items:center">${identicon(addr, 28)}<h1>${name ? escHtml(name.name) : 'Address'}</h1>${name ? '<span class="sub">pays this address</span>' : ''}</div>
        <section class="card"><div class="card-b pad"><span class="hash addr-full">${full}</span>${copyBtn(full)}
        <div class="dim" style="font-size:12.5px;margin-top:6px">The last eight characters are a checksum. Every Midstate address is the hash of a script, usually a post-quantum signing key.</div></div></section>
        ${name ? nameCard(name) : ''}`;
    view().innerHTML = head + loading('Reading its history…');
    // The node's address index, when it keeps one, has the full history.
    let r = null;
    try { r = await fetch(`/address/${addr}/history?limit=25${before ? `&before=${encodeURIComponent(before)}` : ''}`); } catch (_) {}
    if (stale(seq)) return;
    if (r && r.ok) {
        const d = await r.json();
        if (stale(seq)) return;
        const list = d.rows.map(row => historyRow(row.height, row.tx == null ? 'cb' : row.tx, row.received, row.sent, ago(row.timestamp)));
        const pager = (before || d.next) ? `<div class="pager">${before ? `<a class="btn" href="${href.q(full)}">${ic('left')} Newest</a>` : ''}${d.next ? `<a class="btn" href="${href.q(full)}&before=${encodeURIComponent(d.next)}">Older ${ic('right')}</a>` : ''}</div>` : '';
        view().innerHTML = head + `<div class="stats">
                <div class="stat"><div class="k">Balance</div><div class="v">${fmtAmtText(d.balance)}</div><div class="s">${fmtInt(d.balance)} MDS</div></div>
                <div class="stat"><div class="k">Coins held${help('The unspent coins this address owns. Its balance is their sum.')}</div><div class="v">${fmtInt(d.coins)}</div><div class="s">&nbsp;</div></div>
                <div class="stat"><div class="k">Transactions</div><div class="v">${fmtInt(d.tx_count)}</div><div class="s">all time</div></div>
                <div class="stat"><div class="k">Last active</div><div class="v">${d.rows[0] ? fmtAgo(d.rows[0].timestamp) : '—'}</div><div class="s">${d.rows[0] ? `block ${fmtInt(d.rows[0].height)}` : '&nbsp;'}</div></div>
            </div>
            ${card(`Transactions <span class="dim">(${fmtInt(d.tx_count)})</span>`, `<div class="card-b">${list.join('') || '<div class="empty">No transactions yet.</div>'}</div>${pager}`)}`;
        return;
    }
    // No index here: the last 5,000 blocks, found by a proof-of-work search.
    view().innerHTML = head + `<div class="note">This node does not keep the address index, so this covers the last 5,000 blocks. Nodes started with <code>--rich-list</code> show every transaction instantly.</div>` + loading('Searching recent blocks…') + powBar();
    try {
        const indexedP = fetch(`/richlist/${addr}`).then(x => x.ok ? x.json() : null).catch(() => null);
        const results = prefetched || await cachedSearch(addr);
        if (stale(seq)) return;
        const st = await getState();
        const tip = st ? st.height : tipHeight + 1, from = Math.max(0, tip - 5000);
        const coins = await scanRange(addr, from, tip);
        if (stale(seq)) return;
        await checkCoins(coins.map(c => c.coin_id));
        if (stale(seq)) return;
        const indexed = await indexedP;
        const alive = coins.filter(c => coinStatus.get(c.coin_id) === 'alive');
        const acts = new Map();
        for (const x of results) {
            if (!['output_address', 'coinbase_address', 'input_address'].includes(x.result_type)) continue;
            const k = `${x.height}:${x.tx_index == null ? 'cb' : x.tx_index}`;
            const a = acts.get(k) || { h: x.height, i: x.tx_index == null ? 'cb' : x.tx_index, inV: 0, outV: 0 };
            const v = parseInt((/value (\d+)/.exec(x.detail || '') || [])[1] || '0', 10);
            if (x.result_type === 'input_address') a.outV += v; else a.inV += v;
            acts.set(k, a);
        }
        const list = [...acts.values()].sort((a, b) => b.h - a.h);
        const rows = list.map(a => historyRow(a.h, a.i, a.inV, a.outV, approxAge(a.h)));
        const bal = indexed ? indexed.balance : sum(alive.map(c => c.value));
        view().innerHTML = head + `<div class="note">This node does not keep the address index, so the history covers the last 5,000 blocks${indexed ? '' : ', and so does the balance'}. Nodes started with <code>--rich-list</code> show every transaction instantly.</div>
            <div class="stats">
                <div class="stat"><div class="k">Balance${indexed ? '' : ' (recent)'}</div><div class="v">${fmtAmtText(bal)}</div><div class="s">${fmtInt(bal)} MDS</div></div>
                <div class="stat"><div class="k">Coins held</div><div class="v">${fmtInt(indexed ? indexed.coins : alive.length)}</div><div class="s">&nbsp;</div></div>
                <div class="stat"><div class="k">Transactions</div><div class="v">${fmtInt(list.length)}</div><div class="s">last 5,000 blocks</div></div>
                <div class="stat"><div class="k">Rank</div><div class="v">${indexed && indexed.rank ? '#' + fmtInt(indexed.rank) : '—'}</div><div class="s">${indexed && indexed.rank ? fmtShare(indexed.share) + ' of supply' : '&nbsp;'}</div></div>
            </div>
            ${card('Transactions', `<div class="card-b">${rows.join('') || '<div class="empty">None in the last 5,000 blocks.</div>'}</div>`)}`;
    } catch (e) {
        if (!stale(seq)) message('Could not read this address', `<p>${escHtml(e.message)}</p>`);
    }
}

/** One transaction in an address's history: how the address's balance
 *  changed. A payment spends whole coins and takes change back, so what
 *  moved is the net: below zero is Out (fee included), above is In. This is
 *  how explorers of coin chains show it, and it never misstates a balance. */
function historyRow(h, i, received, sent, when) {
    const cb = i === 'cb';
    const net = received - sent;
    const kind = cb ? 'rew' : net > 0 ? 'in' : net < 0 ? 'out' : 'self';
    const word = { rew: 'Reward', self: 'Self', in: 'In', out: 'Out' }[kind];
    const amount = cb ? received : Math.abs(net);
    const sign = kind === 'out' ? '−' : kind === 'self' ? '' : '+';
    return `<div class="li h"><span class="dir ${kind}">${word.toUpperCase()}</span>
        <div><div class="t1"><a href="${href.tx(h, i)}">${cb ? 'Block reward' : `Transaction <span class="mono">${fmtInt(h)}.${i}</span>`}</a></div>
        <div class="t2">Block <a class="mono" href="${href.block(h)}">${fmtInt(h)}</a> · ${when}</div></div>
        <div class="end"><span class="${kind === 'out' ? 'neg' : kind === 'self' ? '' : 'pos'}">${sign}${fmtAmt(amount)}</span></div></div>`;
}

// ── Names ───────────────────────────────────────────────────────────────

function nameCard(n) {
    const d = n.deal;
    const deal = !d ? '' : d.kind === 'sale' ? `for sale at ${fmtAmtText(d.price)}` : d.kind === 'rent' ? `for rent at ${fmtAmtText(d.price)} per ${fmtInt(d.span)} blocks` : `rented out until block ${fmtInt(d.until)}`;
    const recs = (n.records || []).map(r => [escHtml(r.type), `<span class="hash">${escHtml(r.value)}</span>${r.signatures_left != null ? ` <span class="dim">· ${fmtInt(r.signatures_left)} signatures left</span>` : ''}`]);
    return card(`<span class="mono">${escHtml(n.name)}</span>`, `<div class="card-b">${kv([
        ['Tier', badge(n.tier === 'platinum' || n.tier === 'gold' ? 'rew' : '', escHtml(n.tier || ''))],
        ['Owner', `<span class="hash">${short(n.owner || '', 8)}</span>`, 'The control key: it updates the records and renews the name. It is separate from the addresses the name pays.'],
        ['Registered', `block ${fmtInt(n.since)} to block ${fmtInt(n.expires)}${n.lapsed ? ` ${badge('bad', 'Lapsed')}` : ''}`],
        deal ? ['Market', escHtml(deal)] : null,
        n.pays ? ['Pays', who(n.pays, 10), 'Send to the name and wallets pay this address: the first record that takes a payment.'] : null,
    ])}${recs.length ? `<details class="more-d" open><summary>Records (${recs.length})</summary>${kv(recs)}</details>` : ''}</div>`, help('Like ENS on Ethereum: a readable name that points at addresses and other records.'));
}

async function showName(name, seq) {
    view().innerHTML = loading(`Looking up ${escHtml(name)}…`);
    let res, body;
    try { res = await fetch(`/name/${encodeURIComponent(name)}`); body = await res.json(); }
    catch (_) { return message('Node not reachable'); }
    if (stale(seq)) return;
    if (!res.ok) return message(`${name} is not registered`, `<p>${escHtml(body.error || '')}</p><p>Names are registered from the desktop wallet's Names tab.</p>`);
    if (body.pays) return showAddress(body.pays, null, seq, null, body);
    view().innerHTML = `<div class="page-h"><h1>Name</h1></div>${nameCard(body)}`;
}

// ── Coins ───────────────────────────────────────────────────────────────

async function showCoin(id, results, seq) {
    await checkCoins([id]);
    if (stale(seq)) return;
    const st = coinStatus.get(id);
    const made = results.find(r => r.result_type === 'output_coin_id' || r.result_type === 'coinbase_coin_id');
    const spent = results.find(r => r.result_type === 'input_coin_id');
    let value = null, owner = null;
    if (made) {
        try {
            const b = await getBatch(made.height), n = normBlock(b, made.height);
            const t = made.tx_index == null ? n.cb : n.all[made.tx_index];
            const o = t && t.outs.find(o => o.coinId === id);
            if (o) { value = o.value; owner = o.addr; }
        } catch (_) {}
    }
    if (stale(seq)) return;
    const at = r => r ? `<a href="${href.tx(r.height, r.tx_index == null ? 'cb' : r.tx_index)}">block ${fmtInt(r.height)}${r.tx_index == null ? ', reward' : `, transaction ${r.tx_index}`}</a>` : '<span class="dim">not in the last 5,000 blocks</span>';
    view().innerHTML = `<div class="page-h"><h1>Coin</h1></div>${card('Overview', `<div class="card-b">${kv([
        ['Coin id', `<span class="hash">${id}</span>${copyBtn(id)}`, 'Like a banknote\'s serial number: the hash of its owner, value and a random salt.'],
        ['Status', st === 'alive' ? badge('ok', 'Unspent') : st === 'spent' ? badge('', 'Spent') : '<span class="dim">unknown</span>'],
        value != null ? ['Value', fmtAmt(value)] : null,
        owner ? ['Owner', who(owner, 10)] : null,
        ['Created in', at(made)],
        ['Spent in', st === 'alive' ? '<span class="dim">not spent</span>' : at(spent)],
    ])}</div>`)}`;
}

// ── Pending ─────────────────────────────────────────────────────────────

function findInMempool(q) {
    const txs = (lastMempoolData && lastMempoolData.transactions) || [];
    for (const raw of txs) {
        const t = normMempoolTx(raw);
        if (t.commitment === q || txTouches(t, q)) return t;
    }
    return null;
}

function showPendingTx(t) {
    view().innerHTML = `<div class="page-h"><h1>Pending transaction</h1></div>${card('Overview', `<div class="card-b">${kv([
        ['Transaction id', `<span class="hash">${t.commitment}</span>${copyBtn(t.commitment)}`],
        ['Status', badge('out', t.kind === 'commit' ? 'Sealed, waiting for a block' : 'Waiting for a block')],
        t.fee != null && t.kind !== 'commit' ? ['Fee', fmtAmt(t.fee)] : null,
        t.age != null ? ['Waiting', fmtAge(t.age)] : null,
    ])}</div>`)}${t.kind === 'commit' ? '' : card('Coins', `<div class="card-b pad"><div class="flow"><div class="side"><h3>In</h3>${coinGroups(t.ins, 'in')}</div><div class="mid">${ic('right')}</div><div class="side"><h3>Out</h3>${coinGroups(t.outs, 'out', summary(t).from)}</div></div></div>`)}`;
}

async function showMempool(seq) {
    await poll();
    if (stale(seq)) return;
    paintMempool();
}

function paintMempool() {
    const txs = ((lastMempoolData && lastMempoolData.transactions) || []).map(normMempoolTx);
    const reveals = txs.filter(t => t.kind !== 'commit'), seals = txs.filter(t => t.kind === 'commit');
    const rRows = reveals.map(t => {
        const s = summary(t);
        return [`<span class="hash" title="${t.commitment}">${short(t.commitment, 6)}</span>`, many(s.from, 5), many(s.to, 5), fmtAmt(s.value), t.fee != null ? fmtAmt(t.fee) : '—', t.age != null ? fmtAge(t.age) : '—'];
    });
    const sRows = seals.map(t => [`<span class="hash" title="${t.commitment}">${short(t.commitment, 8)}</span>`, t.pow != null ? `${t.pow} bits` : '—', t.age != null ? fmtAge(t.age) : '—']);
    view().innerHTML = `<div class="page-h"><h1>Pending</h1><span class="sub">waiting for the next block · refreshes on its own</span></div>
        ${card(`Transactions <span class="dim">(${fmtInt(reveals.length)})</span>`, `<div class="card-b">${table([{ t: 'Transaction' }, { t: 'From' }, { t: 'To' }, { t: 'Value', r: 1 }, { t: 'Fee', r: 1 }, { t: 'Waiting', r: 1 }], rRows, 'No reveals waiting.')}</div>`)}
        ${card(`Seals <span class="dim">(${fmtInt(seals.length)})</span>`, `<div class="card-b">${table([{ t: 'Transaction id' }, { t: 'Proof of work', r: 1 }, { t: 'Waiting', r: 1 }], sRows, 'No seals waiting.')}</div>`, help('Phase one of a transaction: just its hash, with a small proof of work instead of a fee. What it spends stays hidden until it is revealed.'))}`;
}

// ── Supply ──────────────────────────────────────────────────────────────

let lastSupply = null;
let lastRichList = null;

async function loadSupplyQuiet() {
    try {
        const r = await fetch('/supply');
        if (r.ok) lastSupply = await r.json();
    } catch (_) {}
}

async function showSupply(seq) {
    view().innerHTML = loading('Reading the supply…');
    await loadSupplyQuiet();
    const s = lastSupply;
    if (!s) return message('Supply unavailable', '<p>The node did not answer.</p>');
    lastRichList = null;
    if (s.index && s.index.status === 'ready') {
        try { const r = await fetch('/richlist?limit=100'); if (r.ok) lastRichList = await r.json(); } catch (_) {}
    }
    if (stale(seq)) return;
    const ix = s.index || {};
    const stat = (k, v, sub) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
    const facts = [['Block reward', `${fmtGShort(s.block_reward)} gMDS`]];
    if (s.next_halving_height != null) {
        const left = s.next_halving_height - (s.height + 1);
        facts.push(['Next halving', `block ${fmtInt(s.next_halving_height)} · in ${fmtInt(left)} blocks (${fmtDuration(left)})`]);
    }
    if (s.tail_emission) facts.push(['Tail emission', `${s.tail_emission.per_block} MDS per block from block ${fmtInt(s.tail_emission.from_height)}`]);
    if (s.holders != null) facts.push(['Holders', fmtInt(s.holders)]);
    if (s.unspent_coins != null) facts.push(['Unspent coins', fmtInt(s.unspent_coins)]);
    if (s.verified != null) facts.push(['Supply check', s.verified ? badge('ok', 'Adds up', 'check') + ' <span class="dim">unspent coins equal issued minus burned</span>' : badge('bad', 'Does not add up')]);
    let note = '';
    if (ix.status === 'disabled') note = `<div class="note">Circulating supply, holders and the rich list come from the node's balance index. Start the node with <code>--rich-list</code> to keep it.</div>`;
    else if (ix.status === 'building' && ix.chain_blocks) note = `<div class="note">Building the balance index: block ${fmtInt(ix.indexed_blocks)} of ${fmtInt(ix.chain_blocks)} (${(ix.indexed_blocks / ix.chain_blocks * 100).toFixed(1)}%).</div>`;
    const rl = lastRichList;
    const rich = rl ? card(`Top ${rl.entries.length} holders`, `<div class="card-b">${dual(table([{ t: 'Rank' }, { t: 'Address' }, { t: 'Balance', r: 1 }, { t: 'Share', r: 1 }, { t: 'Coins', r: 1 }],
        rl.entries.map(e => [`<span class="mono">${e.rank}</span>`, who(e.address.slice(0, 64), 8), `${fmtG(e.balance)} gMDS`, fmtShare(e.share), fmtInt(e.coins)])),
        rl.entries.map(e => `<div class="li h"><span class="dir self">#${e.rank}</span><div><div class="t1">${who(e.address.slice(0, 64), 6)}</div><div class="t2">${fmtInt(e.coins)} coins · ${fmtShare(e.share)}</div></div><div class="end">${fmtG(e.balance)} gMDS</div></div>`).join(''))}</div>`,
        `<span class="dim" style="font-size:12.5px">top 10 hold ${fmtShare(rl.top_10_share)} · top 100 hold ${fmtShare(rl.top_100_share)}</span>`) : '';
    view().innerHTML = `<div class="page-h"><h1>Supply</h1><span class="sub">at block ${fmtInt(s.height)}</span></div>
        <div class="stats">
            ${stat('Circulating', s.circulating_supply != null ? `${fmtG(s.circulating_supply)} gMDS` : '—', s.circulating_supply != null ? `${fmtInt(s.circulating_supply)} MDS` : 'needs the balance index')}
            ${stat('Max supply', `${fmtG(s.max_supply, 0)} gMDS`, 'ever')}
            ${stat('Issued', `${fmtG(s.issued)} gMDS`, `${(s.issued / s.max_supply * 100).toFixed(2)}% of max`)}
            ${stat('Burned', `${fmtG(s.burned != null ? s.burned : s.burned_genesis)} gMDS`, s.burned != null ? 'genesis and data burns' : 'genesis')}
        </div>${note}
        ${card('Issuance', `<div class="card-b">${kv(facts)}</div>`)}${rich}`;
}

// ── Learn ───────────────────────────────────────────────────────────────

    view().innerHTML = `<div class="page-h"><h1>Midstate for Ethereum, Solana and Base users</h1></div>
        ${card('The short version', `<div class="card-b">${dual(table([{ t: 'You know' }, { t: 'Here it is' }, { t: 'What changes' }], rows.map(([a, b, c]) => [`<b>${a}</b>`, b, `<span class="dim">${c}</span>`])),
            rows.map(([a, b, c]) => `<div class="learn" style="padding:10px 0;border-bottom:1px solid var(--line2)"><div><b>${a}</b> <span class="arrow">→</span> ${b}</div><p class="dim" style="margin:4px 0 0">${c}</p></div>`).join(''))}</div>`)}
        ${card('Reading a transaction', `<div class="card-b pad learn">

function showApi() {
    const o = window.location.origin;
    const rows = [
        ['/state', 'tip, coin count, reward, settle depth'],
        ['/batch/:height', 'a block, as JSON'],
        ['/tx/:id', 'where a transaction was sealed and revealed (address index)'],
        ['/address/:address/history?before=&limit=', 'an address\'s transactions, newest first (address index)'],
        ['/richlist/:address', 'balance, coins and rank (address index)'],
        ['/coin/:id', 'whether a coin exists'],
        ['/name/:name', 'a .mds name and its records'],

        ['/supply, /supply/circulating', 'supply figures'],
        ['/richlist?limit=', 'the largest holders'],
    ];
    view().innerHTML = `<div class="page-h"><h1>API</h1><span class="sub">plain JSON over HTTP from this node</span></div>
        ${card('Endpoints', `<div class="card-b">${table([{ t: 'GET' }, { t: 'Returns' }], rows.map(([p, d]) => [`<code>${escHtml(o + p)}</code>`, d]))}</div>`)}`;
}

// ── Polling ─────────────────────────────────────────────────────────────

async function poll() {
    try {
        const [sRes, mRes, pRes] = await Promise.all([fetch('/state'), fetch('/mempool'), fetch('/peers')]);
        const state = await sRes.json();
        lastMempoolData = await mRes.json();
        lastPeers = ((await pRes.json()).peers || []).length;
        const prev = tipHeight;
        tipHeight = Math.max(0, state.height - 1);
        lastState = state;
        $('live-h').textContent = fmtInt(tipHeight);
        $('live').classList.remove('off');
        $('live').title = state.is_syncing ? 'Syncing' : `Latest block ${fmtInt(tipHeight)}`;
        if (tipHeight !== prev) {
            for (const [k, v] of coinStatus) if (v === 'alive') coinStatus.delete(k);
            if (prev > 0) loadRecentStats();
            if (prev > 0 && page === 'home') refreshHome(routeSeq);
        }
        if (page === 'home') paintHome();
        if (page === 'mempool' && !document.hidden) {
            // Repaint in place without moving the reader.
            const y = window.scrollY;
            paintMempool();
            window.scrollTo(0, y);
        }
    } catch (e) {
        $('live').classList.add('off');
        $('live').title = 'The node is not answering';
    }
}

async function init() {
    if (window.innerWidth < 640) $('q').placeholder = 'Address, transaction, block or name';
    await poll();
    loadRecentStats();
    loadSupplyQuiet().then(() => { if (page === 'home') paintHome(); });
    route(parseLocation());
    setInterval(() => { if (!document.hidden) poll(); }, 5000);
}
init();
