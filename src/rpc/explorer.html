<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midstate Explorer</title>
<meta name="description" content="Blocks, transactions, addresses and .mds names on the Midstate chain.">
<script>
(function(){try{var t=localStorage.getItem('midstate-theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
function toggleTheme(){var d=document.documentElement,n=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',n);try{localStorage.setItem('midstate-theme',n);}catch(e){}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root, [data-theme="light"] {
  --bg: #f5f5f4; --card: #ffffff; --raised: #fafaf9; --line: #e4e4e2; --line2: #efefed;
  --ink: #111111; --text: #2b2b2b; --muted: #6b6b6b; --faint: #a3a3a3;
  --link: #111111; --hover: #f0f0ee; --code: #f4f4f2;
  --in: #0f7b45; --in-bg: #e5f4ec; --out: #a15c07; --out-bg: #fbf0df;
  --rew: #5b4bb7; --rew-bg: #eeebfa; --seal: #2f5f9e; --seal-bg: #e7eef8; --bad: #b42318; --bad-bg: #fdecea;
  --shadow: 0 1px 0 rgba(0,0,0,.02);
}
[data-theme="dark"] {
  --bg: #0a0a0a; --card: #121212; --raised: #161616; --line: #262626; --line2: #1d1d1d;
  --ink: #f5f5f5; --text: #d4d4d4; --muted: #9a9a9a; --faint: #5f5f5f;
  --link: #f5f5f5; --hover: #1b1b1b; --code: #181818;
  --in: #5fd39a; --in-bg: #0f2a1c; --out: #f0b35b; --out-bg: #2c1f0b;
  --rew: #b3a6ff; --rew-bg: #211c3a; --seal: #8db5ec; --seal-bg: #122033; --bad: #ff8a80; --bad-bg: #2d1210;
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
.mono, .hash, code, .num { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
button { font: inherit; color: inherit; }
.dim { color: var(--muted); }
.faint { color: var(--faint); }

/* ── Header ── */
.top { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-row { display: flex; align-items: center; gap: 18px; height: 56px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .02em; color: var(--ink); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand .mark { width: 22px; height: 22px; border: 2px solid var(--ink); display: grid; place-items: center; font-size: 11px; }
.brand small { font-weight: 500; color: var(--muted); letter-spacing: 0; }
.nav { display: flex; gap: 2px; margin-left: 8px; }
.nav a { padding: 7px 11px; color: var(--muted); font-weight: 500; }
.nav a:hover { color: var(--ink); text-decoration: none; background: var(--hover); }
.nav a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.live { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--in); box-shadow: 0 0 0 3px var(--in-bg); }
.live.off i { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
.icon-btn { background: none; border: 1px solid var(--line); width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; color: var(--text); }
.icon-btn:hover { background: var(--hover); }
.icon-btn svg { width: 16px; height: 16px; }
.menu-btn { display: none; }
.search-row { padding: 10px 16px 12px; }
.search { display: flex; border: 1px solid var(--line); background: var(--card); }
.search:focus-within { border-color: var(--ink); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); padding: 11px 12px; font: 14px 'Inter', system-ui, sans-serif; outline: none; }
.search button { border: 0; border-left: 1px solid var(--line); background: var(--ink); color: var(--card); padding: 0 16px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.search button svg { width: 15px; height: 15px; }
@media (max-width: 640px) { .search button .lbl { display: none; } }

/* ── Layout ── */
main { padding-top: 18px; padding-bottom: 40px; min-height: 60vh; }
.page-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 4px 0 14px; }
.page-h h1 { font-size: 20px; margin: 0; color: var(--ink); font-weight: 600; letter-spacing: -.01em; }
.page-h .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.card { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); margin-bottom: 16px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-h h2 { font-size: 14px; margin: 0; color: var(--ink); font-weight: 600; }
.card-h .more { margin-left: auto; font-size: 13px; }
.card-b { padding: 4px 16px 12px; }
.card-b.pad { padding: 14px 16px; }
.card-f { padding: 10px 16px; border-top: 1px solid var(--line); text-align: center; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2 > .card { margin-bottom: 0; }
.stack > * + * { margin-top: 16px; }

/* ── Stats ── */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--card); margin-bottom: 16px; }
.stat { padding: 14px 16px; border-right: 1px solid var(--line2); border-bottom: 1px solid var(--line2); min-width: 0; }
.stat:nth-child(4n) { border-right: 0; }
.stat .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 6px; }
.stat .v { font-size: 18px; color: var(--ink); font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .s { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat a.v { display: block; }

/* ── Key/value overview ── */
.kv { display: block; }
.kv-row { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line2); align-items: start; }
.kv-row:last-child { border-bottom: 0; }
.kv-k { color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kv-v { color: var(--text); min-width: 0; overflow-wrap: anywhere; }
.kv-v .big { font-size: 16px; color: var(--ink); font-weight: 600; }
.sep { height: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* ── Tables ── */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--hover); }
.tbl .r { text-align: right; }
.tbl td.wrap { overflow-wrap: anywhere; }

/* ── Lists (latest blocks / transactions) ── */
.li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line2); }
.li:last-child { border-bottom: 0; }
.li .ico { width: 44px; height: 44px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); background: var(--raised); }
.li .ico svg { width: 18px; height: 18px; }
.li .t1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .t2 { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .end { text-align: right; white-space: nowrap; }

/* ── Bits ── */
.hash { font-size: 13px; }
.copy { background: none; border: 0; cursor: pointer; color: var(--faint); padding: 2px 4px; vertical-align: middle; }
.copy:hover { color: var(--ink); }
.copy svg { width: 14px; height: 14px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border: 1px solid var(--line); color: var(--muted); background: var(--raised); white-space: nowrap; }
.badge.in { color: var(--in); background: var(--in-bg); border-color: transparent; }
.badge.out { color: var(--out); background: var(--out-bg); border-color: transparent; }
.badge.rew { color: var(--rew); background: var(--rew-bg); border-color: transparent; }
.badge.seal { color: var(--seal); background: var(--seal-bg); border-color: transparent; }
.badge.ok { color: var(--in); background: var(--in-bg); border-color: transparent; }
.badge.bad { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
.badge svg { width: 12px; height: 12px; }
.amt b { font-weight: 600; color: var(--ink); }
.amt i { font-style: normal; color: var(--muted); margin-left: 3px; font-size: .9em; }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: square; vertical-align: -0.12em; }
.idc { vertical-align: middle; margin-right: 6px; flex: 0 0 auto; }
.idc .idc-bg { fill: var(--raised); }
.idc g, .idc rect:not(.idc-bg) { fill: hsl(var(--h), 55%, 45%); }
[data-theme="dark"] .idc g, [data-theme="dark"] .idc rect:not(.idc-bg) { fill: hsl(var(--h), 60%, 62%); }
.idc-none { display: inline-block; vertical-align: middle; margin-right: 6px; background: var(--raised); border: 1px solid var(--line); }
.who { display: inline-flex; align-items: center; min-width: 0; max-width: 100%; }
.who a { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arrow { color: var(--faint); margin: 0 6px; }
.help { display: inline-grid; place-items: center; width: 15px; height: 15px; border: 1px solid var(--line); color: var(--faint); font-size: 10px; cursor: help; position: relative; flex: 0 0 auto; }
.help:hover, .help:focus { color: var(--ink); border-color: var(--ink); outline: none; }
.help:hover::after, .help:focus::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); width: max-content; max-width: 280px; background: var(--ink); color: var(--card); font-size: 12px; line-height: 1.45; padding: 8px 10px; z-index: 30; white-space: normal; text-transform: none; letter-spacing: 0; font-weight: 400; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); padding: 7px 12px; cursor: pointer; color: var(--ink); font-size: 13px; font-weight: 500; }
.btn:hover { background: var(--hover); text-decoration: none; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; }
.tabs a { padding: 11px 12px; color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; }
.tabs a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.tabs a:hover { text-decoration: none; color: var(--ink); }
.note { border: 1px solid var(--line); background: var(--raised); padding: 12px 14px; color: var(--text); font-size: 13px; margin: 10px 0; }
.note b { color: var(--ink); }
.empty { padding: 26px 0; text-align: center; color: var(--muted); }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
@keyframes sp { to { transform: rotate(360deg); } }
.pow { height: 3px; background: var(--line); margin: 10px auto 0; max-width: 240px; overflow: hidden; }
.pow i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
.flow { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.flow .side h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.flow .mid { display: grid; place-items: center; color: var(--faint); padding-top: 30px; }
.coinrow { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line2); background: var(--raised); margin-bottom: 6px; min-width: 0; }
.coinrow .who { flex: 1; min-width: 0; }
.coinrow .amt { white-space: nowrap; }
.coinrow .st { font-size: 11px; }
details.more-d { border-top: 1px solid var(--line2); }
details.more-d > summary { cursor: pointer; padding: 11px 0; color: var(--muted); list-style: none; }
details.more-d > summary::-webkit-details-marker { display: none; }
details.more-d > summary::before { content: '+ '; }
details.more-d[open] > summary::before { content: '− '; }
.script-header { font-size: 11px; color: var(--muted); margin: 8px 0 4px; letter-spacing: .05em; }
.script-disasm { font: 12px/1.6 'JetBrains Mono', ui-monospace, monospace; background: var(--code); border: 1px solid var(--line2); padding: 10px; overflow-x: auto; white-space: pre; }
.learn h3 { color: var(--ink); font-size: 15px; margin: 18px 0 6px; }
.learn p { margin: 6px 0; }
.hero { padding: 6px 0 14px; }
.hero h1 { font-size: 22px; margin: 0 0 4px; color: var(--ink); letter-spacing: -.01em; }
.hero p { margin: 0; color: var(--muted); }
.callout { display: flex; gap: 14px; align-items: flex-start; }
.callout .mark { width: 32px; height: 32px; border: 1px solid var(--line); display: grid; place-items: center; flex: 0 0 auto; }
/* Links inside sentences look like links. */
.callout a, .note a, .foot a, .learn a, .empty a, .card-b.pad p a, .kv-v a.lnk { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.callout a:hover, .note a:hover, .foot a:hover, .learn a:hover { text-decoration-color: var(--ink); }
.addr-full { font-size: 14px; overflow-wrap: anywhere; word-break: break-all; }
.only-narrow { display: none; }
.grp { border: 1px solid var(--line2); background: var(--raised); margin-bottom: 6px; }
.grp > summary, .grp > .grp-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; min-width: 0; cursor: pointer; list-style: none; }
.grp > .grp-row { cursor: default; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary .who, .grp > .grp-row .who { flex: 1; min-width: 0; }
.grp .n { font-size: 12px; color: var(--muted); white-space: nowrap; }
.grp .amt { white-space: nowrap; }
.grp .chev { color: var(--faint); transition: transform .15s; }
.grp[open] .chev { transform: rotate(90deg); }
.grp .coins { padding: 0 10px 8px 34px; }
.grp .coin { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-top: 1px dashed var(--line2); font-size: 13px; }
.grp .coin:first-child { border-top: 0; }
.li.h { grid-template-columns: 54px minmax(0, 1fr) auto; }
.dir { width: 54px; height: 30px; display: grid; place-items: center; font-size: 10px; font-weight: 700; letter-spacing: .03em; }
.dir.in { color: var(--in); background: var(--in-bg); } .dir.out { color: var(--out); background: var(--out-bg); }
.dir.rew { color: var(--rew); background: var(--rew-bg); } .dir.self { color: var(--muted); background: var(--raised); border: 1px solid var(--line); }
.pos { color: var(--in); } .neg { color: var(--out); }
.foot { color: var(--faint); font-size: 12px; padding: 18px 16px 30px; border-top: 1px solid var(--line); display: flex; gap: 14px; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--card); padding: 9px 14px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px); z-index: 40; }
#toast.on { opacity: 1; }

/* ── Narrow screens (an iPhone SE is 375 points wide) ── */
@media (max-width: 1000px) {
  .grid2 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(4n) { border-right: 1px solid var(--line2); }
  .stat:nth-child(2n) { border-right: 0; }
}
@media (max-width: 860px) {
  .nav { display: none; position: absolute; top: 56px; left: 0; right: 0; background: var(--card); border-bottom: 1px solid var(--line); flex-direction: column; padding: 6px 8px 10px; margin: 0; }
  .nav.open { display: flex; }
  .nav a { padding: 11px 10px; }
  .nav a.on { box-shadow: inset 2px 0 0 var(--ink); }
  .menu-btn { display: grid; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 12px; }
  .search-row { padding: 8px 12px 10px; }
  .top-row { gap: 10px; }
  .brand small { display: none; }
  .live .lbl { display: none; }
  main { padding-top: 12px; }
  .kv-row { grid-template-columns: 1fr; gap: 3px; padding: 10px 0; }
  .kv-k { font-size: 12.5px; }
  .card-h { padding: 11px 12px; }
  .card-b { padding: 2px 12px 10px; }
  .card-b.pad { padding: 12px; }
  .stat { padding: 11px 12px; }
  .stat .v { font-size: 16px; }
  .flow { grid-template-columns: 1fr; }
  .flow .mid { padding: 0; transform: rotate(90deg); height: 18px; }
  /* Tables become one card per row, each cell labelled. */
  .tbl thead { display: none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display: block; width: 100%; }
  .tbl tr { padding: 10px 0; border-bottom: 1px solid var(--line2); }
  .tbl tr:last-child { border-bottom: 0; }
  .tbl tbody tr:hover td { background: none; }
  .tbl td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; gap: 12px; text-align: right; min-width: 0; }
  .tbl td::before { content: attr(data-l); color: var(--muted); font-size: 12px; text-align: left; flex: 0 0 auto; padding-top: 1px; }
  .tbl td.r { text-align: right; }
  .tbl td > * { min-width: 0; }
  .tbl td .who { justify-content: flex-end; }
  .li { grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; }
  .li .ico { width: 36px; height: 36px; }
  .help:hover::after, .help:focus::after { left: auto; right: -8px; transform: none; max-width: 240px; }
  .stat .s { white-space: normal; }
  .li .t2 { white-space: normal; }
  .li .t2 .nw { white-space: nowrap; display: inline-flex; align-items: center; max-width: 100%; }
  .only-wide { display: none; }
  .li.h { grid-template-columns: 50px minmax(0, 1fr) auto; }
  .dir { width: 50px; font-size: 9.5px; }
  /* A coin group: who and how much on the first line, its badges below. */
  .grp > summary, .grp > .grp-row { flex-wrap: wrap; row-gap: 5px; }
  .grp > summary .who, .grp > .grp-row .who { flex: 1 1 55%; }
  .grp .amt, .grp .chev, .grp .copy { order: 2; }
  .grp .badge, .grp .st, .grp .n { order: 3; }
  .grp .st:empty { display: none; }
  .grp .coins { padding-left: 12px; }
  .only-narrow { display: block; }
  .page-h h1 { font-size: 18px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="?" title="Home"><span class="mark">M</span>MIDSTATE <small>Explorer</small></a>
    <nav class="nav" id="nav">
      <a href="?" data-page="home">Home</a>
      <a href="?q=blocks" data-page="blocks">Blocks</a>
      <a href="?q=transactions" data-page="txs">Transactions</a>
      <a href="?q=mempool" data-page="mempool">Pending</a>
      <a href="?q=supply" data-page="supply">Supply</a>
      <a href="?q=learn" data-page="learn">New to Midstate?</a>
    </nav>
    <div class="tools">
      <a class="live off" id="live" href="?" title="Latest block"><i></i><span class="lbl">Block</span><span id="live-h" class="mono">—</span></a>
      <button class="icon-btn" onclick="toggleTheme()" title="Light or dark" aria-label="Toggle theme"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
      <button class="icon-btn menu-btn" onclick="toggleMenu()" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>

<div id="toast" role="status"></div>
<script>
let tipHeight = 0;
let lastState = null;
// Bumped on every navigation. A view that awaits (a block fetch, a proof of
// work) checks it afterwards and gives up if the reader has moved on.
let routeSeq = 0;
const $ = id => document.getElementById(id);
const sum = a => a.reduce((s, x) => s + (Number(x) || 0), 0);
const nowSecs = () => Math.floor(Date.now() / 1000);

// ==================== BLAKE3 ====================
// Pure-JS BLAKE3, byte-identical to the Rust `blake3` crate (v1.5.0) the node
// uses. Verified against 535 vectors generated from that crate.
//
// It replaces an implementation that was not BLAKE3 at all: it flagged every
// block CHUNK_START, never CHUNK_END, advanced the counter per 64-byte block
// instead of per 1024-byte chunk, and finalised over an empty block. It
// returned the wrong digest for every input including "abc" — so the /scan PoW
// gate could never pass: the client mined against its own hash while the server
// recomputed the real one and rejected every submission.
//
// TWO ENTRY POINTS, AND THE DIFFERENCE MATTERS:
//   blake3Hex(str)        -> hashes the UTF-8 BYTES OF THE STRING.
//                            Use for the PoW preimage: the server computes
//                            blake3::hash(input.as_bytes()) over "addr:h:ts:nonce".
//   blake3_hash_hex(hex)  -> DECODES the hex first, then hashes those bytes.
//                            Use for address checksums: blake3(address_bytes)[0..4].
// Mixing them up yields a valid-looking wrong hash.
(function() {
  const OUT_LEN = 32;
  const KEY_LEN = 32;
  const BLOCK_LEN = 64;
  const CHUNK_LEN = 1024;

  const CHUNK_START = 1 << 0;
  const CHUNK_END = 1 << 1;
  const PARENT = 1 << 2;
  const ROOT = 1 << 3;
  const KEYED_HASH = 1 << 4;
  const DERIVE_KEY_CONTEXT = 1 << 5;
  const DERIVE_KEY_MATERIAL = 1 << 6;

  // The SHA-256 initialisation vector.
  const IV = Uint32Array.of(
    0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
    0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19,
  );

  const MSG_PERMUTATION = Uint8Array.of(2, 6, 3, 10, 7, 0, 4, 13, 1, 11, 12, 5, 9, 14, 15, 8);

  // ── 32-bit primitives ────────────────────────────────────────────────────────
  // JS numbers are doubles, so a+b+c for three uint32 tops out around 2^33.6 —
  // well inside the 2^53 exact-integer range. The `>>> 0` then truncates to
  // uint32, giving exactly Rust's wrapping_add.
  const rotr = (x, n) => ((x >>> n) | (x << (32 - n))) >>> 0;

  function g(s, a, b, c, d, mx, my) {
    s[a] = (s[a] + s[b] + mx) >>> 0;
    s[d] = rotr(s[d] ^ s[a], 16);
    s[c] = (s[c] + s[d]) >>> 0;
    s[b] = rotr(s[b] ^ s[c], 12);
    s[a] = (s[a] + s[b] + my) >>> 0;
    s[d] = rotr(s[d] ^ s[a], 8);
    s[c] = (s[c] + s[d]) >>> 0;
    s[b] = rotr(s[b] ^ s[c], 7);
  }

  function round(s, m) {
    // Columns.
    g(s, 0, 4, 8, 12, m[0], m[1]);
    g(s, 1, 5, 9, 13, m[2], m[3]);
    g(s, 2, 6, 10, 14, m[4], m[5]);
    g(s, 3, 7, 11, 15, m[6], m[7]);
    // Diagonals.
    g(s, 0, 5, 10, 15, m[8], m[9]);
    g(s, 1, 6, 11, 12, m[10], m[11]);
    g(s, 2, 7, 8, 13, m[12], m[13]);
    g(s, 3, 4, 9, 14, m[14], m[15]);
  }

  const _permScratch = new Uint32Array(16);
  function permute(m) {
    for (let i = 0; i < 16; i++) _permScratch[i] = m[MSG_PERMUTATION[i]];
    m.set(_permScratch);
  }

  /**
   * The BLAKE3 compression function. Returns all 16 state words: callers take
   * the first 8 as a chaining value, or all 16 for root output.
   * @param {Uint32Array} cv 8 words
   * @param {Uint32Array} blockWords 16 words
   * @param {number} counter u64 as a JS number (exact below 2^53; a chunk
   *   counter that large would need ~2^63 bytes of input)
   */
  function compress(cv, blockWords, counter, blockLen, flags) {
    const s = new Uint32Array(16);
    s[0] = cv[0]; s[1] = cv[1]; s[2] = cv[2]; s[3] = cv[3];
    s[4] = cv[4]; s[5] = cv[5]; s[6] = cv[6]; s[7] = cv[7];
    s[8] = IV[0]; s[9] = IV[1]; s[10] = IV[2]; s[11] = IV[3];
    s[12] = counter >>> 0;                        // counter low word
    s[13] = Math.floor(counter / 0x100000000) >>> 0;  // counter high word
    s[14] = blockLen >>> 0;
    s[15] = flags >>> 0;

    const m = Uint32Array.from(blockWords);       // permute mutates; don't touch the caller's copy

    // 7 rounds, permuting between them (6 permutations).
    round(s, m); permute(m);
    round(s, m); permute(m);
    round(s, m); permute(m);
    round(s, m); permute(m);
    round(s, m); permute(m);
    round(s, m); permute(m);
    round(s, m);

    for (let i = 0; i < 8; i++) {
      s[i] = (s[i] ^ s[i + 8]) >>> 0;
      s[i + 8] = (s[i + 8] ^ cv[i]) >>> 0;
    }
    return s;
  }

  function first8(words) { return words.slice(0, 8); }

  /** Read 16 little-endian u32 from a 64-byte block. */
  function wordsFromLeBytes64(bytes, out) {
    for (let i = 0; i < 16; i++) {
      const o = i * 4;
      out[i] = (bytes[o] | (bytes[o + 1] << 8) | (bytes[o + 2] << 16) | (bytes[o + 3] << 24)) >>> 0;
    }
    return out;
  }

  // ── Output ───────────────────────────────────────────────────────────────────
  // A node's compression inputs, deferred: the same words yield either a chaining
  // value (feeding a parent) or the root hash (with ROOT set). Deferring is what
  // lets BLAKE3 decide "am I the root?" only at finalize.
  class Output {
    constructor(inputCv, blockWords, counter, blockLen, flags) {
      this.inputCv = inputCv;
      this.blockWords = blockWords;
      this.counter = counter;
      this.blockLen = blockLen;
      this.flags = flags;
    }
    chainingValue() {
      return first8(compress(this.inputCv, this.blockWords, this.counter, this.blockLen, this.flags));
    }
    /** Root bytes. Each 64-byte output block bumps the counter, so this extends
     *  to arbitrary length — Midstate only ever asks for 32. */
    rootOutputBytes(out) {
      let blockCounter = 0;
      for (let off = 0; off < out.length; off += 2 * OUT_LEN) {
        const words = compress(this.inputCv, this.blockWords, blockCounter, this.blockLen, this.flags | ROOT);
        const take = Math.min(2 * OUT_LEN, out.length - off);
        for (let i = 0; i < take; i++) {
          out[off + i] = (words[i >> 2] >>> (8 * (i & 3))) & 0xff;
        }
        blockCounter++;
      }
      return out;
    }
  }

  // ── ChunkState ───────────────────────────────────────────────────────────────
  // One 1024-byte leaf: up to 16 blocks compressed in sequence. The first block
  // carries CHUNK_START, the last CHUNK_END.
  class ChunkState {
    constructor(keyWords, chunkCounter, flags) {
      this.cv = Uint32Array.from(keyWords);
      this.chunkCounter = chunkCounter;
      this.block = new Uint8Array(BLOCK_LEN);
      this.blockLen = 0;
      this.blocksCompressed = 0;
      this.flags = flags;
      this._words = new Uint32Array(16);
    }
    len() { return BLOCK_LEN * this.blocksCompressed + this.blockLen; }
    startFlag() { return this.blocksCompressed === 0 ? CHUNK_START : 0; }
    update(input, start, end) {
      let i = start;
      while (i < end) {
        if (this.blockLen === BLOCK_LEN) {
          wordsFromLeBytes64(this.block, this._words);
          this.cv = first8(compress(this.cv, this._words, this.chunkCounter, BLOCK_LEN, this.flags | this.startFlag()));
          this.blocksCompressed++;
          this.block.fill(0);
          this.blockLen = 0;
        }
        const want = BLOCK_LEN - this.blockLen;
        const take = Math.min(want, end - i);
        this.block.set(input.subarray(i, i + take), this.blockLen);
        this.blockLen += take;
        i += take;
      }
    }
    output() {
      const words = wordsFromLeBytes64(this.block, new Uint32Array(16));
      return new Output(this.cv, words, this.chunkCounter, this.blockLen, this.flags | this.startFlag() | CHUNK_END);
    }
  }

  function parentOutput(leftCv, rightCv, keyWords, flags) {
    const blockWords = new Uint32Array(16);
    blockWords.set(leftCv, 0);
    blockWords.set(rightCv, 8);
    return new Output(Uint32Array.from(keyWords), blockWords, 0, BLOCK_LEN, PARENT | flags);
  }
  function parentCv(leftCv, rightCv, keyWords, flags) {
    return parentOutput(leftCv, rightCv, keyWords, flags).chainingValue();
  }

  // ── Hasher ───────────────────────────────────────────────────────────────────
  class Blake3 {
    constructor(keyWords = IV, flags = 0) {
      this.keyWords = Uint32Array.from(keyWords);
      this.chunkState = new ChunkState(this.keyWords, 0, flags);
      this.cvStack = [];
      this.flags = flags;
    }

    /**
     * Merge completed subtrees.
     *
     * The stack discipline is the whole trick: the number of trailing zero bits
     * in `totalChunks` is exactly how many subtrees are now complete and must be
     * merged. That reproduces BLAKE3's canonical left-leaning tree without ever
     * materialising it.
     */
    _addChunkChainingValue(newCv, totalChunks) {
      let cv = newCv;
      let n = totalChunks;
      while ((n & 1) === 0) {
        cv = parentCv(this.cvStack.pop(), cv, this.keyWords, this.flags);
        n = Math.floor(n / 2);      // n >>= 1, but safe past 2^31
      }
      this.cvStack.push(cv);
      return this;
    }

    update(data) {
      const input = toBytes(data);
      let i = 0;
      while (i < input.length) {
        if (this.chunkState.len() === CHUNK_LEN) {
          const chunkCv = this.chunkState.output().chainingValue();
          const totalChunks = this.chunkState.chunkCounter + 1;
          this._addChunkChainingValue(chunkCv, totalChunks);
          this.chunkState = new ChunkState(this.keyWords, totalChunks, this.flags);
        }
        const want = CHUNK_LEN - this.chunkState.len();
        const take = Math.min(want, input.length - i);
        this.chunkState.update(input, i, i + take);
        i += take;
      }
      return this;
    }

    /** @param {number} length output bytes (default 32) */
    finalize(length = OUT_LEN) {
      let output = this.chunkState.output();
      // Fold the stack right-to-left; the last fold becomes the root.
      for (let i = this.cvStack.length - 1; i >= 0; i--) {
        output = parentOutput(this.cvStack[i], output.chainingValue(), this.keyWords, this.flags);
      }
      return output.rootOutputBytes(new Uint8Array(length));
    }
  }

  // ── Input coercion ───────────────────────────────────────────────────────────
  function toBytes(data) {
    if (data instanceof Uint8Array) return data;
    if (typeof data === 'string') return new TextEncoder().encode(data);
    if (data instanceof ArrayBuffer) return new Uint8Array(data);
    if (ArrayBuffer.isView(data)) return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
    if (Array.isArray(data)) return Uint8Array.from(data);
    throw new TypeError('blake3: expected Uint8Array, ArrayBuffer, string or number[]');
  }

  // ── Public API ───────────────────────────────────────────────────────────────

  /** Equivalent to Rust `blake3::hash(data)`. @returns {Uint8Array} 32 bytes */
  function blake3(data, length = OUT_LEN) {
    return new Blake3().update(data).finalize(length);
  }

  /** Hex convenience. Equivalent to `hex::encode(blake3::hash(data).as_bytes())`. */
  function blake3Hex(data, length = OUT_LEN) {
    return bytesToHex(blake3(data, length));
  }

  /**
   * Drop-in for the wallet's WASM export `blake3_hash_hex(hex_data)`.
   *
   * NB the semantics: it takes a HEX STRING, decodes it to bytes, hashes those,
   * and returns hex. It does NOT hash the string's characters. Matches the Rust
   * wrapper including its quirk of treating undecodable input as empty
   * (`hex::decode(..).unwrap_or_default()`), so a malformed argument hashes the
   * empty string rather than throwing.
   */
  function blake3_hash_hex(hexData) {
    let bytes;
    try { bytes = hexToBytes(hexData); } catch (_) { bytes = new Uint8Array(0); }
    return bytesToHex(blake3(bytes));
  }

  /** Rust `blake3::keyed_hash(key, data)`. Unused by Midstate; untested here. */
  function keyedHash(key, data, length = OUT_LEN) {
    const k = toBytes(key);
    if (k.length !== KEY_LEN) throw new Error('blake3: key must be exactly 32 bytes');
    const keyWords = wordsFromLeBytes32(k);
    return new Blake3(keyWords, KEYED_HASH).update(data).finalize(length);
  }

  /** Rust `blake3::derive_key(context, key_material)`. Unused by Midstate; untested here. */
  function deriveKey(context, keyMaterial, length = OUT_LEN) {
    const ctxCv = new Blake3(IV, DERIVE_KEY_CONTEXT).update(context).finalize(KEY_LEN);
    return new Blake3(wordsFromLeBytes32(ctxCv), DERIVE_KEY_MATERIAL).update(keyMaterial).finalize(length);
  }

  function wordsFromLeBytes32(bytes) {
    const w = new Uint32Array(8);
    for (let i = 0; i < 8; i++) {
      const o = i * 4;
      w[i] = (bytes[o] | (bytes[o + 1] << 8) | (bytes[o + 2] << 16) | (bytes[o + 3] << 24)) >>> 0;
    }
    return w;
  }

  const HEX = Array.from({ length: 256 }, (_, i) => i.toString(16).padStart(2, '0'));
  function bytesToHex(b) {
    let s = '';
    for (let i = 0; i < b.length; i++) s += HEX[b[i]];
    return s;
  }
  function hexToBytes(h) {
    const s = String(h).replace(/^0x/i, '');
    if (s.length % 2 !== 0 || /[^0-9a-fA-F]/.test(s)) throw new Error('blake3: invalid hex');
    const out = new Uint8Array(s.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(s.substr(i * 2, 2), 16);
    return out;
  }


  // Public surface.
  window.blake3Bytes     = blake3;            // (data[, len]) -> Uint8Array
  window.blake3Hex       = blake3Hex;         // (string|bytes) -> hex  [UTF-8 semantics]
  window.blake3_hash_hex = blake3_hash_hex;   // (hexString)    -> hex  [hex-decode semantics]
  window.Blake3          = Blake3;            // streaming hasher
})();

// ==================== PoW (for /scan and /search) ====================
// The node gates its expensive endpoints on a small proof of work. Both use the
// SAME preimage shape, verified server-side in handlers.rs as:
//
//     blake3(format!("{}:{}:{}:{}", subject, height, timestamp, nonce))
//
// and require the lowercase hex digest to start with the number of hex zeros
// /pow_params asks for. `subject` is the address for /scan and the query for
// /search; /search pins height to 0 since it has no start_height.
//
// Two things this must get exactly right:
//   1. Hash the STRING's UTF-8 bytes (blake3Hex), not a hex decode of it.
//   2. Mine on the SAME height that the request body sends. Mining against one
//      value and submitting another guarantees "Invalid PoW hash".
// The server decides difficulty; we never guess. Kept only as a floor for the
// display and as a fallback if /pow_params is unreachable on an older node.
const POW_FALLBACK_ZEROS = 4;

/** Ask the node what this client owes for its next expensive request. Free. */
async function fetchPowParams() {
    try {
        const r = await fetch('/pow_params');
        if (!r.ok) return null;
        const p = await r.json();
        if (!Number.isFinite(p.zeros)) return null;
        // Guard against a hostile/broken node asking for an absurd solve.
        // 7 hex zeros is ~36 minutes in this implementation.
        if (p.zeros > 6) {
            log(`Node is asking for ${p.zeros} zeros of work — refusing (that is ~${Math.round(Math.pow(16, p.zeros) / 124000 / 60)} min).`, 'e');
            return null;
        }
        // A clock >120s fast/slow makes the server reject on timestamp alone;
        // say so before spending a solve on it.
        if (Number.isFinite(p.server_time)) {
            const skew = Math.abs(p.server_time - Math.floor(Date.now() / 1000));
            if (skew > 120) log(`Warning: your clock is ${skew}s off the node's — proofs may be rejected.`, 'w');
        }
        return p;
    } catch (_) { return null; }
}

/** `onTick` fires on every yield (~4k hashes) to drive a progress bar;
 *  `onProgress` keeps the log's slower cadence. */
async function solvePow(subject, height, zeros = POW_FALLBACK_ZEROS, onProgress, onTick) {
    const timestamp = Math.floor(Date.now() / 1000);  // server allows -600s/+120s
    const prefix = '0'.repeat(zeros);
    const started = Date.now();
    let nonce = 0, hash = '';
    for (;;) {
        hash = window.blake3Hex(`${subject}:${height}:${timestamp}:${nonce}`);
        if (hash.startsWith(prefix)) break;
        nonce++;
        // ~124k hashes/sec, so 4 zeros averages ~0.5s. Yield often enough that
        // the tab stays responsive, and report progress so a slow solve doesn't
        // look like a hang.
        if (nonce % 4096 === 0) {
            if (onTick) onTick(nonce, zeros);
            if (onProgress && nonce % 262144 === 0) onProgress(nonce, (Date.now() - started) / 1000);
            await new Promise(r => setTimeout(r, 0));
        }
    }
    return { nonce, timestamp, hash };
}

/** Fill whichever progress bar the current view shows. The expected work is
 *  16^zeros hashes; past that the bar parks near full rather than lie. */
function powTick(nonce, zeros) {
    const el = $('pow-fill');
    if (el) el.style.width = Math.min(96, nonce / Math.pow(16, zeros) * 100).toFixed(1) + '%';
}

/** POST /search with the proof the server currently demands.
 *
 *  The difficulty is re-derived server-side at verification, so a quote can go
 *  stale if another request from this IP lands mid-solve. That costs one retry,
 *  never correctness — so quote, mine, submit, and on "difficulty too low"
 *  re-quote once. There is deliberately no local escalation policy: the server
 *  owns the price.
 */
async function searchWithPow(query) {
    const submit = async (zeros) => {
        const pow = await solvePow(query, 0, zeros,
            (n, s) => log(`  ...solving search PoW (${zeros} zeros): ${n.toLocaleString()} hashes, ${s.toFixed(0)}s`, 'i'), powTick);
        return fetch('/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, pow })
        });
    };

    const params = await fetchPowParams();
    let res = await submit(params ? params.zeros : POW_FALLBACK_ZEROS);
    if (res.ok) return res;

    // Outbid mid-solve, or we were working from a stale/absent quote.
    const body = await res.clone().text().catch(() => '');
    if (/difficulty too low/i.test(body)) {
        const again = await fetchPowParams();
        if (again) {
            log(`Difficulty rose to ${again.zeros} zeros — re-solving.`, 'w');
            res = await submit(again.zeros);
        }
    }
    return res;
}

/** POST /scan for the coins an address received in [from, to). Same proof
 *  scheme, mined on `from` — the start_height the request carries. */
async function scanRange(addr, from, to) {
    const submit = async (zeros) => {
        const pow = await solvePow(addr, from, zeros,
            (n, s) => log(`  ...solving scan PoW: ${n.toLocaleString()} hashes, ${s.toFixed(0)}s`, 'i'), powTick);
        return fetch('/scan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ addresses: [addr], start_height: from, end_height: to, pow })
        });
    };
    const params = await fetchPowParams();
    let res = await submit(params ? params.zeros : POW_FALLBACK_ZEROS);
    if (!res.ok) {
        const body = await res.clone().text().catch(() => '');
        if (/difficulty too low/i.test(body)) {
            const again = await fetchPowParams();
            if (again) res = await submit(again.zeros);
        }
    }
    if (!res.ok) throw new Error(await errorText(res, 'scan failed'));
    const data = await res.json();
    return data.coins || [];
}

/** Searches cost a proof of work, so remember answers for a minute: going
 *  back to a page re-renders it instantly instead of mining again. */
const searchCache = new Map();
async function cachedSearch(q) {
    const hit = searchCache.get(q);
    if (hit && hit.tip === tipHeight && Date.now() - hit.at < 60000) return hit.results;
    const res = await searchWithPow(q);
    if (!res.ok) throw new Error(await errorText(res, 'search failed'));
    const data = await res.json();
    const results = data.results || [];
    searchCache.set(q, { results, tip: tipHeight, at: Date.now() });
    if (searchCache.size > 50) searchCache.delete(searchCache.keys().next().value);
    return results;
}

async function errorText(res, fallback) {
    const t = await res.text().catch(() => '');
    try { return JSON.parse(t).error || t || fallback; } catch (_) { return t || fallback; }
}

function validateAddressChecksum(addr) {
    if (addr.length !== 72) return { valid: false, reason: 'Not a 72-char address' };

    const addressPart = addr.substring(0, 64).toLowerCase();
    const providedChecksum = addr.substring(64).toLowerCase();

    if (!/^[0-9a-f]{64}$/.test(addressPart)) return { valid: false, reason: 'Invalid hex in address' };

    try {
        // Node: encode_address_with_checksum() = blake3(address_BYTES)[0..4].
        // blake3_hash_hex decodes the hex before hashing, which is exactly that.
        // (Passing the hex STRING to a UTF-8 hasher would hash 64 characters
        // instead of 32 bytes — the old bug here.)
        const hash = window.blake3_hash_hex(addressPart);

        const expectedChecksum = hash.substring(0, 8).toLowerCase();

        if (expectedChecksum === providedChecksum) {
            return { valid: true, canonical: addressPart };
        } else {
            return { 
                valid: false, 
                reason: `Checksum mismatch (expected ${expectedChecksum})` 
            };
        }
    } catch (e) {
        return { valid: false, reason: 'Invalid hex in address' };
    }
}

// ── Formatting ──────────────────────────────────────────────────────────

function toHex(v) {
    if (!v) return '';
    if (typeof v === 'string') return v;
    return Array.from(v).map(b => b.toString(16).padStart(2,'0')).join('');
}

function shortHex(h) {
    h = toHex(h);
    if (h.length <= 16) return h;
    return h.substring(0,8) + '…' + h.substring(h.length-8);
}

function fmtAge(secs) {
    if (secs == null) return '';
    if (secs < 60) return secs + 's';
    if (secs < 3600) return Math.floor(secs / 60) + 'm';
    if (secs < 86400) {
        const m = Math.floor((secs % 3600) / 60);
        return Math.floor(secs / 3600) + 'h' + (m ? ' ' + m + 'm' : '');
    }
    const d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600);
    return d + 'd' + (h && d < 10 ? ' ' + h + 'h' : '');
}

function fmtAgo(ts) { return fmtAge(Math.max(0, nowSecs() - ts)) + ' ago'; }

/** Age of a block we have no timestamp for, from the tip at 60s per block. */
function approxAge(h) {
    const s = recentStats.get(h);
    if (s) return fmtAgo(s.ts);
    const tip = recentStats.get(tipHeight);
    const base = tip ? tip.ts : nowSecs();
    return '~' + fmtAge(Math.max(0, nowSecs() - (base - (tipHeight - h) * 60))) + ' ago';
}

// Amounts in the largest unit that condenses them, exactly as the wallets show
// them (apps/desktop/src/theme.rs compact_units): 1 kMDS = 2^10 MDS, 1 mMDS =
// 2^20, 1 gMDS = 2^30. Every coin is a power of two, so every coin reads as a
// whole face value — 512 mMDS, 4 kMDS — like a banknote.
const UNIT_NAMES = ['MDS', 'kMDS', 'mMDS', 'gMDS'];
const UNIT_MULS = [1, 1024, 1048576, 1073741824];
function unitParts(v) {
    v = Number(v) || 0;
    for (let i = 3; i >= 1; i--) {
        if (v >= UNIT_MULS[i]) {
            const x = Math.round(v / UNIT_MULS[i] * 1e4) / 1e4;
            return [x.toLocaleString('en', { maximumFractionDigits: 4 }), UNIT_NAMES[i]];
        }
    }
    return [v.toLocaleString('en'), 'MDS'];
}
function fmtAmtText(v) { const [n, u] = unitParts(v); return `${n} ${u}`; }
function fmtAmt(v) {
    const [n, u] = unitParts(v);
    return `<span class="amt" title="${Number(v || 0).toLocaleString('en')} MDS"><b>${n}</b><i>${u}</i></span>`;
}

function escHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function copyToClipboard(text, btnEl) {
    if (!text) return;
    const done = () => {
        if (!btnEl || btnEl.dataset.copied) return;
        const orig = btnEl.innerHTML;
        btnEl.dataset.copied = '1';
        btnEl.innerHTML = btnEl.classList.contains('icon-btn') ? ic('check') : '✓ Copied';
        setTimeout(() => { btnEl.innerHTML = orig; delete btnEl.dataset.copied; }, 1200);
    };
    const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (_) {}
        document.body.removeChild(ta);
        done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
    else fallback();
}

// ── Chain math: the hashes people look things up by ────────────────────
// A batch carries preimages, not the ids users have in hand. Recomputed here
// exactly as src/core/types.rs does:
//
//   address    = BLAKE3(script bytecode)                  (every address is P2SH)
//   coin id    = BLAKE3(address ‖ value u64 LE ‖ salt)
//   state coin = BLAKE3("CONFIDENTIAL" ‖ address ‖ commitment ‖ salt)
//   burn hash  = BLAKE3("DATABURN" ‖ value u64 LE ‖ payload)
//   commitment = BLAKE3(NETWORK_MAGIC ‖ n u32 LE ‖ input ids ‖ m u32 LE ‖ output hashes ‖ salt)
//
// The commitment is what phase 1 seals, so it doubles as the transaction id:
// it links a reveal to its commit, and the mempool reports reveals by it.
const TXT = new TextEncoder();
const TAG_CONFIDENTIAL = TXT.encode('CONFIDENTIAL');
const TAG_DATABURN = TXT.encode('DATABURN');
const NETWORK_MAGIC = TXT.encode('MIDSTATE_MAINNET_V1');

function bytesOf(v) {
    if (v instanceof Uint8Array) return v;
    if (Array.isArray(v)) return Uint8Array.from(v);
    if (typeof v === 'string' && v.length % 2 === 0 && /^[0-9a-fA-F]*$/.test(v)) {
        const o = new Uint8Array(v.length / 2);
        for (let i = 0; i < o.length; i++) o[i] = parseInt(v.substr(i * 2, 2), 16);
        return o;
    }
    return new Uint8Array(0);
}
function hexOf(u8) {
    let s = '';
    for (let i = 0; i < u8.length; i++) s += (u8[i] < 16 ? '0' : '') + u8[i].toString(16);
    return s;
}
function concatBytes(parts) {
    let n = 0;
    for (const p of parts) n += p.length;
    const o = new Uint8Array(n);
    let off = 0;
    for (const p of parts) { o.set(p, off); off += p.length; }
    return o;
}
function u64le(v) {
    const b = new Uint8Array(8);
    let lo = v % 4294967296, hi = Math.floor(v / 4294967296);
    for (let i = 0; i < 4; i++) {
        b[i] = lo & 255; lo = Math.floor(lo / 256);
        b[4 + i] = hi & 255; hi = Math.floor(hi / 256);
    }
    return b;
}
function u32le(v) { return Uint8Array.of(v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255); }
const b3 = d => window.blake3Bytes(d);
const coinIdOf = (addr, value, salt) => b3(concatBytes([addr, u64le(value), salt]));
const stateCoinIdOf = (addr, commitment, salt) => b3(concatBytes([TAG_CONFIDENTIAL, addr, commitment, salt]));
const burnHashOf = (value, payload) => b3(concatBytes([TAG_DATABURN, u64le(value), payload]));
function commitmentOf(inIds, outHashes, salt) {
    return b3(concatBytes([NETWORK_MAGIC, u32le(inIds.length), ...inIds, u32le(outHashes.length), ...outHashes, salt]));
}

/** The 72-character form wallets show: address ‖ BLAKE3(address)[0..4]. */
const checksumCache = new Map();
function checksummed(addrHex) {
    if (!addrHex || addrHex.length !== 64) return addrHex || '';
    let c = checksumCache.get(addrHex);
    if (!c) { c = addrHex + window.blake3_hash_hex(addrHex).slice(0, 8); checksumCache.set(addrHex, c); }
    return c;
}

/** Standard pay-to-public-key: PUSH_DATA(32) <key> CHECKSIGVERIFY PUSH_DATA(1) 1. */
function isP2pk(bc) { return bc.length === 40 && bc[0] === 0x01 && bc[1] === 32 && bc[2] === 0 && bc[35] === 0x32; }

/** Printable text, if every byte before the zero padding is printable ASCII. */
function readableText(u8) {
    let end = u8.length;
    while (end > 0 && u8[end - 1] === 0) end--;
    if (end < 4) return null;
    for (let i = 0; i < end; i++) if (u8[i] < 32 || u8[i] > 126) return null;
    return String.fromCharCode.apply(null, Array.from(u8.subarray(0, end)));
}

const safeHex = s => (typeof s === 'string' && /^[0-9a-fA-F]+$/.test(s)) ? s.toLowerCase() : '';

// ── One shape for every transaction, wherever it came from ─────────────
//   ins:  { kind: 'coin'|'state', addr, value, coinId, salt, bytecode, std, stateCommitment }
//         { kind: 'src', src: 'new'|'fees', value }        (a block reward's sources)
//   outs: { kind: 'coin'|'state'|'burn', addr, value, coinId, salt, payload, stateCommitment }

function normInput(inp) {
    const bc = bytesOf(inp.predicate && inp.predicate.Script ? inp.predicate.Script.bytecode : []);
    const addr = b3(bc), salt = bytesOf(inp.salt);
    // Spending a state thread names its data commitment, which replaces the
    // value in the coin id (types.rs InputReveal::coin_id).
    const sc = inp.commitment ? bytesOf(inp.commitment) : null;
    const id = sc ? stateCoinIdOf(addr, sc, salt) : coinIdOf(addr, inp.value, salt);
    return {
        kind: sc ? 'state' : 'coin', addr: hexOf(addr), value: inp.value, coinId: hexOf(id), idBytes: id,
        salt: hexOf(salt), bytecode: hexOf(bc), std: isP2pk(bc), stateCommitment: sc ? hexOf(sc) : null,
    };
}

function normOutput(o) {
    if (o.Standard) {
        const a = bytesOf(o.Standard.address), s = bytesOf(o.Standard.salt), id = coinIdOf(a, o.Standard.value, s);
        return { kind: 'coin', addr: hexOf(a), value: o.Standard.value, coinId: hexOf(id), hash: id, salt: hexOf(s) };
    }
    if (o.Confidential) {
        // Despite the name, a zero-value state thread: data, not money (see
        // Transaction::fee in types.rs).
        const a = bytesOf(o.Confidential.address), c = bytesOf(o.Confidential.commitment), s = bytesOf(o.Confidential.salt);
        const id = stateCoinIdOf(a, c, s);
        return { kind: 'state', addr: hexOf(a), value: 0, coinId: hexOf(id), hash: id, salt: hexOf(s), stateCommitment: hexOf(c) };
    }
    const burn = o.DataBurn || { payload: [], value_burned: 0 };
    const p = bytesOf(burn.payload), v = burn.value_burned || 0;
    return { kind: 'burn', value: v, payload: hexOf(p), payloadLen: p.length, hash: burnHashOf(v, p) };
}

/** Equal power-of-two coins in, the same coins out, at most one 1-MDS fee
 *  coin: a uniform-denomination mix. */
function isUniformMix(ins, outs) {
    if (ins.length < 3 || outs.length < 2) return false;
    if (!outs.every(o => o.kind === 'coin')) return false;
    const d = outs[0].value;
    if (!d || !Number.isInteger(Math.log2(d)) || !outs.every(o => o.value === d)) return false;
    const mixIns = ins.filter(i => i.value === d).length;
    const feeIns = ins.filter(i => i.value === 1).length;
    return mixIns === outs.length && feeIns <= 1 && mixIns + feeIns === ins.length;
}

function normBlockTx(tx, height, index) {
    if (tx.Commit) return { kind: 'commit', commitment: toHex(tx.Commit.commitment), nonce: tx.Commit.spam_nonce, height, index };
    const d = tx.Reveal || tx.Consolidate;
    const ins = (d.inputs || []).map(normInput);
    const outs = (d.outputs || []).map(normOutput);
    const totalIn = sum(ins.map(i => i.value)), totalOut = sum(outs.map(o => o.value));
    return {
        kind: tx.Consolidate ? 'consolidate' : 'reveal', ins, outs, totalIn, totalOut,
        fee: Math.max(0, totalIn - totalOut),
        commitment: hexOf(commitmentOf(ins.map(i => i.idBytes), outs.map(o => o.hash), bytesOf(d.salt))),
        salt: toHex(d.salt), mix: !tx.Consolidate && isUniformMix(ins, outs), height, index,
    };
}

/** The block reward as a transaction: new coins (and the block's fees) flow
 *  in from nowhere, the miner's coins flow out. */
function normCoinbase(b, h, fees) {
    const outs = (b.coinbase || []).map(c => {
        const a = bytesOf(c.address), s = bytesOf(c.salt), id = coinIdOf(a, c.value, s);
        return { kind: 'coin', addr: hexOf(a), value: c.value, coinId: hexOf(id), salt: hexOf(s), text: [readableText(a), readableText(s)] };
    });
    const totalOut = sum(outs.map(o => o.value));
    const f = Math.min(fees || 0, totalOut);
    const ins = [{ kind: 'src', src: 'new', value: totalOut - f }];
    if (f > 0) ins.push({ kind: 'src', src: 'fees', value: f });
    // The genesis inscription is plaintext spread across its outputs' address
    // and salt fields; read it back when every piece is printable.
    const pieces = outs.flatMap(o => o.text);
    const inscription = outs.length && pieces.every(Boolean) ? pieces.join('') : null;
    return { kind: 'coinbase', ins, outs, totalIn: totalOut, totalOut, fee: 0, height: h, index: 'cb', inscription };
}

/** Normalise a whole batch once; the result rides along on the cached batch. */
function normBlock(b, h) {
    if (b.__n) return b.__n;
    const all = (b.transactions || []).map((tx, i) => normBlockTx(tx, h, i));
    const transfers = all.filter(t => t.kind !== 'commit');
    const commits = all.filter(t => t.kind === 'commit');
    const fees = sum(transfers.map(t => t.fee));
    const n = {
        all, transfers, commits, fees, cb: normCoinbase(b, h, fees),
        sealedHere: new Set(commits.map(c => c.commitment)),
        byCommitment: new Map(transfers.map(t => [t.commitment, t])),
    };
    Object.defineProperty(b, '__n', { value: n, enumerable: false });
    return n;
}

function normMempoolTx(t) {
    if (t.tx_type === 'commit' || (t.commitment && !t.input_coins && !t.inputs)) {
        return { kind: 'commit', commitment: safeHex(t.commitment), pow: t.pow_zeros, age: t.age_secs, pending: true };
    }
    const ins = Array.isArray(t.inputs)
        ? t.inputs.map(i => ({ kind: i.commitment ? 'state' : 'coin', addr: safeHex(i.address) || null, value: i.value, coinId: safeHex(i.coin_id) }))
        : (t.input_coins || []).map(id => ({ kind: 'coin', addr: null, value: null, coinId: safeHex(id) }));
    const outs = Array.isArray(t.outputs)
        ? t.outputs.map(o => o.kind === 'data_burn'
            ? { kind: 'burn', value: o.value || 0, payload: safeHex(o.payload_preview), payloadLen: o.payload_len || 0 }
            : o.kind === 'confidential'
                ? { kind: 'state', addr: safeHex(o.address) || null, value: 0, coinId: safeHex(o.coin_id) }
                : { kind: 'coin', addr: safeHex(o.address) || null, value: o.value, coinId: safeHex(o.coin_id) })
        : (t.output_coins || []).map(id => ({ kind: 'coin', addr: null, value: null, coinId: safeHex(id) }));
    const totalIn = t.total_in ?? sum(ins.map(i => i.value));
    const totalOut = t.total_out ?? sum(outs.map(o => o.value));
    return {
        kind: t.tx_type === 'consolidate' ? 'consolidate' : 'reveal', ins, outs, totalIn, totalOut,
        fee: t.fee ?? Math.max(0, totalIn - totalOut), commitment: safeHex(t.commitment),
        mix: Array.isArray(t.inputs) && t.tx_type !== 'consolidate' && isUniformMix(ins, outs),
        pending: true, age: t.age_secs, size: t.size_bytes, rate: t.fee_per_kb,
    };
}

/** Does a hash touch this transaction: one of its coins, owners, or its id? */
function txTouches(t, q) {
    if (!q || !t || !t.ins) return false;
    if (t.commitment === q) return true;
    return t.ins.some(i => i.coinId === q || i.addr === q) || t.outs.some(o => o.coinId === q || o.addr === q);
}

// ── Owners: an identicon per address ────────────────────────────────────
// Addresses are 64 hex characters nobody compares by eye. A 5×5 mirrored
// pattern in the address's own hue lets the eye do it instead: the same
// little picture on both sides of a transaction is the same owner.
const idcCache = new Map();
function identicon(addrHex, size) {
    size = size || 15;
    if (!addrHex || addrHex.length < 64) return `<span class="idc-none" style="width:${size}px;height:${size}px"></span>`;
    const key = addrHex + ':' + size;
    const hit = idcCache.get(key);
    if (hit) return hit;
    const b = bytesOf(addrHex.slice(0, 64));
    const hue = ((b[0] << 8) | b[1]) % 360;
    let cells = '';
    for (let y = 0; y < 5; y++) {
        for (let x = 0; x < 3; x++) {
            if (!(b[2 + y * 3 + x] & 1)) continue;
            cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
            if (x < 2) cells += `<rect x="${4 - x}" y="${y}" width="1" height="1"/>`;
        }
    }
    const svg = `<svg class="idc" width="${size}" height="${size}" viewBox="0 0 5 5" style="--h:${hue}" shape-rendering="crispEdges" aria-hidden="true"><rect class="idc-bg" width="5" height="5"/><g class="idc-fg">${cells}</g></svg>`;
    idcCache.set(key, svg);
    return svg;
}

const batchCache = new Map();
async function getBatch(h) {
    const c = batchCache.get(h);
    if (c && tipHeight - h >= 6) return c;
    const r = await fetch(`/batch/${h}`);
    if (!r.ok) throw new Error(await errorText(r, `block ${h.toLocaleString('en')} not found`));
    const d = await r.json();
    batchCache.delete(h);
    batchCache.set(h, d);
    if (batchCache.size > 300) batchCache.delete(batchCache.keys().next().value);
    return d;
}

async function getState() {
    try {
        const r = await fetch('/state');
        if (r.ok) lastState = await r.json();
    } catch (_) {}
    return lastState;
}

// Timestamps and transaction counts for the sidebar, from /stats/history.
const recentStats = new Map();   // height -> { ts, txc }
async function loadRecentStats() {
    try {
        const r = await fetch('/stats/history');
        if (!r.ok) return;
        const d = await r.json();
        for (const b of d.blocks || []) recentStats.set(b.height, { ts: b.timestamp, txc: b.tx_count });
        renderBatchList();
    } catch (_) {}
}

  0x52: { name: 'OP_READ_OUTPUT_STATE', type: 'covenant' },
  0x53: { name: 'OP_INPUT_VALUE', type: 'covenant' },
  0x54: { name: 'OP_OUTPUT_ADDRESS', type: 'covenant' },
  0x55: { name: 'OP_THIS_ADDRESS', type: 'covenant' },
  0x56: { name: 'OP_SUM_INPUT_VALUE', type: 'covenant' },
  0x57: { name: 'OP_MERKLE_ROOT', type: 'crypto' },
};

function disassembleScript(hexOrBytes) {
  let bytes = [];
  if (typeof hexOrBytes === 'string') {
    const clean = hexOrBytes.replace(/[^0-9a-fA-F]/g, '');
    for (let i = 0; i < clean.length; i += 2) {
      bytes.push(parseInt(clean.substr(i, 2), 16));
    }
  } else if (Array.isArray(hexOrBytes)) {
    bytes = hexOrBytes;
  } else {
    return '<span class="comment">// invalid bytecode</span>';
  }

  if (bytes.length === 0) return '<span class="comment">// empty script</span>';

  let out = '';
  let i = 0;
  let indent = 0;
  let byteOffset = 0;

  /** Interpret pushed bytes as the script VM does: a little-endian integer.
   *  Mirrors OP_ADD / OP_GREATER_OR_EQUAL / OP_CHECKTIMEVERIFY, which all read
   *  stack items this way — so an 8-byte push next to CHECKTIMEVERIFY is a
   *  block height, and showing it as such is the whole point of the annotation.
   *  BigInt because a u64 height exceeds Number's exact range. */
  function pushDataToInt(data) {
    let v = 0n;
    for (let k = data.length - 1; k >= 0; k--) v = (v << 8n) | BigInt(data[k]);
    return v;
  }

  function formatPushData(data) {
    const dataHex = data.map(x => x.toString(16).padStart(2,'0')).join('');
    let annotation = '';

    // Was: hexLEToInt(dataHex) — a function that does not exist anywhere in this
    // file. The surrounding try/catch swallowed the ReferenceError, so this
    // annotation silently never rendered for any script.
    if (data.length > 0 && data.length <= 8) {
      annotation = ` <span class="comment">// ${pushDataToInt(data).toString()}</span>`;
    }

    const ascii = data.every(x => x >= 32 && x <= 126)
      ? ` <span class="comment">"${escHtml(String.fromCharCode(...data))}"</span>`
      : '';

    return `<span class="data">${data.length} 0x${dataHex}</span>${ascii}${annotation}`;
  }

  while (i < bytes.length) {
    const startOffset = byteOffset;
    const b = bytes[i];
    const op = OPCODES[b];

    if (!op) {
      const hex = b.toString(16).padStart(2, '0');
      out += `<span class="ln">[${startOffset.toString().padStart(3,' ')}]</span> <span class="op" style="color:#ffaa66">0x${hex}</span>\n`;
      i++; byteOffset++;
      continue;
    }

    let line = `<span class="ln">[${startOffset.toString().padStart(3,' ')}]</span> ` + '  '.repeat(indent);
    line += `<span class="op ${op.type}">${op.name}</span>`;

    // PUSH_DATA
    if (b === 0x01) {
      i++; byteOffset++;
      // The length is a 2-byte LITTLE-ENDIAN u16, not one byte. The VM does:
      //     let len = u16::from_le_bytes([bytecode[pc], bytecode[pc + 1]]);
      //     pc += 2;
      // Reading a single byte here misaligned every push by exactly one, which
      // then cascaded: the pushed data came out shifted (leading with the
      // length's high byte and dropping the real last byte), the displaced byte
      // surfaced as a bogus unknown opcode, and the parser eventually ran off
      // the end and cried "<truncated>" on a perfectly valid script.
      if (i + 2 > bytes.length) {
        line += ' <span class="comment">&lt;truncated: missing 2-byte length&gt;</span>';
        out += line + '\n'; break;
      }
      const len = bytes[i] | (bytes[i + 1] << 8);
      i += 2; byteOffset += 2;
      // MAX_ITEM_SIZE from the script VM. Flag it rather than trying to render
      // a 4 GB push — the node would reject this script as ItemTooLarge.
      if (len > 131072) {
        line += ` <span class="comment">&lt;invalid: push of ${len} bytes exceeds MAX_ITEM_SIZE (131072)&gt;</span>`;
        out += line + '\n'; break;
      }
      if (i + len > bytes.length) {
        const partial = bytes.slice(i);
        line += ' ' + formatPushData(partial) + ` <span class="comment">&lt;truncated: declared ${len} bytes, ${partial.length} present&gt;</span>`;
        out += line + '\n'; break;
      }
      const data = bytes.slice(i, i + len);
      line += ' ' + formatPushData(data);
      i += len; byteOffset += len;
    } else {
      i++; byteOffset++;
    }

    // === Control Flow ===
    if (b === 0x40) { // IF
      line += ' <span class="comment">// if</span>';
      indent = Math.min(indent + 1, 8);
    } else if (b === 0x41) { // ELSE
      indent = Math.max(indent - 1, 0);
      line = `<span class="ln">[${startOffset.toString().padStart(3,' ')}]</span> ` + '  '.repeat(indent) +
             `<span class="op control">OP_ELSE</span> <span class="comment">// else</span>`;
      indent = Math.min(indent + 1, 8);
    } else if (b === 0x42) { // ENDIF
      // Dedent BEFORE rebuilding the line. The old code decremented after `line`
      // had already been composed with the block's indent, so ENDIF rendered as
      // if it were inside its own block and the dedent leaked onto the next
      // instruction.
      indent = Math.max(indent - 1, 0);
      line = `<span class="ln">[${startOffset.toString().padStart(3,' ')}]</span> ` + '  '.repeat(indent) +
             `<span class="op control">OP_ENDIF</span> <span class="comment">// endif</span>`;
    }

    // === High-level language hints (from your compiler) ===
    if (b === 0x17) line += ' <span class="comment">// local var</span>';
    if (b === 0x21 || b === 0x22) line += ' <span class="comment">// assert/require</span>';

    out += line + '\n';
  }

  return out.trim();
}

function renderScriptDisasm(bytecode) {
  if (!bytecode) return '';
  const disasm = disassembleScript(bytecode);
  const hex = typeof bytecode === 'string' ? bytecode : 
              Array.from(bytecode).map(b => b.toString(16).padStart(2,'0')).join('');
  
  return `
    <div class="script-header">MIDSTATESCRIPT — ${hex.length/2} bytes</div>
    <div class="script-disasm">${disasm}</div>
    <div style="margin-top:4px;">
      <button class="btn" style="font-size:9px; padding:2px 6px;" onclick="copyToClipboard('${hex}', this)">Copy Raw</button>
    </div>
  `;
}

const MDS_PER_GMDS = 1073741824;

function fmtInt(n) { return Number(n).toLocaleString('en'); }

// gMDS with a fixed number of decimals (tables line up).
function fmtG(n, dp = 2) {
    return (Number(n) / MDS_PER_GMDS).toLocaleString('en', { minimumFractionDigits: dp, maximumFractionDigits: dp });
}

// gMDS with only the decimals it needs: 1, 0.5, 0.0001.
function fmtGShort(n) {
    return (Number(n) / MDS_PER_GMDS).toLocaleString('en', { maximumFractionDigits: 6 });
}

function fmtShare(f) {
    const p = f * 100;
    if (p === 0) return '0%';
    if (p < 0.01) return '<0.01%';
    return (p >= 10 ? p.toFixed(1) : p.toFixed(2)) + '%';
}

function fmtDuration(blocks) {
    const days = blocks * 60 / 86400;
    if (days >= 2) return `~${Math.round(days).toLocaleString('en')} days`;
    const hours = blocks / 60;
    return hours >= 2 ? `~${Math.round(hours)} hours` : `~${blocks} min`;
}

let page = 'home';

let lastMempoolData = null;

const coinStatus = new Map();   // coin id -> 'alive' | 'spent'

/** Which of these coins still exist, eight questions at a time. */
async function checkCoins(ids) {
    const todo = [...new Set(ids)].filter(id => id && !coinStatus.has(id));
    for (let i = 0; i < todo.length; i += 8) {
        await Promise.all(todo.slice(i, i + 8).map(async id => {
            try {
                const r = await fetch('/coin/' + id);
                if (r.ok) coinStatus.set(id, (await r.json()).exists ? 'alive' : 'spent');
            } catch (_) {}
        }));
    }
}

function toast(msg) {

const short = (h, n = 6) => !h ? '' : h.length <= n * 2 + 1 ? h : `${h.slice(0, n)}…${h.slice(-n)}`;
const utc = ts => new Date(ts * 1000).toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
const ago = ts => `<span title="${utc(ts)}">${fmtAgo(ts)}</span>`;
const href = {

    tx: (h, i) => `?tx=${h}.${i}`,

function help(text) { return `<span class="help" tabindex="0" data-tip="${escHtml(text)}">?</span>`; }
function copyBtn(text) { return `<button class="copy" onclick="copyToClipboard('${escHtml(text)}', this)" title="Copy" aria-label="Copy">${ic('copy')}</button>`; }
function badge(cls, text, icon) { return `<span class="badge ${cls}">${icon ? ic(icon) : ''}${text}</span>`; }

}
function kv(rows) {

        `<div class="kv-row"><div class="kv-k">${k}${tip ? help(tip) : ''}</div><div class="kv-v">${v}</div></div>`).join('')}</div>`;

function table(cols, rows, empty) {
