// ── Navigation ──────────────────────────────────────────────────────────
// Every page has a URL, so the back button works and any view can be shared:
//   ?q=<height | address | coin id | hash | mempool | richlist>   ?tx=<height>.<index|cb>
function parseLocation() {
    const p = new URLSearchParams(window.location.search);
    if (p.get('tx')) return { tx: p.get('tx') };
    let q = p.get('q') || p.get('query');
    // `/?123` and `/?richlist` work too.
    if (!q && window.location.search.length > 1 && !window.location.search.includes('=')) q = window.location.search.substring(1);
    if (q) return { q: decodeURIComponent(q).replace(/\/$/, '') };
    return {};
}

function urlFor(s) {
    if (s.tx) return '?tx=' + s.tx;
    if (s.q) return /^(mempool|richlist|analytics)$/.test(s.q) ? '?' + s.q : '?q=' + encodeURIComponent(s.q);
    return window.location.pathname;
}

function navigate(s) {
    const url = urlFor(s);
    if (url === window.location.search || (url === window.location.pathname && !window.location.search)) history.replaceState(s, '', url);
    else history.pushState(s, '', url);
    route(s);
}
function go(q) { q = String(q).trim(); if (/^[0-9][0-9,]*$/.test(q)) q = q.replace(/,/g, ''); navigate({ q }); }
function openTx(h, i, focus) { navigate(focus ? { tx: `${h}.${i}`, f: focus } : { tx: `${h}.${i}` }); }
function goHome() { navigate({}); }
window.addEventListener('popstate', e => route(e.state || parseLocation()));

async function route(s) {
    s = s || {};
    const seq = ++routeSeq;
    currentFocus = s.f || null;
    activeQuery = null;
    if (s.tx) {
        activeQuery = s.f || null;
        const [hs, is] = String(s.tx).split('.');
        return loadTx(parseInt(String(hs).replace(/,/g, ''), 10), is === 'cb' ? 'cb' : parseInt(is, 10), seq);
    }
    if (s.q) return execQuery(s.q, seq);
    if (!lastState) return showMessage('alert', 'node not reachable', seq);
    return loadBlock(tipHeight, seq);
}

async function execQuery(cmd, seq) {
    cmd = String(cmd).trim();
    const lc = cmd.toLowerCase();
    if (lc === 'mempool') return showTab('mempool');
    if (/^(supply|rich ?list|holders)$/.test(lc)) return showTab('supply');
    if (lc === 'analytics' || lc === 'charts') return showTab('analytics');
    if (/^[0-9][0-9,]*$/.test(cmd)) return loadBlock(parseInt(cmd.replace(/,/g, ''), 10), seq);
    if (/^[0-9a-f]{72}$/.test(lc)) return loadAddress(lc, seq);
    if (/^[0-9a-f]{64}$/.test(lc)) return resolveHash(lc, seq);
    if (lc.startsWith('decompile ')) {
        const hex = cmd.split(/\s+/)[1] || '';
        if (hex.length > 10) {
            mainViewContent = 'decompile';
            mainView().innerHTML = `<div class="block-hdr"><h2>SCRIPT DECOMPILE</h2></div>${renderScriptDisasm(hex)}`;
            return;
        }
    }
    showMessage('search', 'a block number, an address or a coin id', seq);
}

function execCmd(cmd) {
    cmd = String(cmd || '').trim();
    $('cmd-input').value = '';
    if (!cmd) return;
    log(`> ${cmd}`, 'var(--text-max)');
    go(cmd);
}

function handleTopSearch() {
    const input = $('top-search');
    const val = input.value.trim();
    if (!val) return;
    input.value = '';
    input.blur();
    execCmd(val);
}

// Update currentTab + the tab bar WITHOUT rendering. A view claims its tab, so
// the next poll can't think we're on 'mempool' and repaint it over the view.
function setActiveTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-link').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
}

function switchTab(tab) {
    if (tab === 'explorer') { if (activeBatch != null) go(String(activeBatch)); else goHome(); return; }
    navigate({ q: tab === 'supply' ? 'richlist' : tab });
}

function showTab(tab) {
    setActiveTab(tab);
    activeBatch = null;
    renderBatchList();
    if (tab === 'mempool') { mainViewContent = 'mempool-entering'; renderMempoolView(); }
    else if (tab === 'analytics') renderAnalyticsView();
    else if (tab === 'supply') showSupplyView();
}

/** A 64-hex query could be a coin, an address, a commitment or a block hash.
 *  One proof-of-work search says which, and we open the page that fits. */
async function resolveHash(q, seq) {
    activeQuery = q;
    setActiveTab('explorer');
    mainViewContent = 'search';
    activeBatch = null;
    renderBatchList();
    mainView().innerHTML = loadingHtml(true);
    log(`Searching for ${shortHex(q)}…`);
    const mp = findInMempool(q);
    let results;
    try { results = await cachedSearch(q); }
    catch (e) {
        if (seq !== routeSeq) return;
        if (mp) return showMempoolHit(mp);
        log(`Search error: ${e.message}`, 'e');
        return showMessage('alert', e.message, seq);
    }
    if (seq !== routeSeq) return;
    const has = (...types) => results.some(r => types.includes(r.result_type));
    if (has('output_coin_id', 'coinbase_coin_id', 'input_coin_id')) return showCoin(q, results, seq);
    if (has('output_address', 'coinbase_address', 'input_address')) return loadAddress(q, seq, results);
    const first = results[0];
    if (first) {
        log(`Found ${results.length} result(s)`, 's');
        if (first.tx_index != null && first.result_type !== 'block_hash') return loadTx(first.height, first.tx_index, seq);
        return loadBlock(first.height, seq);
    }
    if (mp) return showMempoolHit(mp);
    // A coin whose birth is older than the search window still exists.
    try {
        const r = await fetch('/coin/' + q);
        if (r.ok && (await r.json()).exists) return showCoin(q, [], seq);
    } catch (_) {}
    showMessage('search', 'nothing found', seq, 'searched the last 5,000 blocks and the mempool');
}

function showMempoolHit(mp) {
    log(`In mempool: ${mp.desc}`, 's');
    if (mp.id) mpExpanded.add(mp.id);
    mpScrollPending = true;
    history.replaceState({ q: 'mempool' }, '', '?mempool');
    showTab('mempool');
}

// ── Block view ──────────────────────────────────────────────────────────
function finalityHtml(h, st) {
    if (!st) return '';
    const conf = Math.max(0, st.height - h), need = st.safe_depth;
    // safe_depth == u64::MAX (SAFE_DEPTH_UNATTAINABLE): the node cannot reach
    // its finality target at any depth. Never call anything final then.
    if (!(need < Number.MAX_SAFE_INTEGER)) {
        return `<span class="fin-m warn" title="Finality is unattainable at the node's confidence; ${conf} confirmations">${ic('alert')}${conf.toLocaleString('en')}</span>`;
    }
    if (conf >= need) return `<span class="fin-m ok" title="${conf.toLocaleString('en')} confirmations">${ic('check')}final</span>`;
    const meter = need <= 24
        ? `<span class="fin-boxes">${Array.from({ length: need }, (_, i) => `<i${i < conf ? ' class="on"' : ''}></i>`).join('')}</span>`
        : `<span class="fin-bar"><i style="width:${(conf / need * 100).toFixed(0)}%"></i></span>`;
    return `<span class="fin-m" title="${conf} of ${need} confirmations">${meter}${conf}/${need}</span>`;
}

function blockHeadHtml(h, b, st, n, created, spent) {
    const when = new Date(b.timestamp * 1000).toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
    const prev = h > 0
        ? `<a class="bh-arrow" onclick="go('${h - 1}')" title="Block ${fmtInt(h - 1)}">${ic('left')}</a>`
        : `<span class="bh-arrow off">${ic('left')}</span>`;
    const next = h < tipHeight
        ? `<a class="bh-arrow" onclick="go('${h + 1}')" title="Block ${fmtInt(h + 1)}">${ic('right')}</a>`
        : `<span class="bh-arrow off">${ic('right')}</span>`;
    return `<div class="bh">${prev}
        <div class="bh-mid">
            <div class="bh-title">${ic('cube')}<span class="bh-word">BLOCK</span><span class="bh-num">${fmtInt(h)}</span></div>
            <div class="bh-sub"><span title="${when}">${ic('clock')}${fmtAgo(b.timestamp)}</span>${finalityHtml(h, st)}</div>
        </div>${next}</div>
        <div class="bstats">
            <div class="bstat" title="Transfers">${ic('transfer')}<b>${fmtInt(n.transfers.length)}</b></div>
            <div class="bstat" title="Coins created"><i class="dot alive"></i><b>${created ? '+' : ''}${fmtInt(created)}</b></div>
            <div class="bstat" title="Coins spent"><i class="dot used"></i><b>${spent ? '−' : ''}${fmtInt(spent)}</b></div>
            <div class="bstat sealed" title="Sealed (phase 1 of commit / reveal)">${ic('lock')}<b>${fmtInt(n.commits.length)}</b></div>
            <div class="bstat reward" title="Paid to the miner: new coins plus fees">${ic('pick')}${fmtAmt(n.cb.totalOut)}</div>
        </div>`;
}

function sealsHtml(n, h) {
    const chips = n.commits.map(c => {
        const pair = n.byCommitment.get(c.commitment);
        const q = activeQuery === c.commitment ? ' is-q' : '';
        return pair
            ? `<a class="seal${q}" onclick="focusTx('${h}:${pair.index}')" title="Sealed here, and revealed in this block too">${ic('lock')}<span>${c.commitment.slice(0, 8)}</span>${ic('link')}</a>`
            : `<a class="seal${q}" onclick="openTx(${h}, '${c.index}')" title="Sealed here; it opens in a later block">${ic('lock')}<span>${c.commitment.slice(0, 8)}</span></a>`;
    }).join('');
    return `<div class="sec-title">${ic('lock')}sealed <span>${n.commits.length}</span></div><div class="seal-grid">${chips}</div>`;
}

function blockDetailsHtml(h, b) {
    const hash = toHex(b.extension.final_hash);
    return `<details class="bdetails"><summary>${ic('hash')}block internals</summary>
        <div class="meta-grid">
            ${fieldHtml('Block Hash', hash, `go('${hash}')`)}
            ${fieldHtml('Parent midstate', toHex(b.prev_midstate), h > 0 ? `go('${h - 1}')` : '')}
            ${fieldHtml('State Root', toHex(b.state_root), `go('${toHex(b.state_root)}')`)}
            ${fieldHtml('Target', toHex(b.target))}
            ${fieldHtml('Timestamp', new Date(b.timestamp * 1000).toISOString())}
            ${fieldHtml('Nonce', String(b.extension.nonce))}
        </div>
        <div class="block-toolbar">
            <button class="btn" onclick="showRawBlock(${h}, this)">Raw JSON</button>
            <button class="btn" onclick="copyToClipboard('${hash}', this)">Copy Block Hash</button>
        </div>
    </details>`;
}

async function loadBlock(h, seq, opts) {
    seq = seq || ++routeSeq;
    opts = opts || {};
    if (!Number.isFinite(h) || h < 0) return showMessage('alert', 'not a block number', seq);
    setActiveTab('explorer');
    mainViewContent = 'block';
    activeBatch = h;
    activeAddress = null;
    renderBatchList();
    const mv = mainView();
    mv.innerHTML = loadingHtml();

    let b, st;
    try { [b, st] = await Promise.all([getBatch(h), getState()]); }
    catch (e) { showMessage('alert', e.message, seq); return; }
    if (seq !== routeSeq) return;

    blockCache[h] = { txCount: b.transactions.length, cbCount: b.coinbase.length };
    const n = normBlock(b, h);
    const created = n.cb.outs.length + sum(n.transfers.map(t => t.outs.filter(o => o.kind !== 'burn').length));
    const spent = sum(n.transfers.map(t => t.ins.length));

    txReg.clear();
    let html = blockHeadHtml(h, b, st, n, created, spent);
    html += txCardHtml(n.cb, { key: `${h}:cb`, open: true });
    // Open every card in an ordinary block; in a busy one, only those that
    // touch what was searched for.
    const openAll = n.transfers.length <= 8;
    for (const t of n.transfers) {
        html += txCardHtml(t, { key: `${h}:${t.index}`, open: openAll || txTouches(t, activeQuery), sealedHere: n.sealedHere.has(t.commitment) });
    }
    if (n.commits.length) html += sealsHtml(n, h);
    html += blockDetailsHtml(h, b);

    mv.innerHTML = html;
    mv.scrollTop = 0;
    afterRender(mv);
    renderBatchList();
    if (opts.focusKey) focusTx(opts.focusKey);
    else if (activeQuery) {
        const el = mv.querySelector('.coin.focus, .addr.is-q, .seal.is-q');
        if (el) el.scrollIntoView({ block: 'center' });
    }
}

// ── One transaction ─────────────────────────────────────────────────────
async function loadTx(h, idx, seq) {
    setActiveTab('explorer');
    mainViewContent = 'tx';
    activeBatch = h;
    activeAddress = null;
    renderBatchList();
    const mv = mainView();
    mv.innerHTML = loadingHtml();

    let b, st;
    try { [b, st] = await Promise.all([getBatch(h), getState()]); }
    catch (e) { showMessage('alert', e.message, seq); return; }
    if (seq !== routeSeq) return;

    const n = normBlock(b, h);
    const t = idx === 'cb' ? n.cb : n.all[idx];
    if (!t) return showMessage('search', 'no such transaction', seq);

    txReg.clear();
    const what = t.kind === 'commit' ? `${ic('lock')}sealed #${idx}`
        : t.kind === 'coinbase' ? `${ic('pick')}reward`
        : `${ic('transfer')}#${idx}`;
    const when = new Date(b.timestamp * 1000).toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
    let html = `<div class="crumb">
        <a onclick="go('${h}')" title="The whole block">${ic('left')}${ic('cube')}${fmtInt(h)}</a><span class="dim">›</span><span class="crumb-kind">${what}</span>
        <span class="crumb-meta"><span title="${when}">${ic('clock')}${fmtAgo(b.timestamp)}</span>${finalityHtml(h, st)}</span>
    </div>`;
    if (t.kind === 'commit') html += sealCardHtml(t);
    else {
        // Both phases at a glance: where it was sealed, and here, where it opened.
        if (t.commitment) {
            html += `<div class="phases">
                <span class="phase" title="Phase 1: sealed">${ic('lock')}<span id="phase-seal"><span class="dim">…</span></span></span>
                <span class="phase-arrow">${ic('right')}</span>
                <span class="phase here" title="Phase 2: revealed">${ic('unlock')}${ic('cube')}${fmtInt(h)} #${idx}</span>
            </div>`;
        }
        html += txCardHtml(t, { key: `${h}:${idx}`, open: true, all: true, standalone: true, focus: currentFocus, sealedHere: n.sealedHere.has(t.commitment) });
    }

    mv.innerHTML = html;
    mv.scrollTop = 0;
    afterRender(mv);
    if (t.kind === 'commit') findRevealFor(t, h, seq);
    else if (t.commitment) findSealFor(t, h, seq);
    else if (currentFocus) { const el = mv.querySelector('.coin.focus'); if (el) el.scrollIntoView({ block: 'center' }); }
}

function sealCardHtml(t) {
    return `<div class="seal-card">
        <div class="seal-big">${ic('lock')}</div>
        <div class="seal-main">
            <div class="ah-label">${ic('lock')}SEALED</div>
            <div class="hx">${t.commitment}</div>
            <div class="seal-next" id="seal-next">${ic('search')}<span class="dim">…</span></div>
        </div>
    </div>`;
}

/** Where a commitment was opened: the same block, the mempool, or one of the
 *  next blocks (walked forward client-side; the search index has no entry for
 *  a reveal's computed commitment). */
async function findRevealFor(t, h, seq) {
    const show = html => { const el = $('seal-next'); if (seq === routeSeq && el) el.innerHTML = html; };
    const inMempool = (lastMempoolData && lastMempoolData.transactions || [])
        .some(x => x.tx_type !== 'commit' && x.commitment === t.commitment);
    const limit = Math.min(tipHeight, h + 60);
    for (let hh = h; hh <= limit; hh++) {
        if (seq !== routeSeq) return;
        let b;
        try { b = await getBatch(hh); } catch (_) { break; }
        const r = normBlock(b, hh).byCommitment.get(t.commitment);
        if (r) {
            return show(`${ic('unlock')}<a onclick="openTx(${hh}, '${r.index}')" title="${hh === h ? 'Revealed in the same block' : 'Revealed ' + (hh - h) + ' block(s) later'}">${ic('cube')}${fmtInt(hh)} #${r.index}</a>`);
        }
        if (hh === h && inMempool) return show(`${ic('unlock')}<a onclick="switchTab('mempool')">${ic('hourglass')}mempool</a>`);
        show(`${ic('search')}<span class="dim">${fmtInt(hh)}…</span>`);
    }
    if (inMempool) return show(`${ic('unlock')}<a onclick="switchTab('mempool')">${ic('hourglass')}mempool</a>`);
    show(`${ic('hourglass')}<span class="dim">not revealed by ${fmtInt(limit)}</span>`);
}

/** Where a reveal was sealed: commits usually land a block or two before
 *  their reveal (or in the same block), so walk back a little; past that,
 *  offer the proof-of-work search, which reaches 5,000 blocks. */
async function findSealFor(t, h, seq) {
    const show = html => { const el = $('phase-seal'); if (seq === routeSeq && el) el.innerHTML = html; };
    for (let hh = h; hh >= Math.max(0, h - 20); hh--) {
        if (seq !== routeSeq) return;
        let b;
        try { b = await getBatch(hh); } catch (_) { break; }
        const c = normBlock(b, hh).commits.find(x => x.commitment === t.commitment);
        if (c) return show(`<a onclick="openTx(${hh}, '${c.index}')" title="${hh === h ? 'Sealed in the same block' : 'Sealed ' + (h - hh) + ' block(s) earlier'}">${ic('cube')}${fmtInt(hh)} #${c.index}</a>`);
    }
    show(`<a onclick="go('${t.commitment}')" title="Search further back">${ic('search')}${shortHex(t.commitment)}</a>`);
}

// ── One coin's life ─────────────────────────────────────────────────────
// The whole UTXO model in one picture: a coin is created by one transaction
// and destroyed by another. Both ends are links; both transactions follow.
async function showCoin(q, results, seq) {
    setActiveTab('explorer');
    mainViewContent = 'coin';
    activeBatch = null;
    activeQuery = q;
    currentFocus = q;
    renderBatchList();
    const born = results.find(r => r.result_type === 'output_coin_id' || r.result_type === 'coinbase_coin_id');
    const died = results.find(r => r.result_type === 'input_coin_id');

    let alive = null, bb = null, db = null;
    try {
        [alive, bb, db] = await Promise.all([
            fetch('/coin/' + q).then(r => r.ok ? r.json() : null).then(d => d ? d.exists : null).catch(() => null),
            born ? getBatch(born.height) : null,
            died ? getBatch(died.height) : null,
        ]);
    } catch (e) { showMessage('alert', e.message, seq); return; }
    if (seq !== routeSeq) return;
    if (alive != null) coinStatus.set(q, alive ? 'alive' : 'spent');

    let bornT = null, diedT = null, coin = null;
    if (bb) {
        const n = normBlock(bb, born.height);
        bornT = born.result_type === 'coinbase_coin_id' ? n.cb : (n.all[born.tx_index] || null);
        coin = bornT ? bornT.outs.find(o => o.coinId === q) || null : null;
    }
    if (db) {
        diedT = normBlock(db, died.height).all[died.tx_index] || null;
        if (!coin && diedT) coin = diedT.ins.find(i => i.coinId === q) || null;
    }
    const value = coin ? coin.value : parseInt((/value (\d+)/.exec((born || died || {}).detail || '') || [])[1], 10);
    const spending = !died && pendingSpendOf(q);

    const bornEnd = born
        ? `<span class="life-tag born">${ic(born.result_type === 'coinbase_coin_id' ? 'pick' : 'spark')}created</span>
           <a onclick="openTx(${born.height}, '${born.tx_index == null ? 'cb' : born.tx_index}', '${q}')">${ic('cube')}${fmtInt(born.height)}</a>
           <span class="dim">${bb ? fmtAgo(bb.timestamp) : ''}</span>`
        : `<span class="life-tag born">${ic('spark')}created</span><span class="dim">over 5,000 blocks ago</span>`;
    let line, deathEnd;
    if (died) {
        line = 'dead';
        deathEnd = `<span class="life-tag died">${ic('x')}spent</span>
           <a onclick="openTx(${died.height}, '${died.tx_index}', '${q}')">${ic('cube')}${fmtInt(died.height)}</a>
           <span class="dim">${db ? fmtAgo(db.timestamp) : ''}</span>`;
    } else if (spending) {
        line = 'pending';
        deathEnd = `<span class="life-tag pending">${ic('hourglass')}being spent</span><a onclick="switchTab('mempool')">mempool</a>`;
    } else if (alive) {
        line = '';
        deathEnd = `<span class="life-tag alive"><i class="dot alive"></i>exists</span><span class="dim">now</span>`;
    } else {
        line = 'dead';
        deathEnd = `<span class="life-tag died">${ic('x')}spent</span><span class="dim">—</span>`;
    }

    const [vn, vu] = Number.isFinite(value) ? unitParts(value) : ['?', ''];
    const st = alive ? 'alive' : 'spent';
    const isState = coin && coin.kind === 'state';
    txReg.clear();
    let html = `<div class="coinh">
        ${isState ? `<span class="coin big state">${ic('diamond')}</span>`
            : `<span class="coin big out st-${st}" title="${Number.isFinite(value) ? value.toLocaleString('en') + ' MDS' : ''}"><i class="dot" style="--d:${Number.isFinite(value) ? (dotSize(value) * 1.7).toFixed(1) : 9}px"></i><b>${vn}</b><small>${vu}</small></span>`}
        ${coin && coin.addr ? addrChip(coin.addr) : ''}
        <span class="hx" title="Coin id ${q}">${ic('hash')} ${shortHex(q)}</span>
        <button class="icon-btn" onclick="copyToClipboard('${q}', this)" title="Copy coin id">${ic('copy')}</button>
    </div>
    <div class="life"><div class="life-end">${bornEnd}</div><div class="life-line ${line}"></div><div class="life-end right">${deathEnd}</div></div>`;
    if (bornT) html += `<div class="sec-title">${ic('spark')}created</div>` + txCardHtml(bornT, { key: 'born', open: true, focus: q, sealedHere: false });
    if (diedT) html += `<div class="sec-title">${ic('x')}spent</div>` + txCardHtml(diedT, { key: 'died', open: true, focus: q, sealedHere: false });
    const mv = mainView();
    mv.innerHTML = html;
    mv.scrollTop = 0;
    afterRender(mv);
    log(`Coin ${shortHex(q)}: ${died ? 'spent' : alive ? 'unspent' : 'unknown'}`, 's');
}

// ── Address view ────────────────────────────────────────────────────────
const addrView = { addr: null, coins: [], from: null, to: null, results: null, indexed: null, scanning: false };

async function loadAddress(input, seq, prefetched) {
    let addr = String(input).toLowerCase();
    if (addr.length === 72) {
        const check = validateAddressChecksum(addr);
        if (!check.valid) return showMessage('alert', check.reason, seq, 'the address may contain a typo');
        addr = check.canonical;
    }
    if (!/^[0-9a-f]{64}$/.test(addr)) return showMessage('alert', 'not an address', seq);

    setActiveTab('explorer');
    mainViewContent = 'address';
    activeAddress = addr;
    activeQuery = addr;
    activeBatch = null;
    renderBatchList();
    Object.assign(addrView, { addr, coins: [], from: null, to: null, results: prefetched || null, indexed: null, scanning: true });
    const mv = mainView();
    mv.innerHTML = addressHtml();
    mv.scrollTop = 0;

    // The rich-list index, when this node keeps one, knows the full-history
    // balance instantly. The scan below covers only the last 5,000 blocks.
    const indexedP = fetch(`/richlist/${addr}`).then(r => r.ok ? r.json() : null).catch(() => null);
    try {
        const results = prefetched || await cachedSearch(addr);
        if (seq !== routeSeq) return;
        addrView.results = results;
        addrView.indexed = await indexedP;
        mv.innerHTML = addressHtml();

        const st = await getState();
        const tip = st ? st.height : tipHeight + 1;
        const from = Math.max(0, tip - 5000);
        // /scan returns every coin the address RECEIVED in the range, spent or
        // not; whether each still exists is a separate question for /coin.
        const coins = await scanRange(addr, from, tip);
        if (seq !== routeSeq) return;
        await checkCoins(coins.map(c => c.coin_id));
        if (seq !== routeSeq) return;
        Object.assign(addrView, { coins, from, to: tip, scanning: false });
        mv.innerHTML = addressHtml();
        log(`Address ${shortHex(addr)}: ${coins.length} coin(s) received in the last 5,000 blocks`, 's');
    } catch (e) {
        if (seq !== routeSeq) return;
        log(`Address load error: ${e.message}`, 'e');
        showMessage('alert', e.message, seq);
    }
}

function addressActivity(s) {
    const m = new Map();
    const entry = (h, i) => {
        const k = `${h}:${i}`;
        if (!m.has(k)) m.set(k, { h, i, inV: 0, outV: 0, cb: false });
        return m.get(k);
    };
    for (const r of s.results || []) {
        if (!['output_address', 'coinbase_address', 'input_address'].includes(r.result_type)) continue;
        const a = entry(r.height, r.tx_index == null ? 'cb' : r.tx_index);
        const v = parseInt((/value (\d+)/.exec(r.detail || '') || [])[1] || '0', 10);
        if (r.result_type === 'input_address') a.outV += v; else a.inV += v;
        if (r.result_type === 'coinbase_address') a.cb = true;
    }
    // Coins the scan found at heights the search did not report (older ranges,
    // or past its 50-result cap): received, transaction unknown.
    const seen = new Set([...m.values()].filter(a => a.inV > 0).map(a => a.h));
    for (const c of s.coins) {
        if (seen.has(c.height)) continue;
        entry(c.height, '?').inV += c.value;
    }
    return [...m.values()].sort((a, b) => b.h - a.h);
}

function actHtml(a) {
    const net = a.inV - a.outV;
    const cls = a.cb ? 'cb' : net >= 0 ? 'in' : 'out';
    const icon = a.cb ? 'pick' : net >= 0 ? 'down' : 'up';
    const open = a.i === '?' ? `go('${a.h}')` : `openTx(${a.h}, '${a.i}', '${addrView.addr}')`;
    return `<div class="act ${cls}" onclick="${open}" title="${a.cb ? 'Mining reward' : net >= 0 ? 'Received' : 'Sent'}">
        <span class="act-ic">${ic(icon)}</span>
        <span class="act-amt">${net >= 0 ? '+' : '−'}${fmtAmtText(Math.abs(net))}</span>
        <span class="act-where">${ic('cube')}${fmtInt(a.h)}${a.i === 'cb' || a.i === '?' ? '' : ` <span class="dim">#${a.i}</span>`}</span>
        <span class="act-age">${approxAge(a.h)}</span>
    </div>`;
}

function purseHtml(coins) {
    coins = coins.slice().sort((a, b) => b.value - a.value);
    if (coins.length <= 24) return coins.map(c => coinTok({ kind: 'coin', value: c.value, coinId: c.coin_id }, 'out', {})).join('');
    const by = new Map();
    for (const c of coins) { if (!by.has(c.value)) by.set(c.value, []); by.get(c.value).push(c); }
    return [...by.entries()].map(([v, cs]) => {
        if (cs.length === 1) return coinTok({ kind: 'coin', value: v, coinId: cs[0].coin_id }, 'out', {});
        const [n, u] = unitParts(v);
        return `<span class="coin stack st-alive" title="${cs.length} × ${v.toLocaleString('en')} MDS"><i class="dot" style="--d:${dotSize(v)}px"></i><b>${n}</b><small>${u}</small><em>×${cs.length}</em></span>`;
    }).join('');
}

function addressHtml() {
    const s = addrView, full = checksummed(s.addr), ix = s.indexed;
    const alive = s.coins.filter(c => coinStatus.get(c.coin_id) === 'alive');
    const bal = ix ? ix.balance : (s.scanning ? null : sum(alive.map(c => c.value)));
    const nCoins = ix ? ix.coins : (s.scanning ? null : alive.length);
    const span = s.to != null ? s.to - s.from : 5000;
    let h = `<div class="ah">${identicon(s.addr, 50)}<div class="ah-main">
            <div class="ah-label">${ic('wallet')}ADDRESS</div>
            <div class="ah-addr"><span>${full}</span><button class="icon-btn" onclick="copyToClipboard('${full}', this)" title="Copy">${ic('copy')}</button></div>
        </div></div>
        <div class="ah-bal">${bal == null ? '<span class="dim">…</span>' : fmtAmt(bal)}</div>
        <div class="chips">
            ${nCoins != null ? `<span class="chip" title="Coins it holds"><i class="dot alive"></i>${fmtInt(nCoins)}</span>` : ''}
            ${ix && ix.rank ? `<span class="chip" title="Rank among holders">#${fmtInt(ix.rank)}</span><span class="chip" title="Share of the supply">${fmtShare(ix.share)}</span>` : ''}
            ${!ix && !s.scanning ? `<span class="chip" title="Balance of the last ${fmtInt(span)} blocks only">${ic('clock')}${fmtInt(span)} blocks</span>` : ''}
        </div>`;

    h += `<div class="sec-title">${ic('coins')}holds ${alive.length ? `<span>${fmtInt(alive.length)}</span>` : ''}</div>`;
    if (s.scanning) h += `<div class="purse">${s.results == null ? `<span class="dim">${ic('hourglass')}</span>` : '<div class="pow-bar" title="Proof of work"><i id="pow-fill"></i></div>'}</div>`;
    else h += `<div class="purse">${alive.length ? purseHtml(alive) : `<span class="dim">${ic('coins')} none in the last ${fmtInt(span)} blocks</span>`}</div>`;

    const acts = s.results == null ? [] : addressActivity(s);
    h += `<div class="sec-title">${ic('activity')}activity ${acts.length ? `<span>${fmtInt(acts.length)}</span>` : ''}</div>`;
    if (s.results == null) h += `<div class="acts"><div class="empty-state" style="padding:20px">${ic('hourglass')}<div class="pow-bar" title="Proof of work"><i id="pow-fill"></i></div></div></div>`;
    else h += `<div class="acts">${acts.length ? acts.map(actHtml).join('') : `<div class="empty-state" style="padding:20px">${ic('activity')}<div class="es-sub">none in the last 5,000 blocks</div></div>`}</div>`;

    if (!s.scanning && s.from > 0) {
        h += `<div class="addr-foot"><button class="btn" onclick="scanOlder(this)">${ic('search')} older blocks</button><span>${fmtInt(s.from)} – ${fmtInt(s.to)}</span></div>`;
    }
    return h;
}

/** Scan the 5,000 blocks before what has been scanned, and add what it finds. */
async function scanOlder(btn) {
    const s = addrView;
    if (!s.addr || !s.from) return;
    const seq = routeSeq, addr = s.addr, to = s.from, from = Math.max(0, to - 5000);
    btn.disabled = true;
    btn.innerHTML = `${ic('hourglass')}<span class="pow-bar"><i id="pow-fill"></i></span>`;
    log(`Solving proof-of-work to scan blocks ${from}–${to}...`, 'i');
    try {
        const coins = await scanRange(addr, from, to);
        await checkCoins(coins.map(c => c.coin_id));
        if (seq !== routeSeq || addrView.addr !== addr) return;
        s.coins = coins.concat(s.coins);
        s.from = from;
        mainView().innerHTML = addressHtml();
        log(`Scanned ${fmtInt(from)}–${fmtInt(to)}: ${coins.length} more coin(s)`, 's');
    } catch (e) {
        log(`Deeper scan error: ${e.message}`, 'e');
        btn.disabled = false;
        btn.innerHTML = `${ic('search')} older blocks`;
    }
}

// ── Polling ─────────────────────────────────────────────────────────────
async function poll() {
    try {
        const [sRes, mRes, pRes] = await Promise.all([
            fetch('/state'), fetch('/mempool'), fetch('/peers')
        ]);
        const state = await sRes.json();
        const mempool = await mRes.json();
        const peers = await pRes.json();

        const prevTip = tipHeight;
        // state.height is the next block to be mined; the highest confirmed batch is height-1
        tipHeight = Math.max(0, state.height - 1);

        $('h-height').textContent = fmtInt(tipHeight);
        $('h-mempool').textContent = fmtInt(mempool.size);
        $('h-reward').textContent = fmtAmtText(state.block_reward);
        $('s-coins').textContent = fmtInt(state.num_coins);
        $('s-commits').textContent = fmtInt(state.num_commitments);
        $('s-safe').textContent = state.safe_depth < Number.MAX_SAFE_INTEGER ? fmtInt(state.safe_depth) : '∞';
        $('s-peers').textContent = peers.peers.length;
        $('live-dot').classList.remove('off');
        $('live-dot').title = state.is_syncing ? 'syncing' : 'live';

        lastMempoolData = mempool;
        lastState = state;

        if (tipHeight !== prevTip) {
            if (prevTip > 0 && tipHeight > prevTip) log(`New block ${fmtInt(tipHeight)}`, 'var(--text-max)');
            // A coin that existed a block ago may not now.
            for (const [k, v] of coinStatus) if (v === 'alive') coinStatus.delete(k);
            if (prevTip > 0) loadRecentStats();
        }

        renderBatchList();
        if (currentTab === 'mempool' && (mainViewContent === 'mempool' || mainViewContent === 'mempool-entering')) renderMempoolView();
        if (supplyDue()) {
            const onTab = currentTab === 'supply';
            loadSupply(onTab).then(() => { if (onTab && currentTab === 'supply') paintSupplyView(); });
        }
    } catch(e) {
        $('live-dot').classList.add('off');
        $('live-dot').title = 'node not reachable';
    }
}

/** The sidebar: the next block (what the mempool holds), then the chain, each
 *  row with how busy the block was and how long ago. */
function renderBatchList() {
    const el = $('batch-list');
    if (!el) return;
    const now = nowSecs();
    const start = Math.max(0, tipHeight - 40);
    let maxTx = 1;
    for (let i = tipHeight; i >= start; i--) {
        const s = recentStats.get(i), c = blockCache[i];
        maxTx = Math.max(maxTx, s ? s.txc : (c ? c.txCount : 0));
    }
    let html = '';
    if (lastMempoolData) {
        const pend = lastMempoolData.size || 0;
        const act = currentTab === 'mempool' ? ' active' : '';
        html += `<div class="batch-item next${act}" onclick="switchTab('mempool')" title="Waiting for the next block: ${pend}">
            <span class="num">${ic('hourglass')}next</span><span class="bl-bar"><i style="width:${Math.min(100, pend / maxTx * 100).toFixed(0)}%"></i></span><span class="txc">${fmtInt(pend)}</span></div>`;
    }
    for (let i = tipHeight; i >= start; i--) {
        const s = recentStats.get(i), c = blockCache[i];
        const txc = s ? s.txc : (c ? c.txCount : null);
        const pct = txc == null ? 0 : Math.max(txc ? 4 : 0, txc / maxTx * 100);
        const age = s ? fmtAge(Math.max(0, now - s.ts)) : '';
        const cls = (i === activeBatch && currentTab === 'explorer') ? ' active' : '';
        html += `<div class="batch-item${cls}" onclick="go('${i}')" title="${txc != null ? txc + ' transactions' : ''}">
            <span class="num">${fmtInt(i)}</span><span class="bl-bar"><i style="width:${pct.toFixed(0)}%"></i></span><span class="txc">${age}</span></div>`;
    }
    // Re-assigning innerHTML resets the sidebar's scroll position, so only
    // repaint when the list actually changed — and keep the scroll when it did.
    if (html === lastBatchListHtml) return;
    lastBatchListHtml = html;
    const prevScroll = el.scrollTop;
    el.innerHTML = html;
    el.scrollTop = prevScroll;
}

// ── Mempool ─────────────────────────────────────────────────────────────
// Two queues, each sorted by its TRUE priority key — the order the mempool
// evicts from: sealed commits by achieved proof of work, transfers by fee per KB.

function mpTxId(t) { return (t.ins[0] && t.ins[0].coinId) || t.commitment || ''; }

// Look for a query in the live mempool snapshot. Returns a description and,
// for transfers, the card id to open — or null when nothing pends.
function findInMempool(q) {
    const txs = lastMempoolData ? lastMempoolData.transactions || [] : [];
    for (const raw of txs) {
        const t = normMempoolTx(raw);
        if (t.kind === 'commit') { if (t.commitment === q) return { desc: 'sealed, waiting for a block', id: null }; continue; }
        // A reveal's top-level commitment IS its phase-1 seal. (An input's own
        // `commitment` is a state thread's data commitment — a different thing.)
        if (t.commitment === q) return { desc: 'transfer waiting for a block', id: mpTxId(t) };
        if (t.ins.some(i => i.coinId === q)) return { desc: 'coin being spent', id: mpTxId(t) };
        if (t.outs.some(o => o.coinId === q)) return { desc: 'coin being created', id: mpTxId(t) };
        if (t.ins.some(i => i.addr === q) || t.outs.some(o => o.addr === q)) return { desc: 'address in a waiting transfer', id: mpTxId(t) };
    }
    return null;
}

function pendingSpendOf(coinId) {
    return (lastMempoolData && lastMempoolData.transactions || [])
        .some(t => (t.input_coins || []).includes(coinId) || (t.inputs || []).some(i => i.coin_id === coinId));
}

function mpFocusCommit(c) {
    activeQuery = c;
    const pair = (lastMempoolData && lastMempoolData.transactions || []).map(normMempoolTx)
        .find(t => t.kind !== 'commit' && t.commitment === c);
    if (pair) mpExpanded.add(mpTxId(pair));
    mpScrollPending = true;
    renderMempoolView();
}

function renderMempoolView() {
    const mv = mainView();
    const data = lastMempoolData;
    if (!data) { mv.innerHTML = loadingHtml(); return; }

    const txs = (data.transactions || []).map(normMempoolTx);
    const commits = txs.filter(t => t.kind === 'commit').sort((a, b) => (b.pow ?? -1) - (a.pow ?? -1));
    const reveals = txs.filter(t => t.kind !== 'commit').sort((a, b) => (b.rate ?? b.fee ?? 0) - (a.rate ?? a.fee ?? 0));
    const reqPow = lastState ? lastState.required_pow : null;
    const revealSet = new Set(reveals.map(r => r.commitment).filter(Boolean));
    const commitSet = new Set(commits.map(c => c.commitment));
    const totalFees = sum(reveals.map(r => r.fee));
    const totalBytes = sum(reveals.map(r => r.size || 0));
    txReg.clear();

    let html = `<div class="mempool-split">`;

    // ── Phase 1: sealed commitments (priority = proof of work) ──
    html += `<div class="mp-col"><div class="mp-col-hdr">${ic('lock')}SEALED · ${commits.length}${reqPow != null ? ` · ≥ ${reqPow} BITS` : ''}</div><div class="mp-col-body">`;
    if (commits.length === 0) html += `<div class="empty-state" style="padding:24px 8px">${ic('lock')}<div class="es-sub">empty</div></div>`;
    const CCAP = 200;
    commits.slice(0, CCAP).forEach(c => {
        const strength = reqPow != null && c.pow != null ? Math.max(0.08, Math.min(1, (c.pow - reqPow + 2) / 10)) : 0.5;
        const paired = revealSet.has(c.commitment);
        const hl = c.commitment === activeQuery ? ' mp-match' : '';
        html += `<div class="mp-row${hl}" onclick="mpFocusCommit('${c.commitment}')" title="${c.commitment}">
            <span class="mp-hash">${ic('lock')}${shortHex(c.commitment)}</span>
            <span class="mp-row-right"><span class="mp-dim mp-age" title="Waiting">${fmtAge(c.age)}</span>${paired ? `<span class="mp-flag" title="Its reveal is waiting too">${ic('link')}</span>` : ''}<span class="pow-meter" title="${c.pow ?? '?'} bits of proof of work${reqPow != null ? ` (≥ ${reqPow} required)` : ''}"><i style="width:${(strength * 100).toFixed(0)}%"></i></span></span>
        </div>`;
    });
    if (commits.length > CCAP) html += `<div class="mp-note">+ ${commits.length - CCAP} more, weakest last</div>`;
    html += `</div></div>`;

    // ── Phase 2: transfers (priority = fee per byte) ──
    const sizeStat = totalBytes > 0 ? ` · ${(totalBytes / 1024).toFixed(1)} KB` : '';
    html += `<div class="mp-col wide"><div class="mp-col-hdr">${ic('transfer')}TRANSFERS · ${reveals.length}${reveals.length ? ` · ${ic('pick')}${fmtAmtText(totalFees)}${sizeStat}` : ''}</div><div class="mp-col-body">`;
    if (reveals.length === 0) {
        html += `<div class="empty-state" style="padding:24px 8px">${ic('transfer')}<div class="es-sub">empty</div></div>`;
    } else {
        const rates = reveals.map(x => x.rate).filter(v => v != null).sort((a, b) => a - b);
        if (rates.length >= 2) {
            const med = rates[Math.floor(rates.length / 2)];
            html += `<div class="mp-ladder" title="Fee per KB already waiting: pay more to go first">fee /KB · top ${rates[rates.length - 1]} · median ${med} · low ${rates[0]}</div>`;
        }
        const RCAP = 100;
        reveals.slice(0, RCAP).forEach(r => {
            const id = mpTxId(r);
            const match = txTouches(r, activeQuery);
            html += txCardHtml(r, { key: 'mp:' + id, pending: true, open: mpExpanded.has(id), all: mpUnfolded.has(id), match, sealedHere: commitSet.has(r.commitment) });
        });
        if (reveals.length > RCAP) html += `<div class="mp-note">+ ${reveals.length - RCAP} more, cheapest per byte last</div>`;
    }
    html += `</div></div></div>`;

    // ── Disruption-free update ──
    // Re-assigning innerHTML rebuilds both scroll containers from scratch,
    // yanking the reader back to the top every poll. Three tiers instead:
    //   1. Identical repaint            -> skip entirely.
    //   2. Only the age chips ticked    -> patch their text in the live DOM.
    //   3. Genuine structural change    -> repaint, then restore scroll.
    const stripAges = h => h.replace(/(<span class="mp-dim mp-age"[^>]*>)[^<]*(<\/span>)/g, '$1$2');
    if (mainViewContent === 'mempool' && html === lastMempoolHtml) {
        // Nothing changed.
    } else if (mainViewContent === 'mempool' && stripAges(html) === stripAges(lastMempoolHtml)) {
        const newAges = [...html.matchAll(/class="mp-dim mp-age"[^>]*>([^<]*)</g)].map(m => m[1]);
        mv.querySelectorAll('.mp-age').forEach((el, i) => {
            if (newAges[i] != null) el.textContent = newAges[i];
        });
        lastMempoolHtml = html;
    } else {
        const prevMain = mv.scrollTop;
        const prevCols = Array.from(mv.querySelectorAll('.mp-col-body')).map(el => el.scrollTop);
        mv.innerHTML = html;
        lastMempoolHtml = html;
        mv.scrollTop = prevMain;
        mv.querySelectorAll('.mp-col-body').forEach((el, i) => {
            if (prevCols[i] != null) el.scrollTop = prevCols[i];
        });
        drawFlows(mv);
    }
    mainViewContent = 'mempool';

    if (mpScrollPending) {
        mpScrollPending = false;
        const m = mv.querySelector('.mp-match');
        if (m && m.scrollIntoView) m.scrollIntoView({ block: 'center' });
    }
}

            <div class="stat-box"><div class="lbl">PEAK TX/BLOCK</div><div class="val">${maxTxs}</div></div>
        </div>`;

        // Bar Chart (Tx Count)
        let txBars = '';
        blocks.forEach(b => {
            const hPct = (b.tx_count / maxTxs) * 100;

        });

            <div class="bar-chart">${txBars}</div>
        </div>`;

        // Bar Chart (Block Times)
        let timeBars = '';
        let blockTimes = blocks.map((b, i) => i === 0 ? 60 : Math.max(0, b.timestamp - blocks[i-1].timestamp));
        let maxTime = Math.max(...blockTimes, 120);

        blockTimes.forEach((t, i) => {

// ── Supply & rich list ──────────────────────────────────────────────────
// Figures come from the node's rich-list index (--rich-list), via /supply and
// /richlist. Amounts are base MDS; 1 gMDS = 2^30 MDS. Every amount the chain
// can hold is below 2^53, so plain Numbers are exact.
const MDS_PER_GMDS = 1073741824;
let lastSupply = null;
let lastRichList = null;
let supplyFetched = { tip: -1, at: 0 };
let lastSupplyHtml = '';

function fmtInt(n) { return Number(n).toLocaleString('en'); }

// gMDS with a fixed number of decimals (tables line up).
function fmtG(n, dp = 2) {
    return (Number(n) / MDS_PER_GMDS).toLocaleString('en', { minimumFractionDigits: dp, maximumFractionDigits: dp });
}

// gMDS with only the decimals it needs: 1, 0.5, 0.0001.
function fmtGShort(n) {
    return (Number(n) / MDS_PER_GMDS).toLocaleString('en', { maximumFractionDigits: 6 });
}

function fmtShare(f) {
    const p = f * 100;
    if (p === 0) return '0%';
    if (p < 0.01) return '<0.01%';
    return (p >= 10 ? p.toFixed(1) : p.toFixed(2)) + '%';
}

function fmtDuration(blocks) {
    const days = blocks * 60 / 86400;
    if (days >= 2) return `~${Math.round(days).toLocaleString('en')} days`;
    const hours = blocks / 60;
    return hours >= 2 ? `~${Math.round(hours)} hours` : `~${blocks} min`;
}

// Is it time to refetch? On every new block, and every 10s while the index builds.
function supplyDue() {
    const s = lastSupply;
    const building = s && (s.index.status === 'building' || s.index.status === 'rebuilding');
    return supplyFetched.tip !== tipHeight || (building && Date.now() - supplyFetched.at > 10000);
}

async function loadSupply(withRichList) {
    supplyFetched = { tip: tipHeight, at: Date.now() };
    try {
        const r = await fetch('/supply');
        if (r.ok) lastSupply = await r.json();
    } catch (e) { /* keep the last figures */ }
    if (withRichList && lastSupply && lastSupply.index.status === 'ready') {
        try {
            const r = await fetch('/richlist?limit=100');
            lastRichList = r.ok ? await r.json() : null;
        } catch (e) { /* keep the last list */ }
    }
    renderSupplyMetric();
}

function renderSupplyMetric() {
    const el = document.getElementById('s-supply');
    const s = lastSupply;
    if (!el || !s) return;
    if (s.circulating_supply != null) {
        el.textContent = fmtG(s.circulating_supply, 0) + ' gMDS';
        el.title = `${fmtInt(s.circulating_supply)} MDS at block ${fmtInt(s.height)}`;
    } else {
        el.textContent = s.index.status === 'disabled' ? 'index off' : s.index.status;
        el.title = s.index.detail || '';
    }
}

async function showSupplyView() {
    mainViewContent = 'supply';
    lastSupplyHtml = '';
    if (lastSupply) paintSupplyView();
    else document.getElementById('main-view').innerHTML =
        `<div style="padding:20px; color:var(--text-faint);">Loading supply…</div>`;
    await loadSupply(true);
    if (currentTab === 'supply') paintSupplyView();
}

function paintSupplyView() {
    const s = lastSupply;
    if (!s || currentTab !== 'supply') return;
    const mv = document.getElementById('main-view');
    const ix = s.index;
    const ready = ix.status === 'ready';
    const origin = window.location.origin;
    const circ = s.circulating_supply;

    let html = `<div class="block-hdr"><h2>SUPPLY</h2>
        <span class="supply-asof">block ${fmtInt(s.height)} · index ${escHtml(ix.status)}</span></div>`;

    const box = (lbl, val, sub) =>
        `<div class="stat-box"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
    html += `<div class="stat-grid">`;
    html += circ != null
        ? box('Circulating', fmtG(circ), `gMDS · ${fmtInt(circ)} MDS`)
        : box('Circulating', '—', ix.status === 'disabled' ? 'needs the rich-list index' : `index ${escHtml(ix.status)}`);
    html += box('Max supply', fmtG(s.max_supply, 0), `gMDS · ${fmtInt(s.max_supply)} MDS`);
    html += box('Issued', fmtG(s.issued), `gMDS · ${(s.issued / s.max_supply * 100).toFixed(2)}% of max`);
    html += s.burned != null
        ? box('Burned', fmtG(s.burned), `gMDS · genesis ${fmtGShort(s.burned_genesis)} + data burns ${fmtGShort(s.burned_data)}`)
        : box('Burned', fmtG(s.burned_genesis), 'gMDS genesis · data burns need the index');
    html += `</div>`;

    const pct = Math.min(100, s.issued / s.max_supply * 100);
    html += `<div class="supply-bar" title="${pct.toFixed(2)}% of the scheduled supply issued"><div style="width:${pct.toFixed(3)}%"></div></div>`;

    const facts = [['Block reward', `${fmtGShort(s.block_reward)} gMDS`]];
    if (s.next_halving_height != null) {
        const left = s.next_halving_height - (s.height + 1);
        facts.push(['Next halving', `block ${fmtInt(s.next_halving_height)} · in ${fmtInt(left)} blocks (${fmtDuration(left)})`]);
    }
    facts.push(['Tail emission', `${s.tail_emission.per_block} MDS per block from block ${fmtInt(s.tail_emission.from_height)}`]);
    if (s.unspent_coins != null) facts.push(['Unspent coins', fmtInt(s.unspent_coins)]);
    if (s.holders != null) facts.push(['Holders', fmtInt(s.holders)]);
    if (s.verified != null) facts.push(['Supply check', s.verified
        ? '✓ unspent coins add up to issued − burned'
        : '✗ unspent coins do not add up to issued − burned']);
    html += `<div class="meta-grid">` + facts.map(([k, v]) =>
        `<div class="field"><div class="lbl">${k}</div><div class="hex supply-fact">${v}</div></div>`).join('') + `</div>`;

    if (!ready) {
        let note;
        if (ix.status === 'disabled') {
            note = `Circulating supply and the rich list come from the rich-list index, which this node does not keep.
                Start it with <code>--rich-list</code> (or <code>rich_list = true</code> in config.toml) on an archival node;
                it builds from genesis in the background.`;
        } else if (ix.status === 'building' && ix.chain_blocks > 0) {
            const p = ix.indexed_blocks / ix.chain_blocks * 100;
            note = `Building the rich-list index: block ${fmtInt(ix.indexed_blocks)} of ${fmtInt(ix.chain_blocks)} (${p.toFixed(1)}%).
                Circulating supply and the top 100 appear when it finishes.`;
        } else {
            note = escHtml(ix.detail || `The rich-list index is ${ix.status}.`);
        }
        html += `<div class="supply-note">${note}</div>`;
    }

    const rl = ready ? lastRichList : null;
    if (rl) {
        html += `<div class="supply-title">Top ${rl.entries.length} holders
            <span class="dim">· ${fmtInt(rl.holders)} holders · top 10 hold ${fmtShare(rl.top_10_share)} · top 100 hold ${fmtShare(rl.top_100_share)}</span></div>`;
        html += `<table class="rich-table"><thead><tr>
            <th>#</th><th>Address</th><th class="num">gMDS</th><th class="num wide">MDS</th><th class="num">Share</th><th class="num wide">Coins</th>
            </tr></thead><tbody>`;
        for (const e of rl.entries) {
            const a = escHtml(e.address);
            html += `<tr>
                <td class="rank">${e.rank}</td>
                <td><a onclick="go('${a}')" title="${a}"><span class="addr-long">${a.substring(0, 20)}…${a.substring(60)}</span><span class="addr-short">${a.substring(0, 8)}…${a.substring(66)}</span></a></td>
                <td class="num">${fmtG(e.balance)}</td>
                <td class="num wide">${fmtInt(e.balance)}</td>
                <td class="num">${fmtShare(e.share)}</td>
                <td class="num wide">${fmtInt(e.coins)}</td>
            </tr>`;
        }
        html += `</tbody></table>`;
        if (rl.excluded.length) {
            const g = rl.excluded.reduce((t, x) => t + x.balance, 0);
            html += `<div class="supply-dim-note">Not listed: ${rl.excluded.length} genesis outputs (${fmtGShort(g)} gMDS) paid to the
                genesis inscription. No key can spend them, so supply counts them as burned.</div>`;
        }
    }

    const ep = (label, path, value) => `<div class="api-row">
        <span class="api-k">${label}</span><code>${escHtml(origin + path)}</code>
        ${value != null ? `<span class="api-v">${value}</span>` : ''}
        <button class="btn" onclick="copyToClipboard('${escHtml(origin + path)}', this)">Copy</button></div>`;
    html += `<div class="supply-title">For listing sites</div><div class="api-box">`;
    html += ep('Circulating supply', '/supply/circulating', circ != null ? circ : 'not ready');
    html += ep('Total supply', '/supply/total', s.total_supply != null ? s.total_supply : 'not ready');
    html += ep('Max supply', '/supply/max', s.max_supply);
    html += ep('All figures (JSON)', '/supply', null);
    html += ep('Rich list (JSON)', '/richlist?limit=100', null);
    html += ep('Rich list page', '/?richlist', null);
    html += `<div class="api-note">The three supply URLs answer with a bare number, in MDS: the unit MDS trades in
        (1 gMDS = 2<sup>30</sup> MDS). There is no premine, treasury or team allocation, so circulating supply equals total
        supply: everything issued, minus the burned genesis reward and value destroyed by data burns. Max supply is the
        halving schedule's total; a tail of 1 MDS per block follows it.</div></div>`;

    if (html === lastSupplyHtml) return;
    lastSupplyHtml = html;
    const top = mv.scrollTop;
    mv.innerHTML = html;
    mv.scrollTop = top;
}

});

// Visibility-aware polling: 3s while the tab is visible, 15s in the
// background, and an immediate refresh the moment the tab regains focus.
let pollTimer = null;
function schedulePoll() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(async () => { await poll(); schedulePoll(); }, document.hidden ? 15000 : 3000);
}
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) poll();
    schedulePoll();
});

// Deep links: /?q=<height|hash|address>, /?<height>, /?richlist, /?tx=<h>.<i>.
// With none, the latest block.
(async function init() {
    mainView().innerHTML = loadingHtml();
    await poll();
    loadRecentStats();
    schedulePoll();
    const s = parseLocation();
    history.replaceState(s, '', window.location.href);
    route(s);
})();
</script>
